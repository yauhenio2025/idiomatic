<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two parallel reference lines show sich returning to the subject Lara while ihr points to a different woman">
  <text x="420" y="42" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">Trace the reference line</text>
  <text x="52" y="113" font-size="17" font-weight="700" class="s-muted">SUBJECT</text>
  <rect x="50" y="128" width="190" height="70" rx="14" class="s-tile" stroke-width="2"/>
  <text x="145" y="171" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Lara</text>
  <rect x="325" y="128" width="190" height="70" rx="14" class="s-tile" stroke-width="2"/>
  <text x="420" y="171" text-anchor="middle" font-size="27" font-weight="700" class="s-teal">sich</text>
  <text x="565" y="113" font-size="17" font-weight="700" class="s-muted">REFERENT</text>
  <line x1="525" y1="163" x2="609" y2="163" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="618,163 607,156 607,170" class="s-teal"/>
  <rect x="626" y="128" width="164" height="70" rx="14" class="s-tile" stroke-width="3"/>
  <text x="708" y="158" text-anchor="middle" font-size="23" font-weight="700" class="s-teal">Lara</text>
  <text x="708" y="183" text-anchor="middle" font-size="16" class="s-muted">same person</text>
  <text x="52" y="271" font-size="17" font-weight="700" class="s-muted">SUBJECT</text>
  <rect x="50" y="286" width="190" height="70" rx="14" class="s-tile" stroke-width="2"/>
  <text x="145" y="329" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Lara</text>
  <rect x="325" y="286" width="190" height="70" rx="14" class="s-tile" stroke-width="2"/>
  <text x="420" y="329" text-anchor="middle" font-size="27" font-weight="700" class="s-coral">ihr</text>
  <text x="565" y="271" font-size="17" font-weight="700" class="s-muted">REFERENT</text>
  <line x1="525" y1="321" x2="609" y2="321" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="618,321 607,314 607,328" class="s-coral"/>
  <rect x="626" y="286" width="164" height="70" rx="14" class="s-tile" stroke-width="3"/>
  <text x="708" y="316" text-anchor="middle" font-size="22" font-weight="700" class="s-coral">andere Frau</text>
  <text x="708" y="341" text-anchor="middle" font-size="16" class="s-muted">different person</text>
  <text x="420" y="407" text-anchor="middle" font-size="19" class="s-muted">case alone is not enough — reference decides the form</text>
</svg>

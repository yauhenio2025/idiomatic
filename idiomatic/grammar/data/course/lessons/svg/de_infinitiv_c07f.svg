<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="title desc">
  <title id="title">Families that license a bare infinitive</title>
  <desc id="desc">Modal, perception, causative, motion and position verbs are the main families that select infinitives without zu.</desc>
  <text x="320" y="31" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Zero is selected by a small set of heads</text>
  <rect x="20" y="62" width="188" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <rect x="226" y="62" width="188" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <rect x="432" y="62" width="188" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <rect x="123" y="210" width="188" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <rect x="329" y="210" width="188" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <text x="114" y="96" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="17" font-weight="700">MODAL</text>
  <text x="114" y="127" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">muss ändern</text>
  <text x="114" y="151" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">ability / necessity</text>
  <text x="320" y="96" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="17" font-weight="700">PERCEPTION</text>
  <text x="320" y="127" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">hörte zufallen</text>
  <text x="320" y="151" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">witnessed event</text>
  <text x="526" y="96" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="17" font-weight="700">LASSEN</text>
  <text x="526" y="127" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">ließ prüfen</text>
  <text x="526" y="151" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">permit / cause</text>
  <text x="217" y="244" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">MOTION</text>
  <text x="217" y="275" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">fährt kaufen</text>
  <text x="217" y="299" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">purpose activity</text>
  <text x="423" y="244" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">POSITION</text>
  <text x="423" y="275" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">blieb stehen</text>
  <text x="423" y="299" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">maintained state</text>
  <text x="320" y="352" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">outside these licensed families, do not drop zu</text>
</svg>

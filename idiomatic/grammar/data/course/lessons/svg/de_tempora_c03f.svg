<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision diagram contrasting a present tense made future by context with an explicit future tense">
  <text x="420" y="42" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">How German points forward</text>

  <rect x="45" y="92" width="210" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-size="20" font-weight="700" class="s-teal">FUTURE CUE</text>
  <text x="150" y="158" text-anchor="middle" font-size="16" class="s-muted">date · plan · context</text>
  <line x1="263" y1="138" x2="317" y2="138" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="327,138 313,130 313,146" class="s-teal"/>
  <rect x="335" y="92" width="190" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">TIME IS CLEAR</text>
  <text x="430" y="158" text-anchor="middle" font-size="16" class="s-muted">no extra marking needed</text>
  <line x1="533" y1="138" x2="587" y2="138" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="597,138 583,130 583,146" class="s-teal"/>
  <rect x="605" y="92" width="190" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="700" y="130" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">PRESENT</text>
  <text x="700" y="158" text-anchor="middle" font-size="16" class="s-muted">the usual choice</text>

  <rect x="45" y="260" width="210" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="150" y="296" text-anchor="middle" font-size="20" font-weight="700" class="s-coral">NO CLEAR CUE</text>
  <text x="150" y="326" text-anchor="middle" font-size="16" class="s-muted">present reading competes</text>
  <line x1="263" y1="306" x2="317" y2="306" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="327,306 313,298 313,314" class="s-coral"/>
  <rect x="335" y="260" width="190" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="430" y="298" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">DISAMBIGUATE</text>
  <text x="430" y="326" text-anchor="middle" font-size="16" class="s-muted">or stress a prediction</text>
  <line x1="533" y1="306" x2="587" y2="306" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="597,306 583,298 583,314" class="s-coral"/>
  <rect x="605" y="260" width="190" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="700" y="298" text-anchor="middle" font-size="22" font-weight="700" class="s-coral">FUTURE</text>
  <text x="700" y="326" text-anchor="middle" font-size="16" class="s-muted">make the stance explicit</text>
  <text x="420" y="406" text-anchor="middle" font-size="18" class="s-muted">Context normally does the temporal work.</text>
</svg>

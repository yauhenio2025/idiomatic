<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three lanes route an individual person to a preposition plus pronoun and a thing or whole clause to a da compound">
  <text x="420" y="38" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">After a preposition: what is the referent?</text>
  <rect x="40" y="72" width="235" height="72" rx="13" class="s-tile" stroke-width="2"/>
  <text x="158" y="103" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">individual person</text>
  <text x="158" y="129" text-anchor="middle" font-size="17" class="s-muted">die Beraterin</text>
  <text x="420" y="88" text-anchor="middle" font-size="17" class="s-muted">personal reference</text>
  <line x1="285" y1="111" x2="551" y2="111" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="560,111 549,104 549,118" class="s-teal"/>
  <rect x="568" y="72" width="232" height="72" rx="13" class="s-tile" stroke-width="3"/>
  <text x="684" y="118" text-anchor="middle" font-size="26" font-weight="800" class="s-teal">auf sie</text>
  <rect x="40" y="183" width="235" height="72" rx="13" class="s-tile" stroke-width="2"/>
  <text x="158" y="214" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">thing or idea</text>
  <text x="158" y="240" text-anchor="middle" font-size="17" class="s-muted">der Zeitplan</text>
  <text x="420" y="199" text-anchor="middle" font-size="17" class="s-muted">pronominal reference</text>
  <line x1="285" y1="222" x2="551" y2="222" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="560,222 549,215 549,229" class="s-coral"/>
  <rect x="568" y="183" width="232" height="72" rx="13" class="s-tile" stroke-width="3"/>
  <text x="684" y="229" text-anchor="middle" font-size="26" font-weight="800" class="s-coral">darauf</text>
  <rect x="40" y="294" width="235" height="72" rx="13" class="s-tile" stroke-width="2"/>
  <text x="158" y="325" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">whole clause</text>
  <text x="158" y="351" text-anchor="middle" font-size="17" class="s-muted">the decision</text>
  <text x="420" y="310" text-anchor="middle" font-size="17" class="s-muted">package the event</text>
  <line x1="285" y1="333" x2="551" y2="333" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="560,333 549,326 549,340" class="s-teal"/>
  <rect x="568" y="294" width="232" height="72" rx="13" class="s-tile" stroke-width="3"/>
  <text x="684" y="340" text-anchor="middle" font-size="26" font-weight="800" class="s-teal">darüber</text>
  <text x="420" y="409" text-anchor="middle" font-size="18" class="s-muted">a vowel-initial preposition takes the linking r</text>
</svg>

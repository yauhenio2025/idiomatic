<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">Three non-finite German verb forms</title>
  <desc id="desc">The infinitive builds a clause, Partizip I packages an active relation, and Partizip II packages a completed or passive relation.</desc>
  <text x="320" y="32" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">One event, three non-finite tools</text>
  <rect x="25" y="64" width="180" height="238" rx="14" class="s-tile" stroke-width="2"/>
  <rect x="230" y="64" width="180" height="238" rx="14" class="s-tile" stroke-width="2"/>
  <rect x="435" y="64" width="180" height="238" rx="14" class="s-tile" stroke-width="2"/>
  <text x="115" y="103" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Infinitiv</text>
  <text x="320" y="103" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Partizip I</text>
  <text x="525" y="103" text-anchor="middle" class="s-sun" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Partizip II</text>
  <line x1="47" y1="122" x2="183" y2="122" class="s-stroke-line" stroke-width="2"/>
  <line x1="252" y1="122" x2="388" y2="122" class="s-stroke-line" stroke-width="2"/>
  <line x1="457" y1="122" x2="593" y2="122" class="s-stroke-line" stroke-width="2"/>
  <text x="115" y="163" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">prüfen</text>
  <text x="320" y="163" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">prüfend</text>
  <text x="525" y="163" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">geprüft</text>
  <text x="115" y="215" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">builds a clause</text>
  <text x="320" y="215" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">active relation</text>
  <text x="525" y="215" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">completed / passive</text>
  <text x="115" y="258" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">no agreement</text>
  <text x="320" y="258" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">adjective-like</text>
  <text x="525" y="258" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">adjective / compound</text>
</svg>

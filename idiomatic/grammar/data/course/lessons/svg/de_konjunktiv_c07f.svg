<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reported speech pipeline: preserve event time, try Konjunktiv I, and use Konjunktiv II only when the first form collides with the indicative">
  <text x="420" y="38" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">THE FORMAL REPORTING PIPELINE</text>
  <rect x="25" y="160" width="210" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="130" y="198" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">1 · KEEP TIME</text>
  <text x="130" y="232" text-anchor="middle" font-size="17" class="s-ink">same-time or earlier?</text>
  <line x1="245" y1="210" x2="300" y2="210" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="310,210 294,201 294,219" class="s-teal"/>
  <rect x="320" y="160" width="210" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="425" y="198" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">2 · TRY K I</text>
  <text x="425" y="232" text-anchor="middle" font-size="17" class="s-ink">is the form distinct?</text>
  <line x1="540" y1="210" x2="570" y2="210" class="s-stroke-line" stroke-width="4"/>
  <line x1="570" y1="125" x2="570" y2="315" class="s-stroke-line" stroke-width="4"/>
  <line x1="570" y1="125" x2="605" y2="125" class="s-stroke-teal" stroke-width="5"/>
  <polygon points="615,125 599,116 599,134" class="s-teal"/>
  <text x="585" y="101" text-anchor="middle" font-size="15" class="s-muted">distinct</text>
  <rect x="625" y="75" width="190" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="720" y="114" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">KEEP K I</text>
  <text x="720" y="148" text-anchor="middle" font-size="18" class="s-ink">sie komme</text>
  <line x1="570" y1="315" x2="605" y2="315" class="s-stroke-coral" stroke-width="5"/>
  <polygon points="615,315 599,306 599,324" class="s-coral"/>
  <text x="585" y="291" text-anchor="middle" font-size="15" class="s-muted">collision</text>
  <rect x="625" y="265" width="190" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="720" y="304" text-anchor="middle" font-size="21" font-weight="800" class="s-coral">USE K II</text>
  <text x="720" y="338" text-anchor="middle" font-size="18" class="s-ink">sie kämen</text>
  <text x="420" y="410" text-anchor="middle" font-size="18" class="s-muted">The goal is a visible report marker, not automatic doubt.</text>
</svg>

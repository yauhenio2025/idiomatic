<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-way German contrast between a surface, a surrounding space, and motion across a boundary">
  <text x="420" y="46" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">WHAT RELATION ARE YOU DESCRIBING?</text>
  <rect x="35" y="102" width="240" height="252" rx="16" class="s-tile" stroke-width="3"/>
  <text x="155" y="145" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">SURFACE</text>
  <line x1="75" y1="170" x2="235" y2="170" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <text x="155" y="222" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">außen</text>
  <text x="155" y="273" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">innen</text>
  <text x="155" y="322" text-anchor="middle" font-size="17" class="s-muted">outer / inner face</text>
  <rect x="300" y="102" width="240" height="252" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="145" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">SPACE</text>
  <line x1="340" y1="170" x2="500" y2="170" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <text x="420" y="222" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">draußen</text>
  <text x="420" y="273" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">drinnen</text>
  <text x="420" y="322" text-anchor="middle" font-size="17" class="s-muted">outside / inside a place</text>
  <rect x="565" y="102" width="240" height="252" rx="16" class="s-tile" stroke-width="3"/>
  <text x="685" y="145" text-anchor="middle" font-size="20" font-weight="800" class="s-sun">MOTION</text>
  <line x1="605" y1="170" x2="765" y2="170" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <text x="685" y="222" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">hinaus</text>
  <text x="685" y="273" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">herein</text>
  <text x="685" y="322" text-anchor="middle" font-size="17" class="s-muted">across the boundary</text>
  <text x="420" y="414" text-anchor="middle" font-size="20" class="s-muted">same English cue — three different physical relations</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="Demonstratives arranged by spoken register, written pointing, selection and strict identity">
  <text x="320" y="31" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">Pointing becomes more precise</text>
  <rect x="35" y="58" width="175" height="82" rx="12" class="s-tile"/>
  <text x="122" y="82" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">SPOKEN</text>
  <text x="122" y="110" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">der hier / da</text>
  <text x="122" y="130" text-anchor="middle" font-size="13" class="s-muted">near or distant</text>
  <rect x="233" y="58" width="175" height="82" rx="12" class="s-tile"/>
  <text x="320" y="82" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">WRITTEN POINTER</text>
  <text x="320" y="110" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">dieser</text>
  <text x="320" y="130" text-anchor="middle" font-size="13" class="s-muted">near or recent</text>
  <rect x="430" y="58" width="175" height="82" rx="12" class="s-tile"/>
  <text x="517" y="82" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">SELECTED MEMBER</text>
  <text x="517" y="110" text-anchor="middle" font-size="23" font-weight="700" class="s-coral">derjenige</text>
  <text x="517" y="130" text-anchor="middle" font-size="13" class="s-muted">defined by a clause</text>
  <text x="320" y="177" text-anchor="middle" font-size="15" font-weight="700" class="s-muted">IDENTITY TEST</text>
  <rect x="92" y="193" width="205" height="84" rx="12" class="s-tile"/>
  <text x="194" y="225" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">derselbe</text>
  <text x="194" y="252" text-anchor="middle" font-size="15" class="s-ink">the very same object</text>
  <text x="320" y="242" text-anchor="middle" font-size="28" font-weight="700" class="s-coral">≠</text>
  <rect x="343" y="193" width="205" height="84" rx="12" class="s-tile"/>
  <text x="445" y="225" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">der gleiche</text>
  <text x="445" y="252" text-anchor="middle" font-size="15" class="s-ink">one of the same kind</text>
</svg>

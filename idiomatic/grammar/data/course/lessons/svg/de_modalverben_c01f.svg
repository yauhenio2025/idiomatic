<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="The same event under three different modal stances">
  <text x="320" y="30" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Same event, different stance</text>
  <rect x="20" y="58" width="185" height="64" rx="12" class="s-tile"/>
  <text x="112.5" y="84" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="20" font-weight="700">muss</text>
  <text x="112.5" y="106" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">necessity</text>
  <rect x="227.5" y="58" width="185" height="64" rx="12" class="s-tile"/>
  <text x="320" y="84" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="20" font-weight="700">darf</text>
  <text x="320" y="106" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">permission</text>
  <rect x="435" y="58" width="185" height="64" rx="12" class="s-tile"/>
  <text x="527.5" y="84" text-anchor="middle" class="s-sun" font-family="system-ui, sans-serif" font-size="20" font-weight="700">kann</text>
  <text x="527.5" y="106" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">ability</text>
  <text x="320" y="162" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="28">+</text>
  <rect x="105" y="188" width="430" height="78" rx="14" class="s-tile"/>
  <text x="320" y="222" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Mara … das Fenster öffnen</text>
  <text x="320" y="248" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">the proposition remains constant</text>
</svg>

<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three high-yield default routes from noun gender and shape to German plural formation">
  <text x="420" y="40" text-anchor="middle" font-size="23" font-weight="800" class="s-ink">HIGH-YIELD PLURAL ROUTES</text>
  <rect x="40" y="70" width="230" height="96" rx="16" class="s-tile" stroke-width="2"/>
  <text x="155" y="107" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">MOST FEMININES</text>
  <text x="155" y="139" text-anchor="middle" font-size="17" class="s-muted">across many shapes</text>
  <line x1="155" y1="176" x2="155" y2="206" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <rect x="40" y="216" width="230" height="118" rx="16" class="s-tile" stroke-width="2"/>
  <text x="155" y="258" text-anchor="middle" font-size="25" font-weight="800" class="s-coral">-(e)n</text>
  <text x="155" y="298" text-anchor="middle" font-size="18" class="s-ink">Besprechungen</text>
  <rect x="305" y="70" width="230" height="96" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="107" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">M/N IN -EL/-EN/-ER</text>
  <text x="420" y="139" text-anchor="middle" font-size="17" class="s-muted">unstressed final syllable</text>
  <line x1="420" y1="176" x2="420" y2="206" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <rect x="305" y="216" width="230" height="118" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="258" text-anchor="middle" font-size="25" font-weight="800" class="s-teal">zero ending</text>
  <text x="420" y="298" text-anchor="middle" font-size="18" class="s-ink">Rechner</text>
  <rect x="570" y="70" width="230" height="96" rx="16" class="s-tile" stroke-width="2"/>
  <text x="685" y="107" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">OTHER M/N BASES</text>
  <text x="685" y="139" text-anchor="middle" font-size="17" class="s-muted">stem shape decides more</text>
  <line x1="685" y1="176" x2="685" y2="206" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <rect x="570" y="216" width="230" height="118" rx="16" class="s-tile" stroke-width="2"/>
  <text x="685" y="258" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">-e or -er</text>
  <text x="685" y="298" text-anchor="middle" font-size="18" class="s-ink">Anträge · Fächer</text>
  <text x="420" y="388" text-anchor="middle" font-size="18" class="s-muted">umlaut is a separate stem operation and may accompany any route that allows it</text>
</svg>

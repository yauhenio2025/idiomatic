<svg viewBox="0 0 840 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ja treats a claim as shared ground while doch pushes against resistance">
  <text x="420" y="42" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">WHAT DO YOU ASSUME ABOUT THE LISTENER?</text>
  <rect x="70" y="92" width="300" height="126" rx="16" class="s-tile" stroke-width="3"/>
  <text x="220" y="133" text-anchor="middle" font-size="30" font-weight="800" class="s-teal">JA</text>
  <text x="220" y="169" text-anchor="middle" font-size="19" class="s-ink">“we both know this”</text>
  <text x="220" y="197" text-anchor="middle" font-size="16" class="s-muted">agreement is already available</text>
  <rect x="470" y="92" width="300" height="126" rx="16" class="s-tile" stroke-width="3"/>
  <text x="620" y="133" text-anchor="middle" font-size="30" font-weight="800" class="s-coral">DOCH</text>
  <text x="620" y="169" text-anchor="middle" font-size="19" class="s-ink">“remember: this is true”</text>
  <text x="620" y="197" text-anchor="middle" font-size="16" class="s-muted">doubt or resistance is active</text>
  <line x1="220" y1="228" x2="220" y2="282" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="220,290 208,270 232,270" class="s-teal"/>
  <line x1="620" y1="228" x2="620" y2="282" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="620,290 608,270 632,270" class="s-coral"/>
  <rect x="70" y="300" width="300" height="86" rx="14" class="s-tile" stroke-width="3"/>
  <text x="220" y="338" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">NOD TOGETHER</text>
  <text x="220" y="368" text-anchor="middle" font-size="16" class="s-muted">shared ground</text>
  <rect x="470" y="300" width="300" height="86" rx="14" class="s-tile" stroke-width="3"/>
  <text x="620" y="338" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">PUSH BACK</text>
  <text x="620" y="368" text-anchor="middle" font-size="16" class="s-muted">counter-pressure</text>
</svg>

<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="German clause architecture divided into opening field, left verbal bracket, middle field, right verbal bracket, and optional final field">
  <text x="420" y="48" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">The German clause is a frame</text>
  <text x="92" y="102" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">OPENING FIELD</text>
  <text x="230" y="102" text-anchor="middle" font-size="16" font-weight="700" class="s-teal">LEFT BRACKET</text>
  <text x="430" y="102" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">MIDDLE FIELD</text>
  <text x="635" y="102" text-anchor="middle" font-size="16" font-weight="700" class="s-coral">RIGHT BRACKET</text>
  <text x="762" y="102" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">FINAL FIELD</text>
  <rect x="15" y="122" width="155" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <text x="92" y="166" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">Nach der</text>
  <text x="92" y="193" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">Debatte</text>
  <rect x="185" y="122" width="90" height="112" rx="13" class="s-tile" stroke-width="3"/>
  <text x="230" y="189" text-anchor="middle" font-size="25" font-weight="800" class="s-teal">hat</text>
  <rect x="290" y="122" width="280" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <text x="430" y="166" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">der Ausschuss</text>
  <text x="430" y="193" text-anchor="middle" font-size="18" class="s-ink">den Entwurf doch noch</text>
  <rect x="585" y="122" width="100" height="112" rx="13" class="s-tile" stroke-width="3"/>
  <text x="635" y="183" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">gebilligt</text>
  <rect x="700" y="122" width="125" height="112" rx="13" class="s-tile" stroke-width="2"/>
  <text x="762" y="175" text-anchor="middle" font-size="18" font-weight="700" class="s-dead">optional</text>
  <text x="762" y="202" text-anchor="middle" font-size="16" class="s-muted">heavy material</text>
  <line x1="185" y1="285" x2="685" y2="285" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <line x1="185" y1="271" x2="185" y2="299" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <line x1="685" y1="271" x2="685" y2="299" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <text x="435" y="329" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">the verbal bracket contains the middle field</text>
  <text x="420" y="382" text-anchor="middle" font-size="18" class="s-muted">the finite verb fixes the architecture; constituents fill the fields</text>
</svg>

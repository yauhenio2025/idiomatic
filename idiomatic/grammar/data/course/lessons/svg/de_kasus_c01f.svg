<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Der junge Mann hat seinem Freund den Koffer gegeben, with each noun phrase tagged by its case and role">
  <text x="420" y="70" text-anchor="middle" font-size="30" font-weight="700" class="s-ink">Der junge Mann hat seinem Freund den Koffer gegeben.</text>
  <line x1="150" y1="90" x2="150" y2="140" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="90" x2="430" y2="140" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <line x1="640" y1="90" x2="640" y2="140" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <rect x="60" y="145" width="180" height="92" rx="14" class="s-teal"/>
  <text x="150" y="183" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">NOMINATIV</text>
  <text x="150" y="215" text-anchor="middle" font-size="18" fill="#ffffff">who acts</text>
  <rect x="340" y="145" width="180" height="92" rx="14" class="s-coral"/>
  <text x="430" y="183" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">DATIV</text>
  <text x="430" y="215" text-anchor="middle" font-size="18" fill="#ffffff">who receives</text>
  <rect x="550" y="145" width="180" height="92" rx="14" class="s-tile" stroke-width="2"/>
  <text x="640" y="183" text-anchor="middle" font-size="22" font-weight="800" class="s-ink">AKKUSATIV</text>
  <text x="640" y="215" text-anchor="middle" font-size="18" class="s-muted">what moves</text>
  <text x="150" y="280" text-anchor="middle" font-size="24" font-weight="700" class="s-teal">der junge Mann</text>
  <text x="430" y="280" text-anchor="middle" font-size="24" font-weight="700" class="s-coral">seinem Freund</text>
  <text x="640" y="280" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">den Koffer</text>
  <line x1="240" y1="330" x2="560" y2="330" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="582,330 557,316 557,344" class="s-teal"/>
  <text x="410" y="318" text-anchor="middle" font-size="17" class="s-muted">the suitcase travels</text>
  <text x="420" y="400" text-anchor="middle" font-size="20" class="s-muted">the endings carry the roles — not the word order</text>
</svg>

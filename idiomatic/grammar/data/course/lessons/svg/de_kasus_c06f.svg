<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Free dative: the sentence Das Auto ist zu teuer happens on its own, and a dative meiner Schwester stands beside it as the affected person">
  <rect x="90" y="110" width="400" height="90" rx="14" class="s-tile" stroke-width="2"/>
  <text x="290" y="148" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">Das Auto ist … zu teuer.</text>
  <text x="290" y="182" text-anchor="middle" font-size="17" class="s-muted">a complete sentence — no verb of giving</text>
  <rect x="550" y="110" width="220" height="90" rx="14" class="s-coral"/>
  <text x="660" y="148" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">meiner Schwester</text>
  <text x="660" y="182" text-anchor="middle" font-size="17" fill="#ffffff">DATIV — affected</text>
  <line x1="550" y1="155" x2="524" y2="155" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="500,155 522,142 522,168" class="s-coral"/>
  <text x="420" y="270" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">Das Auto ist <tspan class="s-coral" font-weight="800">meiner Schwester</tspan> zu teuer.</text>
  <text x="420" y="310" text-anchor="middle" font-size="18" class="s-muted">the dative slips in — and says who it matters to</text>
  <text x="420" y="400" text-anchor="middle" font-size="20" class="s-muted">free dative: the person the event concerns</text>
</svg>

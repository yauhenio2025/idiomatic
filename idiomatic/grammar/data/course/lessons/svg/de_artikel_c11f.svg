<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="A four-layer decision sequence checks fixed frames, recoverable reference, singular countable membership, and zero article">
  <text class="s-ink" x="320" y="27" text-anchor="middle" font-size="20" font-weight="700">Article choice: a layered diagnostic</text>

  <rect class="s-tile" x="42" y="46" width="556" height="62" rx="14"/>
  <text class="s-teal" x="72" y="83" text-anchor="middle" font-size="22" font-weight="700">1</text>
  <text class="s-ink" x="106" y="74" font-size="17" font-weight="700">Does a fixed construction control the phrase?</text>
  <text class="s-muted" x="106" y="96" font-size="14">contraction · time frame · phrasal verb · preposition</text>
  <text class="s-teal" x="320" y="127" text-anchor="middle" font-size="20">▼</text>

  <rect class="s-tile" x="42" y="138" width="556" height="62" rx="14"/>
  <text class="s-teal" x="72" y="175" text-anchor="middle" font-size="22" font-weight="700">2</text>
  <text class="s-ink" x="106" y="166" font-size="17" font-weight="700">Can the listener recover one intended referent?</text>
  <text class="s-muted" x="106" y="188" font-size="14">yes → definite article</text>
  <text class="s-coral" x="320" y="219" text-anchor="middle" font-size="20">▼</text>

  <rect class="s-tile" x="42" y="230" width="556" height="62" rx="14"/>
  <text class="s-coral" x="72" y="267" text-anchor="middle" font-size="22" font-weight="700">3</text>
  <text class="s-ink" x="106" y="258" font-size="17" font-weight="700">Are you introducing one singular countable member?</text>
  <text class="s-muted" x="106" y="280" font-size="14">yes → indefinite article</text>
  <text class="s-muted" x="320" y="311" text-anchor="middle" font-size="20">▼</text>

  <rect class="s-tile" x="42" y="322" width="556" height="52" rx="14"/>
  <text class="s-muted" x="72" y="355" text-anchor="middle" font-size="22" font-weight="700">4</text>
  <text class="s-ink" x="106" y="354" font-size="17" font-weight="700">Test zero: mass · quality · activity · indefinite plural</text>
</svg>

  <rect x="28" y="72" width="252" height="126" rx="16" class="s-tile" stroke-width="2"/>
  <text x="154" y="103" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16" font-weight="700">CLAUSE 1</text>
  <rect x="48" y="125" width="66" height="46" rx="9" class="s-stroke-line" stroke-width="2"/>
  <rect x="124" y="125" width="66" height="46" rx="9" class="s-stroke-teal" stroke-width="3"/>
  <rect x="200" y="125" width="60" height="46" rx="9" class="s-stroke-line" stroke-width="2"/>
  <text x="81" y="153" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="15">field 1</text>
  <text x="157" y="153" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="15" font-weight="700">verb</text>
  <text x="230" y="153" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">middle</text>

  <rect x="360" y="72" width="252" height="126" rx="16" class="s-tile" stroke-width="2"/>
  <text x="486" y="103" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16" font-weight="700">CLAUSE 2</text>
  <rect x="380" y="125" width="66" height="46" rx="9" class="s-stroke-line" stroke-width="2"/>
  <rect x="456" y="125" width="66" height="46" rx="9" class="s-stroke-teal" stroke-width="3"/>
  <rect x="532" y="125" width="60" height="46" rx="9" class="s-stroke-line" stroke-width="2"/>
  <text x="413" y="153" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="15">field 1</text>
  <text x="489" y="153" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="15" font-weight="700">verb</text>
  <text x="562" y="153" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">middle</text>

  <rect x="290" y="116" width="60" height="64" rx="12" class="s-stroke-coral" stroke-width="3"/>
  <text x="320" y="143" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="15" font-weight="700">AND</text>
  <text x="320" y="165" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="15" font-weight="700">BUT</text>
  <text x="320" y="244" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="17">The bridge does not consume field 1.</text>
</svg>

<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A split diagnostic shows lexical impersonal es surviving inside a subordinate clause while a first-position filler disappears when time moves forward">
  <text x="420" y="40" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">The movement test separates two systems</text>
  <rect x="48" y="78" width="340" height="238" rx="16" class="s-tile" stroke-width="2"/>
  <text x="218" y="108" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">LEXICAL IMPERSONAL</text>
  <text x="218" y="134" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">SUBJECT</text>
  <text x="218" y="172" text-anchor="middle" font-size="20" class="s-ink">Es friert seit Tagen.</text>
  <line x1="218" y1="185" x2="218" y2="219" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="218,228 211,217 225,217" class="s-teal"/>
  <text x="218" y="262" text-anchor="middle" font-size="20" class="s-ink">weil es seit Tagen friert</text>
  <text x="218" y="291" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">STAYS</text>
  <rect x="452" y="78" width="340" height="238" rx="16" class="s-tile" stroke-width="2"/>
  <text x="622" y="116" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">FIRST-POSITION FILLER</text>
  <text x="622" y="157" text-anchor="middle" font-size="20" class="s-ink">Es wurde lange verhandelt.</text>
  <line x1="622" y1="170" x2="622" y2="209" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="622,218 615,207 629,207" class="s-coral"/>
  <text x="622" y="252" text-anchor="middle" font-size="20" class="s-ink">Lange wurde verhandelt.</text>
  <text x="622" y="291" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">VANISHES</text>
  <line x1="420" y1="70" x2="420" y2="338" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="374" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">put something else first</text>
  <text x="420" y="404" text-anchor="middle" font-size="18" class="s-muted">what survives belongs to the predicate</text>
</svg>

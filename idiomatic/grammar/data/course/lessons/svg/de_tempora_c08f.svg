<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inference diagram routing present evidence to a future form and past evidence to a future perfect form">
  <text x="420" y="42" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">The future forms can mark inference, not time</text>
  <rect x="285" y="76" width="270" height="78" rx="14" class="s-tile" stroke-width="2"/>
  <text x="420" y="108" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">LIMITED EVIDENCE</text>
  <text x="420" y="135" text-anchor="middle" font-size="16" class="s-muted">the speaker makes a guess</text>
  <line x1="420" y1="162" x2="420" y2="196" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <circle cx="420" cy="207" r="9" class="s-dead"/>
  <line x1="411" y1="207" x2="226" y2="207" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <line x1="429" y1="207" x2="614" y2="207" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>

  <rect x="50" y="234" width="330" height="132" rx="16" class="s-tile" stroke-width="2"/>
  <text x="215" y="270" text-anchor="middle" font-size="20" font-weight="700" class="s-teal">GUESS ABOUT NOW</text>
  <text x="215" y="308" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">FUTURE FORM</text>
  <text x="215" y="338" text-anchor="middle" font-size="16" class="s-muted">probably is / probably knows</text>

  <rect x="460" y="234" width="330" height="132" rx="16" class="s-tile" stroke-width="2"/>
  <text x="625" y="270" text-anchor="middle" font-size="20" font-weight="700" class="s-coral">GUESS ABOUT THE PAST</text>
  <text x="625" y="308" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">FUTURE PERFECT</text>
  <text x="625" y="338" text-anchor="middle" font-size="16" class="s-muted">probably was / probably did</text>
  <text x="420" y="414" text-anchor="middle" font-size="18" class="s-muted">A probability particle often makes the inference explicit.</text>
</svg>

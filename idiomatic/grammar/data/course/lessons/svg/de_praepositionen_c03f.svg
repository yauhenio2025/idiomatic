<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aus looks back to an interior or origin, while von starts at a point, person, or source">
  <text x="420" y="48" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">TWO KINDS OF “FROM”</text>
  <rect x="65" y="94" width="315" height="228" rx="18" class="s-tile" stroke-width="2"/>
  <text x="222" y="134" text-anchor="middle" font-size="26" font-weight="800" class="s-coral">AUS + DATIVE</text>
  <rect x="120" y="166" width="205" height="82" rx="14" class="s-stroke-coral" stroke-width="5"/>
  <circle cx="222" cy="207" r="12" class="s-coral"/>
  <text x="222" y="280" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">interior · origin · material</text>
  <rect x="460" y="94" width="315" height="228" rx="18" class="s-tile" stroke-width="2"/>
  <text x="617" y="134" text-anchor="middle" font-size="26" font-weight="800" class="s-teal">VON + DATIVE</text>
  <line x1="525" y1="207" x2="709" y2="207" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <circle cx="617" cy="207" r="13" class="s-teal"/>
  <text x="617" y="280" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">point · person · source</text>
  <text x="222" y="372" text-anchor="middle" font-size="19" class="s-coral">inside → outward</text>
  <text x="617" y="372" text-anchor="middle" font-size="19" class="s-teal">start at this point</text>
  <text x="420" y="410" text-anchor="middle" font-size="16" class="s-muted">translation overlaps; the source geometry does not</text>
</svg>

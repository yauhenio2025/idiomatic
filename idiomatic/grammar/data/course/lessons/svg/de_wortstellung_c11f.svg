<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A German clause closes its verbal bracket before placing a heavy subordinate clause into the optional final field">
  <text x="420" y="50" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Close the frame, then release the weight</text>
  <text x="235" y="105" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">CLAUSE FRAME</text>
  <text x="670" y="105" text-anchor="middle" font-size="18" font-weight="700" class="s-coral">FINAL FIELD</text>
  <rect x="45" y="130" width="275" height="116" rx="15" class="s-tile" stroke-width="3"/>
  <text x="182" y="171" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">Wir haben den Verdacht</text>
  <text x="182" y="201" text-anchor="middle" font-size="19" class="s-ink">nicht ausräumen</text>
  <rect x="340" y="130" width="150" height="116" rx="15" class="s-tile" stroke-width="4"/>
  <text x="415" y="177" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">können,</text>
  <text x="415" y="207" text-anchor="middle" font-size="15" class="s-muted">BRACKET CLOSED</text>
  <line x1="500" y1="188" x2="535" y2="188" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <polygon points="555,188 533,175 533,201" class="s-coral"/>
  <rect x="565" y="130" width="230" height="116" rx="15" class="s-tile" stroke-width="3"/>
  <text x="680" y="170" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">dass interne Daten</text>
  <text x="680" y="199" text-anchor="middle" font-size="18" class="s-ink">weitergegeben wurden</text>
  <text x="680" y="226" text-anchor="middle" font-size="15" class="s-muted">heavy clause outside</text>
  <line x1="145" y1="302" x2="695" y2="302" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="715,302 693,289 693,315" class="s-teal"/>
  <text x="420" y="346" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">one completed frame before the next clause begins</text>
  <text x="420" y="395" text-anchor="middle" font-size="18" class="s-muted">subordinate clauses, infinitive clauses and comparisons often fit here</text>
</svg>

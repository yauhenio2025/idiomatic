<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Imperative construction grid for du, ihr, and Sie based on the verb prüfen">
  <text x="420" y="42" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">ONE VERB · THREE ADDRESSEES</text>
  <rect x="315" y="66" width="210" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <text x="420" y="103" text-anchor="middle" font-size="26" font-weight="800" class="s-teal">prüfen</text>
  <text x="150" y="164" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">INFORMAL SINGULAR</text>
  <text x="420" y="164" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">INFORMAL PLURAL</text>
  <text x="690" y="164" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">FORMAL</text>
  <rect x="35" y="185" width="230" height="110" rx="14" class="s-tile" stroke-width="3"/>
  <text x="150" y="228" text-anchor="middle" font-size="28" font-weight="800" class="s-teal">prüf</text>
  <text x="150" y="266" text-anchor="middle" font-size="17" class="s-ink">stem · no pronoun</text>
  <rect x="305" y="185" width="230" height="110" rx="14" class="s-tile" stroke-width="3"/>
  <text x="420" y="228" text-anchor="middle" font-size="28" font-weight="800" class="s-coral">prüft</text>
  <text x="420" y="266" text-anchor="middle" font-size="17" class="s-ink">present form · no pronoun</text>
  <rect x="575" y="185" width="230" height="110" rx="14" class="s-tile" stroke-width="3"/>
  <text x="690" y="228" text-anchor="middle" font-size="28" font-weight="800" class="s-teal">prüfen Sie</text>
  <text x="690" y="266" text-anchor="middle" font-size="17" class="s-ink">verb · pronoun</text>
  <line x1="55" y1="334" x2="785" y2="334" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <text x="420" y="374" text-anchor="middle" font-size="20" class="s-muted">The pronoun is normally visible only in the formal command.</text>
</svg>

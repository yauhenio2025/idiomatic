  <rect x="40" y="304" width="220" height="98" rx="14" class="s-tile" stroke-width="3"/>
  <text x="150" y="343" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">präzise</text>
  <text x="150" y="375" text-anchor="middle" font-size="16" class="s-muted">POSITIVE</text>
  <line x1="272" y1="332" x2="289" y2="276" class="s-stroke-teal" stroke-width="6" stroke-linecap="round"/>
  <polygon points="300,258 299,288 274,275" class="s-teal"/>
  <rect x="310" y="208" width="220" height="98" rx="14" class="s-tile" stroke-width="3"/>
  <text x="420" y="247" text-anchor="middle" font-size="25" font-weight="800" class="s-teal">präziser</text>
  <text x="420" y="279" text-anchor="middle" font-size="16" class="s-muted">COMPARATIVE · -ER</text>
  <line x1="542" y1="236" x2="559" y2="180" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <polygon points="570,162 569,192 544,179" class="s-coral"/>
  <rect x="580" y="112" width="220" height="98" rx="14" class="s-tile" stroke-width="3"/>
  <text x="690" y="151" text-anchor="middle" font-size="25" font-weight="800" class="s-coral">am präzisesten</text>
  <text x="690" y="183" text-anchor="middle" font-size="16" class="s-muted">SUPERLATIVE · AM -STEN</text>
  <text x="420" y="430" text-anchor="middle" font-size="19" class="s-muted">no agreement ending — the superlative lives in a fixed frame</text>
</svg>

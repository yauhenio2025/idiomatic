<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An adjective before a noun carries an ending, while the same stem used adverbially remains uninflected">
  <text x="420" y="44" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">SAME STEM — DIFFERENT SYNTACTIC JOB</text>
  <rect x="70" y="82" width="700" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="220" y="127" text-anchor="middle" font-size="19" font-weight="800" class="s-coral">BEFORE A NOUN</text>
  <text x="535" y="127" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">eine klare Formulierung</text>
  <text x="535" y="164" text-anchor="middle" font-size="17" class="s-muted">the adjective carries an ending</text>
  <line x1="420" y1="212" x2="420" y2="258" class="s-stroke-teal" stroke-width="6" stroke-linecap="round"/>
  <polygon points="420,273 405,247 435,247" class="s-teal"/>
  <text x="530" y="249" text-anchor="middle" font-size="18" class="s-muted">move it onto the action</text>
  <rect x="70" y="284" width="700" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="220" y="329" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">WITH A VERB</text>
  <text x="535" y="329" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">klar formulieren</text>
  <text x="535" y="366" text-anchor="middle" font-size="17" class="s-muted">the adverbial form has no ending</text>
  <text x="420" y="438" text-anchor="middle" font-size="18" class="s-muted">German changes scope — it does not add an -ly suffix</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
  <title id="title">Comma decision for German coordinators</title>
  <desc id="desc">A coordinator node splits along uncrossed paths to und and oder without a required comma, and contrast or explanation coordinators with a required comma.</desc>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="32" class="s-ink" font-size="24" font-weight="700">WHAT JOINS THE TWO UNITS?</text>
    <rect x="220" y="62" width="200" height="66" rx="12" class="s-tile" stroke-width="2"/>
    <text x="320" y="102" class="s-ink" font-size="21" font-weight="700">COORDINATOR</text>

    <line x1="320" y1="138" x2="320" y2="158" class="s-stroke-line" stroke-width="4"/>
    <line x1="155" y1="158" x2="505" y2="158" class="s-stroke-line" stroke-width="4"/>
    <line x1="155" y1="158" x2="155" y2="185" class="s-stroke-teal" stroke-width="4"/>
    <polygon points="155,195 147,183 163,183" class="s-teal"/>
    <line x1="505" y1="158" x2="505" y2="185" class="s-stroke-coral" stroke-width="4"/>
    <polygon points="505,195 497,183 513,183" class="s-coral"/>

    <rect x="35" y="205" width="240" height="88" rx="12" class="s-tile" stroke-width="2"/>
    <text x="155" y="235" class="s-ink" font-size="22" font-weight="700">und · oder</text>
    <text x="155" y="269" class="s-teal" font-size="20" font-weight="700">NO COMMA NEEDED</text>

    <rect x="365" y="205" width="255" height="88" rx="12" class="s-tile" stroke-width="2"/>
    <text x="492.5" y="233" class="s-ink" font-size="18" font-weight="700">aber · denn · doch</text>
    <text x="492.5" y="255" class="s-ink" font-size="16">jedoch · sondern</text>
    <text x="492.5" y="280" class="s-coral" font-size="20" font-weight="700">COMMA</text>

    <text x="320" y="328" class="s-muted" font-size="15">A clarity comma before und or oder remains possible.</text>
  </g>
</svg>

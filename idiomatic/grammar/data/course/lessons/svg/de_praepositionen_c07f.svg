<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three spatial topologies: an at an edge, auf on a surface, and in inside an enclosure">
  <text x="420" y="48" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">THREE SPATIAL TOPOLOGIES</text>
  <rect x="45" y="90" width="230" height="245" rx="18" class="s-tile" stroke-width="2"/>
  <text x="160" y="133" text-anchor="middle" font-size="28" font-weight="800" class="s-coral">AN</text>
  <line x1="185" y1="170" x2="185" y2="265" class="s-stroke-line" stroke-width="8" stroke-linecap="round"/>
  <circle cx="145" cy="218" r="16" class="s-coral"/>
  <text x="160" y="306" text-anchor="middle" font-size="18" class="s-ink">at the edge / side</text>
  <rect x="305" y="90" width="230" height="245" rx="18" class="s-tile" stroke-width="2"/>
  <text x="420" y="133" text-anchor="middle" font-size="28" font-weight="800" class="s-teal">AUF</text>
  <line x1="355" y1="250" x2="485" y2="250" class="s-stroke-line" stroke-width="8" stroke-linecap="round"/>
  <circle cx="420" cy="210" r="16" class="s-teal"/>
  <text x="420" y="306" text-anchor="middle" font-size="18" class="s-ink">on a surface</text>
  <rect x="565" y="90" width="230" height="245" rx="18" class="s-tile" stroke-width="2"/>
  <text x="680" y="133" text-anchor="middle" font-size="28" font-weight="800" class="s-sun">IN</text>
  <rect x="620" y="170" width="120" height="95" rx="12" class="s-stroke-line" stroke-width="8"/>
  <circle cx="680" cy="218" r="16" class="s-sun"/>
  <text x="680" y="306" text-anchor="middle" font-size="18" class="s-ink">inside an enclosure</text>
  <text x="420" y="382" text-anchor="middle" font-size="20" font-weight="700" class="s-muted">location = dative · new endpoint = accusative</text>
</svg>

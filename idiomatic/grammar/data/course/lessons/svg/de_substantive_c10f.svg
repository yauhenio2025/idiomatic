<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The two productive noun-level case endings in German contrasted with all other regular noun forms">
  <text x="420" y="46" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">WHAT THE NOUN ITSELF ADDS</text>
  <rect x="45" y="78" width="235" height="240" rx="18" class="s-tile" stroke-width="3"/>
  <text x="162" y="118" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">GENITIVE SINGULAR</text>
  <text x="162" y="148" text-anchor="middle" font-size="17" class="s-muted">masculine · neuter</text>
  <line x1="92" y1="168" x2="232" y2="168" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <text x="162" y="215" text-anchor="middle" font-size="30" font-weight="800" class="s-teal">-(e)s</text>
  <text x="162" y="262" text-anchor="middle" font-size="18" class="s-ink">des Beschlusses</text>
  <text x="162" y="292" text-anchor="middle" font-size="16" class="s-muted">productive signal 1</text>
  <rect x="303" y="78" width="235" height="240" rx="18" class="s-tile" stroke-width="3"/>
  <text x="420" y="118" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">DATIVE PLURAL</text>
  <text x="420" y="148" text-anchor="middle" font-size="17" class="s-muted">when the plural allows it</text>
  <line x1="350" y1="168" x2="490" y2="168" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <text x="420" y="215" text-anchor="middle" font-size="30" font-weight="800" class="s-coral">-n</text>
  <text x="420" y="262" text-anchor="middle" font-size="18" class="s-ink">den Ausschüssen</text>
  <text x="420" y="292" text-anchor="middle" font-size="16" class="s-muted">productive signal 2</text>
  <rect x="561" y="78" width="235" height="240" rx="18" class="s-tile" stroke-width="2"/>
  <text x="678" y="118" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">OTHER REGULAR CELLS</text>
  <text x="678" y="148" text-anchor="middle" font-size="17" class="s-muted">noun remains unchanged</text>
  <line x1="608" y1="168" x2="748" y2="168" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <text x="678" y="215" text-anchor="middle" font-size="30" font-weight="800" class="s-ink">zero</text>
  <text x="678" y="262" text-anchor="middle" font-size="18" class="s-ink">article/adjective mark case</text>
  <text x="678" y="292" text-anchor="middle" font-size="16" class="s-muted">no noun ending</text>
  <text x="420" y="367" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">plural already in -n or -s cannot take another -n</text>
  <text x="420" y="399" text-anchor="middle" font-size="17" class="s-muted">weak and irregular nouns add separate paradigms later</text>
</svg>

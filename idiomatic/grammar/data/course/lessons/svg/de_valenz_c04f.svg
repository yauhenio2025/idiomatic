<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Transitive causation frame contrasted with an intransitive change frame">
  <text x="320" y="38" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="22" font-weight="700">WHO CAUSES THE CHANGE?</text>

  <text x="36" y="102" class="s-muted" font-family="sans-serif" font-size="15" font-weight="700">TRANSITIVE</text>
  <rect x="42" y="122" width="146" height="66" rx="14" class="s-tile"/>
  <text x="115" y="150" text-anchor="middle" class="s-teal" font-family="sans-serif" font-size="17" font-weight="700">CAUSER</text>
  <text x="115" y="173" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="13">subject</text>
  <line x1="188" y1="155" x2="230" y2="155" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="240,155 228,148 228,162" class="s-teal"/>
  <rect x="250" y="122" width="140" height="66" rx="14" class="s-tile"/>
  <text x="320" y="150" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="17" font-weight="700">CAUSES</text>
  <text x="320" y="173" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="13">change verb</text>
  <line x1="390" y1="155" x2="432" y2="155" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="442,155 430,148 430,162" class="s-coral"/>
  <rect x="452" y="122" width="146" height="66" rx="14" class="s-tile"/>
  <text x="525" y="150" text-anchor="middle" class="s-coral" font-family="sans-serif" font-size="17" font-weight="700">CHANGED THING</text>
  <text x="525" y="173" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="13">accusative object</text>

  <line x1="42" y1="224" x2="598" y2="224" class="s-stroke-line" stroke-width="3"/>
  <text x="36" y="260" class="s-muted" font-family="sans-serif" font-size="15" font-weight="700">INTRANSITIVE</text>
  <rect x="122" y="278" width="176" height="62" rx="14" class="s-tile"/>
  <text x="210" y="304" text-anchor="middle" class="s-teal" font-family="sans-serif" font-size="17" font-weight="700">CHANGED THING</text>
  <text x="210" y="326" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="13">subject</text>
  <line x1="298" y1="309" x2="340" y2="309" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="350,309 338,302 338,316" class="s-teal"/>
  <rect x="360" y="278" width="158" height="62" rx="14" class="s-tile"/>
  <text x="439" y="304" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="17" font-weight="700">CHANGES</text>
  <text x="439" y="326" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="13">no external causer</text>
</svg>

<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three German constructions corresponding to English half">
  <text x="420" y="45" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">WHAT JOB DOES HALF DO?</text>
  <rect x="35" y="96" width="240" height="300" rx="16" class="s-tile" stroke-width="3"/>
  <text x="155" y="137" text-anchor="middle" font-size="17" font-weight="800" class="s-teal">PARTITIVE NOUN</text>
  <text x="155" y="198" text-anchor="middle" font-size="29" font-weight="800" class="s-ink">die Hälfte</text>
  <text x="155" y="251" text-anchor="middle" font-size="18" class="s-muted">half of a set</text>
  <text x="155" y="319" text-anchor="middle" font-size="18" class="s-ink">die Hälfte</text>
  <text x="155" y="346" text-anchor="middle" font-size="18" class="s-ink">der Anträge</text>
  <rect x="300" y="96" width="240" height="300" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="137" text-anchor="middle" font-size="17" font-weight="800" class="s-coral">BEFORE A NOUN</text>
  <text x="420" y="198" text-anchor="middle" font-size="29" font-weight="800" class="s-ink">halb + ending</text>
  <text x="420" y="251" text-anchor="middle" font-size="18" class="s-muted">half a divisible whole</text>
  <text x="420" y="334" text-anchor="middle" font-size="20" class="s-ink">einen halben Laib</text>
  <rect x="565" y="96" width="240" height="300" rx="16" class="s-tile" stroke-width="3"/>
  <text x="685" y="137" text-anchor="middle" font-size="17" font-weight="800" class="s-sun">ADVERB</text>
  <text x="685" y="198" text-anchor="middle" font-size="29" font-weight="800" class="s-ink">halb</text>
  <text x="685" y="251" text-anchor="middle" font-size="18" class="s-muted">degree or state</text>
  <text x="685" y="334" text-anchor="middle" font-size="20" class="s-ink">halb offen</text>
  <text x="420" y="436" text-anchor="middle" font-size="18" class="s-muted">meaning chooses the construction; case then supplies any adjective ending</text>
</svg>

<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="German cardinal number forty-three assembled from unit, conjunction, and tens">
  <text x="420" y="45" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">BUILD THE FINAL PAIR UNIT FIRST</text>
  <rect x="45" y="102" width="210" height="130" rx="16" class="s-tile" stroke-width="3"/>
  <text x="150" y="140" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">UNIT</text>
  <text x="150" y="192" text-anchor="middle" font-size="34" font-weight="800" class="s-teal">drei</text>
  <text x="280" y="180" text-anchor="middle" font-size="34" font-weight="700" class="s-muted">+</text>
  <rect x="305" y="102" width="140" height="130" rx="16" class="s-tile" stroke-width="3"/>
  <text x="375" y="140" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">LINK</text>
  <text x="375" y="192" text-anchor="middle" font-size="34" font-weight="800" class="s-coral">und</text>
  <text x="470" y="180" text-anchor="middle" font-size="34" font-weight="700" class="s-muted">+</text>
  <rect x="495" y="102" width="300" height="130" rx="16" class="s-tile" stroke-width="3"/>
  <text x="645" y="140" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">TENS</text>
  <text x="645" y="192" text-anchor="middle" font-size="34" font-weight="800" class="s-sun">vierzig</text>
  <text x="420" y="282" text-anchor="middle" font-size="31" font-weight="700" class="s-muted">=</text>
  <rect x="180" y="310" width="480" height="92" rx="18" class="s-tile" stroke-width="4"/>
  <text x="420" y="369" text-anchor="middle" font-size="39" font-weight="800" class="s-ink">dreiundvierzig</text>
</svg>

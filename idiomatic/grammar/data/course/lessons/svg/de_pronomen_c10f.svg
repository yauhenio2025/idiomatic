<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An anticipatory es points forward to a later subject clause, then disappears when that clause moves to first position">
  <text x="420" y="40" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">A light pointer announces a heavy clause</text>
  <rect x="48" y="92" width="132" height="74" rx="37" class="s-tile" stroke-width="3"/>
  <text x="114" y="139" text-anchor="middle" font-size="32" font-weight="800" class="s-teal">es</text>
  <text x="274" y="100" text-anchor="middle" font-size="17" class="s-muted">points forward</text>
  <line x1="190" y1="129" x2="350" y2="129" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="359,129 348,122 348,136" class="s-teal"/>
  <rect x="367" y="82" width="425" height="94" rx="14" class="s-tile" stroke-width="2"/>
  <text x="580" y="120" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">dass niemand widerspricht</text>
  <text x="580" y="150" text-anchor="middle" font-size="17" class="s-muted">the later subject clause</text>
  <text x="420" y="220" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">move the subject clause to the first position</text>
  <rect x="48" y="258" width="425" height="94" rx="14" class="s-tile" stroke-width="2"/>
  <text x="260" y="296" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">Dass niemand widerspricht,</text>
  <text x="260" y="326" text-anchor="middle" font-size="17" class="s-muted">now the clause occupies the slot itself</text>
  <line x1="483" y1="305" x2="550" y2="305" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="559,305 548,298 548,312" class="s-coral"/>
  <rect x="567" y="268" width="225" height="74" rx="14" class="s-tile" stroke-width="2"/>
  <text x="680" y="313" text-anchor="middle" font-size="22" font-weight="700" class="s-coral">no pointer</text>
  <text x="420" y="405" text-anchor="middle" font-size="19" class="s-muted">subject clause first → es disappears</text>
</svg>

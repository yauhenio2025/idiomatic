<svg viewBox="0 0 840 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline showing an activity beginning in the past and continuing into the present">
  <text x="420" y="44" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">A past beginning can live in the present tense</text>
  <line x1="90" y1="165" x2="750" y2="165" class="s-stroke-line" stroke-width="6" stroke-linecap="round"/>
  <circle cx="170" cy="165" r="12" class="s-coral"/>
  <circle cx="670" cy="165" r="16" class="s-teal"/>
  <line x1="170" y1="165" x2="650" y2="165" class="s-stroke-teal" stroke-width="12" stroke-linecap="round"/>
  <text x="170" y="126" text-anchor="middle" font-size="18" font-weight="700" class="s-coral">STARTED</text>
  <text x="670" y="126" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">NOW</text>
  <text x="420" y="205" text-anchor="middle" font-size="18" class="s-muted">one uninterrupted state or activity</text>

  <rect x="90" y="248" width="660" height="92" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="283" text-anchor="middle" font-size="23" font-weight="700" class="s-teal">Still true now → PRESENT</text>
  <text x="420" y="316" text-anchor="middle" font-size="17" class="s-muted">The time phrase carries the past starting point.</text>
  <text x="420" y="385" text-anchor="middle" font-size="18" class="s-muted">Negated gaps and counted completions usually switch to the perfect.</text>
</svg>

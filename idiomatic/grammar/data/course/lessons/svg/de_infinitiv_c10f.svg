<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Compressing a relative clause into an extended participial phrase</title>
  <desc id="desc">A relative clause after a noun can be compressed before the noun, with complements followed by a declined participle.</desc>
  <defs>
    <marker id="arrow-teal-c09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="s-teal"/>
    </marker>
  </defs>
  <text x="320" y="31" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Relative clause → compressed attribute</text>
  <rect x="25" y="57" width="590" height="88" rx="13" class="s-tile" stroke-width="2"/>
  <text x="320" y="91" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">die Anwohner, die seit Monaten auf eine Entscheidung warten</text>
  <text x="320" y="119" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">finite relative clause follows the noun</text>
  <line x1="320" y1="145" x2="320" y2="199" class="s-stroke-teal" stroke-width="3" marker-end="url(#arrow-teal-c09)"/>
  <rect x="25" y="209" width="590" height="105" rx="13" class="s-tile" stroke-width="2"/>
  <text x="55" y="250" class="s-muted" font-family="system-ui, sans-serif" font-size="17">die</text>
  <text x="102" y="250" class="s-ink" font-family="system-ui, sans-serif" font-size="17">seit Monaten auf eine Entscheidung</text>
  <text x="420" y="250" class="s-teal" font-family="system-ui, sans-serif" font-size="17" font-weight="700">wartenden</text>
  <text x="522" y="250" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Anwohner</text>
  <line x1="101" y1="267" x2="501" y2="267" class="s-stroke-line" stroke-width="2"/>
  <text x="301" y="292" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">complements → participle + adjective ending → noun</text>
  <text x="320" y="344" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">compression moves left; the participle closes the internal field</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Word order with the replacement infinitive</title>
  <desc id="desc">In a main clause the finite auxiliary precedes a lexical and modal infinitive; in a subordinate clause the finite auxiliary also stands before the final infinitive cluster.</desc>
  <text x="320" y="31" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">The perfect ends in an infinitive cluster</text>
  <text x="38" y="77" class="s-muted" font-family="system-ui, sans-serif" font-size="15">main clause</text>
  <rect x="35" y="94" width="120" height="68" rx="11" class="s-tile" stroke-width="2"/>
  <rect x="225" y="94" width="170" height="68" rx="11" class="s-tile" stroke-width="2"/>
  <rect x="465" y="94" width="140" height="68" rx="11" class="s-tile" stroke-width="2"/>
  <text x="95" y="136" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="19" font-weight="700">hat</text>
  <text x="310" y="136" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">verlängern</text>
  <text x="535" y="136" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="18" font-weight="700">müssen</text>
  <line x1="155" y1="128" x2="215" y2="128" class="s-stroke-line" stroke-width="3"/>
  <line x1="395" y1="128" x2="455" y2="128" class="s-stroke-line" stroke-width="3"/>
  <text x="38" y="221" class="s-muted" font-family="system-ui, sans-serif" font-size="15">subordinate clause</text>
  <rect x="35" y="238" width="120" height="68" rx="11" class="s-tile" stroke-width="2"/>
  <rect x="225" y="238" width="170" height="68" rx="11" class="s-tile" stroke-width="2"/>
  <rect x="465" y="238" width="140" height="68" rx="11" class="s-tile" stroke-width="2"/>
  <text x="95" y="280" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="19" font-weight="700">habe</text>
  <text x="310" y="280" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">verlängern</text>
  <text x="535" y="280" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="18" font-weight="700">müssen</text>
  <line x1="155" y1="272" x2="215" y2="272" class="s-stroke-line" stroke-width="3"/>
  <line x1="395" y1="272" x2="455" y2="272" class="s-stroke-line" stroke-width="3"/>
  <text x="320" y="339" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">the auxiliary precedes the double infinitive in both patterns</text>
</svg>

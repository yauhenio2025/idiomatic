<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bis recruits a second preposition, which then governs the case of the noun phrase">
  <text x="420" y="48" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">BIS BUILDS AN ENDPOINT</text>
  <text x="420" y="82" text-anchor="middle" font-size="17" class="s-muted">with a determiner, a second preposition does the governing</text>
  <rect x="40" y="145" width="180" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="130" y="185" text-anchor="middle" font-size="27" font-weight="800" class="s-coral">bis</text>
  <text x="130" y="219" text-anchor="middle" font-size="16" class="s-muted">sets the boundary</text>
  <line x1="230" y1="198" x2="300" y2="198" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="320,198 298,186 298,210" class="s-coral"/>
  <rect x="330" y="145" width="180" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="185" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">an · zu · auf …</text>
  <text x="420" y="219" text-anchor="middle" font-size="16" class="s-muted">chooses the relation</text>
  <line x1="520" y1="198" x2="590" y2="198" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="610,198 588,186 588,210" class="s-teal"/>
  <rect x="620" y="145" width="180" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="710" y="185" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">noun phrase</text>
  <text x="710" y="219" text-anchor="middle" font-size="16" class="s-muted">gets its case here</text>
  <text x="420" y="310" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">bis an die Absperrung</text>
  <text x="420" y="346" text-anchor="middle" font-size="20" class="s-teal">an + endpoint → accusative</text>
  <text x="420" y="397" text-anchor="middle" font-size="18" class="s-muted">without a determiner: bis Brüssel · bis Montag · bis morgen</text>
</svg>

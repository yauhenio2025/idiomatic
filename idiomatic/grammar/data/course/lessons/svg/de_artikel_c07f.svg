<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" role="img" aria-label="German possession splits the owner into a dative phrase and the body part or garment into a definite noun phrase">
  <text class="s-ink" x="320" y="29" text-anchor="middle" font-size="20" font-weight="700">One English possessive becomes two German jobs</text>

  <rect class="s-tile" x="30" y="58" width="240" height="130" rx="16"/>
  <text class="s-teal" x="150" y="91" text-anchor="middle" font-size="17" font-weight="700">AFFECTED OWNER</text>
  <rect class="s-stroke-teal" x="72" y="111" width="156" height="44" rx="11" stroke-width="3"/>
  <text class="s-teal" x="150" y="140" text-anchor="middle" font-size="21" font-weight="700">dative</text>
  <text class="s-muted" x="150" y="176" text-anchor="middle" font-size="14">whose sphere?</text>

  <text class="s-muted" x="320" y="132" text-anchor="middle" font-size="30" font-weight="700">+</text>

  <rect class="s-tile" x="370" y="58" width="240" height="130" rx="16"/>
  <text class="s-coral" x="490" y="91" text-anchor="middle" font-size="17" font-weight="700">AFFECTED ITEM</text>
  <rect class="s-stroke-coral" x="412" y="111" width="156" height="44" rx="11" stroke-width="3"/>
  <text class="s-coral" x="490" y="140" text-anchor="middle" font-size="20" font-weight="700">definite article</text>
  <text class="s-muted" x="490" y="176" text-anchor="middle" font-size="14">which obvious part?</text>

  <rect class="s-tile" x="126" y="216" width="388" height="48" rx="14"/>
  <text class="s-ink" x="320" y="246" text-anchor="middle" font-size="16" font-weight="700">mir + die Füße · sich + die Socken</text>
  <text class="s-muted" x="320" y="286" text-anchor="middle" font-size="14">use a possessive only when ownership needs emphasis</text>
</svg>

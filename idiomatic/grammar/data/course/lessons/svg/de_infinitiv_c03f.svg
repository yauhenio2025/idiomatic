<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
  <title id="title">Three argument slots for an infinitive clause</title>
  <desc id="desc">The same infinitive clause can serve as a subject, a postponed subject anticipated by es, or an object.</desc>
  <defs>
    <marker id="arrow-teal-c03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="s-teal"/>
    </marker>
  </defs>
  <text x="320" y="31" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">The clause is one syntactic unit</text>
  <rect x="190" y="58" width="260" height="82" rx="14" class="s-tile" stroke-width="2"/>
  <text x="320" y="91" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="18" font-weight="700">den Vertrag zu kündigen</text>
  <text x="320" y="119" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">one reduced clause</text>
  <line x1="245" y1="140" x2="108" y2="212" class="s-stroke-teal" stroke-width="3" marker-end="url(#arrow-teal-c03)"/>
  <line x1="320" y1="140" x2="320" y2="212" class="s-stroke-teal" stroke-width="3" marker-end="url(#arrow-teal-c03)"/>
  <line x1="395" y1="140" x2="532" y2="212" class="s-stroke-teal" stroke-width="3" marker-end="url(#arrow-teal-c03)"/>
  <rect x="20" y="222" width="176" height="98" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="232" y="222" width="176" height="98" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="444" y="222" width="176" height="98" rx="12" class="s-tile" stroke-width="2"/>
  <text x="108" y="258" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">SUBJECT</text>
  <text x="108" y="288" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">wäre riskant</text>
  <text x="320" y="258" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">es … SUBJECT</text>
  <text x="320" y="288" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">postponed rightward</text>
  <text x="532" y="258" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">OBJECT</text>
  <text x="532" y="288" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="14">wir hoffen …</text>
</svg>

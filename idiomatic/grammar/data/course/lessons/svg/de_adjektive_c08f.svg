<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="German adjectives govern dependent noun phrases in dative, accusative or formal genitive">
  <text x="420" y="44" text-anchor="middle" font-size="28" font-weight="700" class="s-ink">The adjective licenses a case slot</text>
  <text x="420" y="74" text-anchor="middle" font-size="17" font-weight="700" class="s-muted">lexical government, not position</text>

  <rect x="300" y="170" width="240" height="92" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="207" text-anchor="middle" font-size="18" class="s-muted">governing adjective</text>
  <text x="420" y="239" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">ADJEKTIV</text>

  <rect x="40" y="170" width="210" height="90" rx="14" class="s-tile" stroke-width="2"/>
  <text x="145" y="205" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">DATIVE</text>
  <text x="145" y="235" text-anchor="middle" font-size="18" class="s-ink">unklar · ähnlich</text>
  <line x1="258" y1="216" x2="274" y2="216" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="290,216 271,206 271,226" class="s-teal"/>
  <text x="145" y="289" text-anchor="middle" font-size="16" class="s-muted">largest group</text>

  <rect x="590" y="170" width="210" height="90" rx="14" class="s-tile" stroke-width="2"/>
  <text x="695" y="205" text-anchor="middle" font-size="22" font-weight="700" class="s-coral">ACCUSATIVE</text>
  <text x="695" y="235" text-anchor="middle" font-size="18" class="s-ink">gewohnt · leid</text>
  <line x1="582" y1="216" x2="566" y2="216" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="550,216 569,206 569,226" class="s-coral"/>
  <text x="695" y="289" text-anchor="middle" font-size="16" class="s-muted">small group</text>

  <rect x="315" y="326" width="210" height="76" rx="14" class="s-tile" stroke-width="2"/>
  <text x="420" y="357" text-anchor="middle" font-size="22" font-weight="700" class="s-muted">GENITIVE</text>
  <text x="420" y="385" text-anchor="middle" font-size="18" class="s-ink">bewusst · sicher</text>
  <line x1="420" y1="272" x2="420" y2="300" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <polygon points="420,316 410,297 430,297" class="s-dead"/>
  <text x="488" y="300" text-anchor="start" font-size="16" class="s-muted">mostly formal</text>

</svg>

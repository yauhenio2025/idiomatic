<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Instrumental clauses require a method that produces the main result, unlike merely parallel actions">
  <defs>
    <marker id="arrow-teal-c09" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" class="s-teal"/>
    </marker>
  </defs>
  <text x="320" y="34" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">THE METHOD MUST PRODUCE THE RESULT</text>

  <rect x="32" y="72" width="214" height="82" rx="15" class="s-tile" stroke-width="2"/>
  <text x="139" y="105" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="18" font-weight="700">METHOD</text>
  <text x="139" y="132" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">the answer to “how?”</text>
  <line x1="256" y1="113" x2="374" y2="113" class="s-stroke-teal" stroke-width="4" marker-end="url(#arrow-teal-c09)"/>
  <text x="315" y="95" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">causes</text>
  <rect x="384" y="72" width="224" height="82" rx="15" class="s-tile" stroke-width="2"/>
  <text x="496" y="105" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="18" font-weight="700">MAIN RESULT</text>
  <text x="496" y="132" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">achieved by that method</text>

  <line x1="32" y1="196" x2="608" y2="196" class="s-stroke-line" stroke-width="2"/>
  <text x="320" y="229" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="18" font-weight="700">NO CAUSAL PATH?</text>
  <rect x="64" y="250" width="154" height="48" rx="11" class="s-stroke-line" stroke-width="2"/>
  <rect x="243" y="250" width="154" height="48" rx="11" class="s-stroke-line" stroke-width="2"/>
  <rect x="422" y="250" width="154" height="48" rx="11" class="s-stroke-line" stroke-width="2"/>
  <text x="141" y="280" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">PARALLEL</text>
  <text x="320" y="280" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">ACCOMPANYING</text>
  <text x="499" y="280" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">WITHOUT-EVENT</text>
</svg>

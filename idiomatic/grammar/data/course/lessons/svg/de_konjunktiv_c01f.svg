<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A speaker's stance branches into indicative fact, imperative directive, Konjunktiv I report, and Konjunktiv II imagined world">
  <text x="420" y="34" text-anchor="middle" font-size="22" font-weight="700" class="s-muted">What status do I give this clause?</text>
  <rect x="290" y="52" width="260" height="62" rx="14" class="s-tile" stroke-width="2"/>
  <text x="420" y="90" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">SPEAKER STANCE</text>
  <line x1="420" y1="114" x2="420" y2="136" class="s-stroke-line" stroke-width="4"/>
  <line x1="110" y1="136" x2="730" y2="136" class="s-stroke-line" stroke-width="4"/>
  <line x1="110" y1="136" x2="110" y2="154" class="s-stroke-teal" stroke-width="4"/>
  <polygon points="110,166 101,150 119,150" class="s-teal"/>
  <line x1="310" y1="136" x2="310" y2="154" class="s-stroke-coral" stroke-width="4"/>
  <polygon points="310,166 301,150 319,150" class="s-coral"/>
  <line x1="510" y1="136" x2="510" y2="154" class="s-stroke-teal" stroke-width="4"/>
  <polygon points="510,166 501,150 519,150" class="s-teal"/>
  <line x1="730" y1="136" x2="730" y2="154" class="s-stroke-coral" stroke-width="4"/>
  <polygon points="730,166 721,150 739,150" class="s-coral"/>
  <rect x="20" y="176" width="180" height="132" rx="14" class="s-tile" stroke-width="3"/>
  <text x="110" y="214" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">INDICATIVE</text>
  <text x="110" y="248" text-anchor="middle" font-size="18" class="s-ink">fact frame</text>
  <text x="110" y="279" text-anchor="middle" font-size="16" class="s-muted">this is the case</text>
  <rect x="220" y="176" width="180" height="132" rx="14" class="s-tile" stroke-width="3"/>
  <text x="310" y="214" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">IMPERATIVE</text>
  <text x="310" y="248" text-anchor="middle" font-size="18" class="s-ink">directive</text>
  <text x="310" y="279" text-anchor="middle" font-size="16" class="s-muted">make this happen</text>
  <rect x="420" y="176" width="180" height="132" rx="14" class="s-tile" stroke-width="3"/>
  <text x="510" y="214" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">K I</text>
  <text x="510" y="248" text-anchor="middle" font-size="18" class="s-ink">reported claim</text>
  <text x="510" y="279" text-anchor="middle" font-size="16" class="s-muted">someone says so</text>
  <rect x="620" y="176" width="200" height="132" rx="14" class="s-tile" stroke-width="3"/>
  <text x="720" y="214" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">K II</text>
  <text x="720" y="248" text-anchor="middle" font-size="18" class="s-ink">imagined world</text>
  <text x="720" y="279" text-anchor="middle" font-size="16" class="s-muted">distance from reality</text>
  <text x="420" y="372" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">Mood is not time.</text>
  <text x="420" y="405" text-anchor="middle" font-size="18" class="s-muted">It is the clause's conversational status.</text>
</svg>

<svg viewBox="0 0 840 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contrast between a removable number modifier and a case-governing preposition">
  <text x="420" y="43" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">REMOVE IT: DOES THE SENTENCE SURVIVE?</text>
  <rect x="45" y="88" width="750" height="148" rx="16" class="s-tile" stroke-width="3"/>
  <text x="82" y="128" font-size="18" font-weight="800" class="s-teal">YES — NUMBER MODIFIER</text>
  <text x="82" y="178" font-size="28" font-weight="700" class="s-ink">mit  [ über 300 ]  freiwilligen Helfern</text>
  <text x="82" y="215" font-size="17" class="s-muted">mit supplies dative · über only adjusts the number</text>
  <rect x="45" y="268" width="750" height="148" rx="16" class="s-tile" stroke-width="3"/>
  <text x="82" y="308" font-size="18" font-weight="800" class="s-coral">NO — REAL PREPOSITION</text>
  <text x="82" y="358" font-size="28" font-weight="700" class="s-ink">Kinder  [ unter sieben Jahren ]</text>
  <text x="82" y="395" font-size="17" class="s-muted">unter is structurally required · it supplies dative</text>
  <text x="420" y="451" text-anchor="middle" font-size="18" class="s-muted">same surface word — different grammatical reach</text>
</svg>

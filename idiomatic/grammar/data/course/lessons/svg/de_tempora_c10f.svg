<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toolkit diagram showing that German keeps a simple tense and adds contextual cues for progressive meaning">
  <text x="420" y="42" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Progressive meaning without a progressive tense</text>
  <rect x="245" y="76" width="350" height="88" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="112" text-anchor="middle" font-size="23" font-weight="700" class="s-teal">KEEP THE SIMPLE TENSE</text>
  <text x="420" y="142" text-anchor="middle" font-size="16" class="s-muted">then add a cue only when needed</text>

  <rect x="40" y="222" width="175" height="112" rx="14" class="s-tile" stroke-width="2"/>
  <text x="127" y="260" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">CONTEXT</text>
  <text x="127" y="290" text-anchor="middle" font-size="15" class="s-muted">the scene already</text>
  <text x="127" y="313" text-anchor="middle" font-size="15" class="s-muted">shows duration</text>

  <rect x="235" y="222" width="175" height="112" rx="14" class="s-tile" stroke-width="2"/>
  <text x="322" y="260" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">ADVERB</text>
  <text x="322" y="290" text-anchor="middle" font-size="15" class="s-muted">marks action</text>
  <text x="322" y="313" text-anchor="middle" font-size="15" class="s-muted">in progress</text>

  <rect x="430" y="222" width="175" height="112" rx="14" class="s-tile" stroke-width="2"/>
  <text x="517" y="260" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">CONSTRUCTION</text>
  <text x="517" y="290" text-anchor="middle" font-size="15" class="s-muted">foregrounds the</text>
  <text x="517" y="313" text-anchor="middle" font-size="15" class="s-muted">ongoing process</text>

  <rect x="625" y="222" width="175" height="112" rx="14" class="s-tile" stroke-width="2"/>
  <text x="712" y="260" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">LEXICAL CUE</text>
  <text x="712" y="290" text-anchor="middle" font-size="15" class="s-muted">verb choice marks</text>
  <text x="712" y="313" text-anchor="middle" font-size="15" class="s-muted">process or endpoint</text>
  <text x="420" y="406" text-anchor="middle" font-size="18" class="s-muted">German marks continuity locally, not on every finite verb.</text>
</svg>

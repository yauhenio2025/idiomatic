<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Neutral familiar references contract while singled-out references keep the preposition and article separate">
  <text class="s-ink" x="320" y="29" text-anchor="middle" font-size="20" font-weight="700">Fusion encodes information structure</text>

  <rect class="s-tile" x="26" y="50" width="278" height="202" rx="16"/>
  <text class="s-teal" x="165" y="82" text-anchor="middle" font-size="17" font-weight="700">NEUTRAL · FAMILIAR</text>
  <rect class="s-tile" x="52" y="104" width="72" height="42" rx="10"/>
  <text class="s-ink" x="88" y="131" text-anchor="middle" font-size="18">bei</text>
  <text class="s-muted" x="139" y="132" text-anchor="middle" font-size="21">+</text>
  <rect class="s-tile" x="154" y="104" width="72" height="42" rx="10"/>
  <text class="s-ink" x="190" y="131" text-anchor="middle" font-size="18">dem</text>
  <text class="s-teal" x="242" y="132" text-anchor="middle" font-size="23">→</text>
  <rect class="s-stroke-teal" x="86" y="166" width="158" height="48" rx="12" stroke-width="3"/>
  <text class="s-teal" x="165" y="197" text-anchor="middle" font-size="22" font-weight="700">beim</text>
  <text class="s-muted" x="165" y="238" text-anchor="middle" font-size="13">one smooth contextual pointer</text>

  <rect class="s-tile" x="336" y="50" width="278" height="202" rx="16"/>
  <text class="s-coral" x="475" y="82" text-anchor="middle" font-size="17" font-weight="700">SINGLED OUT</text>
  <rect class="s-tile" x="362" y="104" width="72" height="42" rx="10"/>
  <text class="s-ink" x="398" y="131" text-anchor="middle" font-size="18">zu</text>
  <text class="s-muted" x="449" y="132" text-anchor="middle" font-size="21">+</text>
  <rect class="s-tile" x="464" y="104" width="72" height="42" rx="10"/>
  <text class="s-ink" x="500" y="131" text-anchor="middle" font-size="18">dem</text>
  <text class="s-coral" x="552" y="132" text-anchor="middle" font-size="23">→</text>
  <rect class="s-stroke-coral" x="396" y="166" width="158" height="48" rx="12" stroke-width="3"/>
  <text class="s-coral" x="475" y="197" text-anchor="middle" font-size="22" font-weight="700">zu dem</text>
  <text class="s-muted" x="475" y="238" text-anchor="middle" font-size="13">that particular referent</text>

  <text class="s-muted" x="320" y="282" text-anchor="middle" font-size="14">relative clause or contrast often blocks fusion</text>
</svg>

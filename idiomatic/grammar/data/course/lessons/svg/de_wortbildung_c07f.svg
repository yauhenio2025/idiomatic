<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 315" role="img" aria-labelledby="title desc">
  <title id="title">The prefix be repackages a prepositional object as an accusative object</title>
  <desc id="desc">An arrow maps auf die Beschwerde antworten to die Beschwerde beantworten.</desc>
  <text class="s-ink" x="320" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">The relation moves into the verb</text>

  <text class="s-muted" x="140" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">prepositional object</text>
  <rect class="s-tile" x="25" y="88" width="230" height="90" rx="14"/>
  <text class="s-ink" x="140" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18">antworten</text>
  <text class="s-coral" x="140" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17">auf die Beschwerde</text>

  <line class="s-stroke-teal" x1="265" y1="133" x2="375" y2="133" stroke-width="3"/>
  <polygon class="s-teal" points="375,127 385,133 375,139"/>

  <text class="s-muted" x="500" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">accusative object</text>
  <rect class="s-tile" x="395" y="88" width="220" height="90" rx="14"/>
  <text class="s-teal" x="505" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700">beantworten</text>
  <text class="s-ink" x="505" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17">die Beschwerde</text>

  <rect class="s-tile" x="110" y="225" width="420" height="62" rx="14"/>
  <text class="s-ink" x="320" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">be- packages the relation into the verb</text>
  <text class="s-muted" x="320" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">the new frame targets the thing directly</text>
</svg>

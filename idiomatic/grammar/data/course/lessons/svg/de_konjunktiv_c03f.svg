<svg viewBox="0 0 840 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two subjunctive rails: Konjunktiv I for reports and Konjunktiv II for remote worlds, each with present and past forms">
  <text x="420" y="38" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">TWO JOBS · TWO TIME LANES EACH</text>
  <rect x="25" y="75" width="170" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="110" y="113" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">K I</text>
  <text x="110" y="147" text-anchor="middle" font-size="18" class="s-ink">reported claim</text>
  <line x1="205" y1="125" x2="220" y2="125" class="s-stroke-teal" stroke-width="5"/>
  <polygon points="230,125 214,116 214,134" class="s-teal"/>
  <rect x="240" y="75" width="250" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="365" y="112" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">SAME TIME</text>
  <text x="365" y="147" text-anchor="middle" font-size="25" font-weight="800" class="s-teal">er komme</text>
  <line x1="500" y1="125" x2="535" y2="125" class="s-stroke-teal" stroke-width="5"/>
  <polygon points="545,125 529,116 529,134" class="s-teal"/>
  <rect x="555" y="75" width="260" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="685" y="112" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">EARLIER</text>
  <text x="685" y="147" text-anchor="middle" font-size="23" font-weight="800" class="s-teal">er sei gekommen</text>
  <rect x="25" y="245" width="170" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="110" y="283" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">K II</text>
  <text x="110" y="317" text-anchor="middle" font-size="18" class="s-ink">remote world</text>
  <line x1="205" y1="295" x2="220" y2="295" class="s-stroke-coral" stroke-width="5"/>
  <polygon points="230,295 214,286 214,304" class="s-coral"/>
  <rect x="240" y="245" width="250" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="365" y="282" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">NOW</text>
  <text x="365" y="317" text-anchor="middle" font-size="25" font-weight="800" class="s-coral">er käme</text>
  <line x1="500" y1="295" x2="535" y2="295" class="s-stroke-coral" stroke-width="5"/>
  <polygon points="545,295 529,286 529,304" class="s-coral"/>
  <rect x="555" y="245" width="260" height="100" rx="14" class="s-tile" stroke-width="3"/>
  <text x="685" y="282" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">PAST</text>
  <text x="685" y="317" text-anchor="middle" font-size="22" font-weight="800" class="s-coral">er wäre gekommen</text>
  <text x="420" y="405" text-anchor="middle" font-size="20" class="s-muted">Choose the job first. Then locate the event in time.</text>
</svg>

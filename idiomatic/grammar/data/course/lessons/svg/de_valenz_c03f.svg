  <circle cx="169" cy="146" r="42" class="s-stroke-teal" stroke-width="5"/>
  <path d="M127 146 H211 M169 104 C147 124 147 168 169 188 M169 104 C191 124 191 168 169 188" class="s-stroke-teal" stroke-width="3"/>
  <text x="169" y="224" text-anchor="middle" class="s-teal" font-family="sans-serif" font-size="19" font-weight="700">GENERAL EXISTENCE</text>
  <text x="169" y="252" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="15">something exists at all</text>
  <text x="169" y="278" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="16" font-weight="700">FIXED IMPERSONAL FRAME</text>

  <rect x="346" y="76" width="250" height="226" rx="20" class="s-tile"/>

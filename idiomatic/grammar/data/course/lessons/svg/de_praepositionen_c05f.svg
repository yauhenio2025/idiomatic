<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-way prepositions choose accusative for a new endpoint relation and dative for an existing scene">
  <text x="420" y="45" text-anchor="middle" font-size="28" font-weight="700" class="s-ink">WHAT HAPPENS TO THE RELATION?</text>
  <rect x="45" y="85" width="190" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">new endpoint</text>
  <text x="140" y="157" text-anchor="middle" font-size="16" class="s-muted">relation is created</text>
  <line x1="245" y1="137" x2="300" y2="137" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="320,137 298,125 298,149" class="s-coral"/>
  <rect x="330" y="85" width="190" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="425" y="125" text-anchor="middle" font-size="20" font-weight="700" class="s-coral">toward / into / onto</text>
  <text x="425" y="157" text-anchor="middle" font-size="16" class="s-muted">endpoint viewpoint</text>
  <line x1="530" y1="137" x2="580" y2="137" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="600,137 578,125 578,149" class="s-coral"/>
  <rect x="610" y="85" width="185" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="702" y="129" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">ACCUSATIVE</text>
  <rect x="45" y="255" width="190" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="140" y="295" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">existing scene</text>
  <text x="140" y="327" text-anchor="middle" font-size="16" class="s-muted">relation already holds</text>
  <line x1="245" y1="307" x2="300" y2="307" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="320,307 298,295 298,319" class="s-teal"/>
  <rect x="330" y="255" width="190" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="425" y="295" text-anchor="middle" font-size="20" font-weight="700" class="s-teal">at / in / on</text>
  <text x="425" y="327" text-anchor="middle" font-size="16" class="s-muted">location viewpoint</text>
  <line x1="530" y1="307" x2="580" y2="307" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="600,307 578,295 578,319" class="s-teal"/>
  <rect x="610" y="255" width="185" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="702" y="299" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">DATIVE</text>
  <text x="420" y="414" text-anchor="middle" font-size="18" class="s-muted">movement can occur in either row</text>
</svg>

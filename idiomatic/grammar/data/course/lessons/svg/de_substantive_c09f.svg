<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="English and German nouns compared to show that equivalent meanings can use different grammatical numbers">
  <text x="250" y="55" text-anchor="middle" font-size="21" font-weight="800" class="s-muted">ENGLISH PACKAGE</text>
  <text x="590" y="55" text-anchor="middle" font-size="21" font-weight="800" class="s-ink">GERMAN PACKAGE</text>
  <rect x="55" y="82" width="300" height="84" rx="16" class="s-tile" stroke-width="2"/>
  <text x="205" y="118" text-anchor="middle" font-size="23" class="s-ink">glasses</text>
  <text x="205" y="147" text-anchor="middle" font-size="16" class="s-coral">plural agreement</text>
  <line x1="365" y1="124" x2="475" y2="124" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <rect x="485" y="82" width="300" height="84" rx="16" class="s-tile" stroke-width="2"/>
  <text x="635" y="118" text-anchor="middle" font-size="23" class="s-ink">die Brille</text>
  <text x="635" y="147" text-anchor="middle" font-size="16" class="s-teal">singular agreement</text>
  <rect x="55" y="190" width="300" height="84" rx="16" class="s-tile" stroke-width="2"/>
  <text x="205" y="226" text-anchor="middle" font-size="23" class="s-ink">furniture</text>
  <text x="205" y="255" text-anchor="middle" font-size="16" class="s-teal">singular agreement</text>
  <line x1="365" y1="232" x2="475" y2="232" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <rect x="485" y="190" width="300" height="84" rx="16" class="s-tile" stroke-width="2"/>
  <text x="635" y="226" text-anchor="middle" font-size="23" class="s-ink">die Möbel</text>
  <text x="635" y="255" text-anchor="middle" font-size="16" class="s-coral">plural agreement</text>
  <rect x="55" y="298" width="300" height="84" rx="16" class="s-tile" stroke-width="2"/>
  <text x="205" y="334" text-anchor="middle" font-size="23" class="s-ink">Christmas</text>
  <text x="205" y="363" text-anchor="middle" font-size="16" class="s-teal">singular agreement</text>
  <line x1="365" y1="340" x2="475" y2="340" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <rect x="485" y="298" width="300" height="84" rx="16" class="s-tile" stroke-width="2"/>
  <text x="635" y="334" text-anchor="middle" font-size="23" class="s-ink">Weihnachten</text>
  <text x="635" y="363" text-anchor="middle" font-size="16" class="s-teal">normally singular agreement</text>
  <text x="420" y="416" text-anchor="middle" font-size="17" class="s-muted">translate the meaning — then choose number inside the target language</text>
</svg>

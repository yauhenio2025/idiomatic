<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three families of German noun suffixes grouped by masculine, feminine, and neuter gender">
  <text x="420" y="43" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">PRODUCTIVE SUFFIX → GENDER</text>
  <rect x="45" y="72" width="235" height="282" rx="18" class="s-tile" stroke-width="2"/>
  <text x="162" y="113" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">MASCULINE</text>
  <line x1="82" y1="130" x2="242" y2="130" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <text x="162" y="172" text-anchor="middle" font-size="24" class="s-ink">-ling</text>
  <text x="162" y="218" text-anchor="middle" font-size="24" class="s-ink">-ismus</text>
  <text x="162" y="264" text-anchor="middle" font-size="24" class="s-ink">-or</text>
  <text x="162" y="320" text-anchor="middle" font-size="16" class="s-muted">agent · system · role</text>
  <rect x="303" y="72" width="235" height="282" rx="18" class="s-tile" stroke-width="2"/>
  <text x="420" y="113" text-anchor="middle" font-size="21" font-weight="800" class="s-coral">FEMININE</text>
  <line x1="340" y1="130" x2="500" y2="130" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <text x="420" y="172" text-anchor="middle" font-size="24" class="s-ink">-heit · -keit</text>
  <text x="420" y="218" text-anchor="middle" font-size="24" class="s-ink">-schaft · -ung</text>
  <text x="420" y="264" text-anchor="middle" font-size="24" class="s-ink">-tion · -tät</text>
  <text x="420" y="320" text-anchor="middle" font-size="16" class="s-muted">quality · state · process</text>
  <rect x="561" y="72" width="235" height="282" rx="18" class="s-tile" stroke-width="2"/>
  <text x="678" y="113" text-anchor="middle" font-size="21" font-weight="800" class="s-ink">NEUTER</text>
  <line x1="598" y1="130" x2="758" y2="130" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <text x="678" y="172" text-anchor="middle" font-size="24" class="s-ink">-chen · -lein</text>
  <text x="678" y="218" text-anchor="middle" font-size="24" class="s-ink">-ment · -um</text>
  <text x="678" y="264" text-anchor="middle" font-size="24" class="s-ink">-ma · -tum</text>
  <text x="678" y="320" text-anchor="middle" font-size="16" class="s-muted">diminutive · learned form</text>
  <text x="420" y="399" text-anchor="middle" font-size="18" class="s-muted">use the productive rule first — then retrieve known lexical exceptions</text>
</svg>

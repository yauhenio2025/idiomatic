<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A manner adverb reaches an action, while an attitude adverb scopes over an entire proposition">
  <text x="420" y="44" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">SAME POSITION — DIFFERENT SCOPE</text>
  <rect x="50" y="82" width="300" height="84" rx="14" class="s-tile" stroke-width="3"/>
  <text x="200" y="117" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">sorgfältig</text>
  <text x="200" y="146" text-anchor="middle" font-size="16" class="s-muted">MANNER</text>
  <line x1="200" y1="178" x2="200" y2="231" class="s-stroke-teal" stroke-width="6" stroke-linecap="round"/>
  <polygon points="200,246 185,220 215,220" class="s-teal"/>
  <rect x="50" y="256" width="300" height="112" rx="14" class="s-tile" stroke-width="3"/>
  <text x="200" y="301" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">die Berechnung</text>
  <text x="200" y="336" text-anchor="middle" font-size="17" class="s-muted">how the action happened</text>
  <rect x="490" y="82" width="300" height="84" rx="14" class="s-tile" stroke-width="3"/>
  <text x="640" y="117" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">offenbar</text>
  <text x="640" y="146" text-anchor="middle" font-size="16" class="s-muted">ATTITUDE</text>
  <line x1="640" y1="178" x2="640" y2="231" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <polygon points="640,246 625,220 655,220" class="s-coral"/>
  <rect x="490" y="256" width="300" height="112" rx="14" class="s-tile" stroke-width="3"/>
  <text x="640" y="301" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">the whole claim</text>
  <text x="640" y="336" text-anchor="middle" font-size="17" class="s-muted">how the speaker judges it</text>
  <text x="420" y="426" text-anchor="middle" font-size="19" class="s-muted">action-internal description ≠ proposition-level stance</text>
</svg>

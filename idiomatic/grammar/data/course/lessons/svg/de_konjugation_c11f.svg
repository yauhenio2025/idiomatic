<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" role="img" aria-labelledby="title desc">
  <title id="title">German event passive and state passive</title>
  <desc id="desc">Two columns contrast werden plus participle as a process with sein plus participle as a resulting state.</desc>
  <text x="320" y="34" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="23" font-weight="700">Same participle, different perspective</text>
  <rect x="40" y="68" width="265" height="224" rx="16" class="s-tile" stroke-width="2"/>
  <rect x="335" y="68" width="265" height="224" rx="16" class="s-tile" stroke-width="2"/>
  <text x="172" y="106" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="20" font-weight="700">EVENT PASSIVE</text>
  <text x="467" y="106" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="20" font-weight="700">STATE PASSIVE</text>
  <line x1="64" y1="124" x2="281" y2="124" class="s-stroke-line" stroke-width="2"/>
  <line x1="359" y1="124" x2="576" y2="124" class="s-stroke-line" stroke-width="2"/>
  <text x="172" y="165" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="20">wird saniert</text>
  <text x="467" y="165" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="20">ist gesperrt</text>
  <text x="172" y="208" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">action unfolds</text>
  <text x="467" y="208" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">result holds</text>
  <text x="172" y="250" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="17" font-weight="700">WERDEN + PARTIZIP</text>
  <text x="467" y="250" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="17" font-weight="700">SEIN + PARTIZIP</text>
  <rect x="132" y="317" width="376" height="38" rx="10" class="s-tile" stroke-width="2"/>
  <text x="320" y="342" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="17">perfect event passive → saniert worden</text>
</svg>

<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A stable proposition gains a separate conversational stance layer">
  <text x="420" y="42" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">ONE UTTERANCE — TWO LAYERS</text>
  <rect x="160" y="82" width="520" height="92" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="119" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">DU BIST SPÄT DRAN.</text>
  <text x="420" y="150" text-anchor="middle" font-size="17" class="s-muted">proposition: the timing is late</text>
  <line x1="420" y1="184" x2="420" y2="222" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="420,230 408,210 432,210" class="s-teal"/>
  <rect x="160" y="240" width="520" height="118" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="278" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">+ MODAL PARTICLE</text>
  <text x="420" y="311" text-anchor="middle" font-size="19" class="s-ink">shared · corrective · surprised · gentle · warning</text>
  <text x="420" y="339" text-anchor="middle" font-size="16" class="s-muted">the fact stays stable; the conversational move changes</text>
  <text x="420" y="414" text-anchor="middle" font-size="20" font-weight="700" class="s-coral">STANCE IS AN EXTRA LAYER, NOT A NEW EVENT</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" role="img" aria-labelledby="title desc">
  <title id="title">Stress splits a variable-prefix spelling into two verbs</title>
  <desc id="desc">Umfahren branches to an inseparable verb meaning go around and a separable verb meaning knock over.</desc>
  <text class="s-ink" x="320" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Same spelling, two lexical entries</text>

  <rect class="s-tile" x="245" y="60" width="150" height="60" rx="12"/>
  <text class="s-ink" x="320" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">written form</text>
  <text class="s-ink" x="320" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700">umfahren</text>

  <line class="s-stroke-line" x1="320" y1="130" x2="320" y2="155" stroke-width="3"/>
  <line class="s-stroke-coral" x1="320" y1="155" x2="150" y2="155" stroke-width="3"/>
  <line class="s-stroke-coral" x1="150" y1="155" x2="150" y2="190" stroke-width="3"/>
  <polygon class="s-coral" points="144,190 150,200 156,190"/>
  <line class="s-stroke-teal" x1="320" y1="155" x2="490" y2="155" stroke-width="3"/>
  <line class="s-stroke-teal" x1="490" y1="155" x2="490" y2="190" stroke-width="3"/>
  <polygon class="s-teal" points="484,190 490,200 496,190"/>

  <rect class="s-tile" x="20" y="210" width="260" height="100" rx="14"/>
  <text class="s-coral" x="150" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700">umFAHren</text>
  <text class="s-muted" x="150" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">root stress · inseparable</text>
  <text class="s-ink" x="150" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">go around · umfahren</text>

  <rect class="s-tile" x="360" y="210" width="260" height="100" rx="14"/>
  <text class="s-teal" x="490" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700">UMfahren</text>
  <text class="s-muted" x="490" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">prefix stress · separable</text>
  <text class="s-ink" x="490" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">knock over · umgefahren</text>

  <text class="s-muted" x="320" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">learn accent, form and meaning together</text>
</svg>

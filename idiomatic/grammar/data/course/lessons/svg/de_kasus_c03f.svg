<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transitive action: subject in the nominative sends the action through the verb to a direct object in the accusative; der becomes den on the way">
  <rect x="70" y="120" width="230" height="90" rx="14" class="s-teal"/>
  <text x="185" y="158" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">die Putzfrau</text>
  <text x="185" y="190" text-anchor="middle" font-size="17" fill="#ffffff">NOMINATIV — acts</text>
  <line x1="310" y1="165" x2="520" y2="165" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <polygon points="545,165 518,150 518,180" class="s-coral"/>
  <text x="425" y="145" text-anchor="middle" font-size="20" font-weight="700" class="s-coral">hat … gebohnert</text>
  <rect x="555" y="120" width="230" height="90" rx="14" class="s-coral"/>
  <text x="670" y="158" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff">den Fußboden</text>
  <text x="670" y="190" text-anchor="middle" font-size="17" fill="#ffffff">AKKUSATIV — affected</text>
  <rect x="240" y="280" width="160" height="60" rx="12" class="s-tile" stroke-width="2"/>
  <text x="320" y="318" text-anchor="middle" font-size="24" font-weight="700" class="s-dead">der</text>
  <line x1="410" y1="310" x2="480" y2="310" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="500,310 476,297 476,323" class="s-teal"/>
  <rect x="510" y="280" width="160" height="60" rx="12" class="s-teal"/>
  <text x="590" y="318" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">den</text>
  <text x="420" y="255" text-anchor="middle" font-size="18" class="s-muted">the masculine article is where you hear it</text>
  <text x="420" y="400" text-anchor="middle" font-size="20" class="s-muted">transitive verb → the object takes the accusative</text>
</svg>

<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Future perfect timeline with a completed event before a later future deadline">
  <text x="420" y="44" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Future perfect: completed before a future checkpoint</text>
  <line x1="85" y1="156" x2="755" y2="156" class="s-stroke-line" stroke-width="6" stroke-linecap="round"/>
  <circle cx="145" cy="156" r="13" class="s-teal"/>
  <circle cx="470" cy="156" r="13" class="s-coral"/>
  <circle cx="700" cy="156" r="13" class="s-sun"/>
  <text x="145" y="116" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">NOW</text>
  <text x="470" y="116" text-anchor="middle" font-size="18" font-weight="700" class="s-coral">COMPLETION</text>
  <text x="700" y="116" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">DEADLINE</text>
  <line x1="166" y1="156" x2="435" y2="156" class="s-stroke-coral" stroke-width="8" stroke-linecap="round"/>
  <polygon points="449,156 431,145 431,167" class="s-coral"/>

  <rect x="150" y="230" width="540" height="105" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="268" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">future auxiliary + participle + have / be</text>
  <text x="420" y="304" text-anchor="middle" font-size="18" class="s-muted">The endpoint is future; the completed event is earlier.</text>
  <text x="420" y="392" text-anchor="middle" font-size="18" class="s-muted">When context already supplies the deadline, the perfect often suffices.</text>
</svg>

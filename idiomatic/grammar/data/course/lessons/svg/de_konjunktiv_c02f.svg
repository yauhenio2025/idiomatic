<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Command strategy depends on whether the directive targets a particular listener or an impersonal audience">
  <text x="420" y="40" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">WHO SHOULD FEEL ADDRESSED?</text>
  <rect x="45" y="74" width="350" height="250" rx="18" class="s-tile" stroke-width="3"/>
  <text x="220" y="117" text-anchor="middle" font-size="22" font-weight="800" class="s-teal">A PARTICULAR LISTENER</text>
  <line x1="95" y1="140" x2="345" y2="140" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <text x="220" y="184" text-anchor="middle" font-size="29" font-weight="800" class="s-ink">imperative</text>
  <text x="220" y="225" text-anchor="middle" font-size="18" class="s-muted">direct request or command</text>
  <text x="220" y="268" text-anchor="middle" font-size="19" class="s-coral">particles tune the force</text>
  <rect x="445" y="74" width="350" height="250" rx="18" class="s-tile" stroke-width="3"/>
  <text x="620" y="117" text-anchor="middle" font-size="22" font-weight="800" class="s-coral">NO NAMED LISTENER</text>
  <line x1="495" y1="140" x2="745" y2="140" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="183" text-anchor="middle" font-size="27" font-weight="800" class="s-ink">infinitive</text>
  <text x="620" y="220" text-anchor="middle" font-size="19" class="s-muted">sign · recipe · announcement</text>
  <text x="620" y="265" text-anchor="middle" font-size="27" font-weight="800" class="s-ink">subjectless passive</text>
  <text x="620" y="297" text-anchor="middle" font-size="18" class="s-muted">rule already in force</text>
  <text x="420" y="374" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">Grammar distributes social pressure.</text>
  <text x="420" y="406" text-anchor="middle" font-size="17" class="s-muted">Choose the construction before choosing how forceful to sound.</text>
</svg>

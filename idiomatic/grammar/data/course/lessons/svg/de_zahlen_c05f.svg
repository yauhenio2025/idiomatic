<svg viewBox="0 0 840 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="German ordinal formation below twenty and from twenty upward">
  <text x="420" y="44" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">BUILD THE STEM — THEN DECLINE IT</text>
  <rect x="40" y="86" width="760" height="132" rx="16" class="s-tile" stroke-width="3"/>
  <text x="75" y="124" font-size="17" font-weight="800" class="s-muted">2–19</text>
  <text x="185" y="173" text-anchor="middle" font-size="29" font-weight="800" class="s-teal">sechs</text>
  <text x="285" y="173" text-anchor="middle" font-size="26" class="s-muted">+</text>
  <text x="350" y="173" text-anchor="middle" font-size="29" font-weight="800" class="s-coral">t</text>
  <text x="415" y="173" text-anchor="middle" font-size="26" class="s-muted">+</text>
  <text x="480" y="173" text-anchor="middle" font-size="29" font-weight="800" class="s-sun">e</text>
  <text x="560" y="173" text-anchor="middle" font-size="26" class="s-muted">=</text>
  <text x="680" y="173" text-anchor="middle" font-size="31" font-weight="800" class="s-ink">sechste</text>
  <rect x="40" y="246" width="760" height="132" rx="16" class="s-tile" stroke-width="3"/>
  <text x="75" y="284" font-size="17" font-weight="800" class="s-muted">20+</text>
  <text x="170" y="333" text-anchor="middle" font-size="29" font-weight="800" class="s-teal">21</text>
  <text x="250" y="333" text-anchor="middle" font-size="26" class="s-muted">+</text>
  <text x="315" y="333" text-anchor="middle" font-size="29" font-weight="800" class="s-coral">st</text>
  <text x="380" y="333" text-anchor="middle" font-size="26" class="s-muted">+</text>
  <text x="445" y="333" text-anchor="middle" font-size="29" font-weight="800" class="s-sun">en</text>
  <text x="510" y="333" text-anchor="middle" font-size="26" class="s-muted">=</text>
  <text x="660" y="333" text-anchor="middle" font-size="22" font-weight="800" class="s-ink">einundzwanzigsten</text>
  <rect x="120" y="410" width="600" height="46" rx="12" class="s-tile" stroke-width="2"/>
  <text x="420" y="440" text-anchor="middle" font-size="18" class="s-muted">irregular stems: erste · dritte · siebte</text>

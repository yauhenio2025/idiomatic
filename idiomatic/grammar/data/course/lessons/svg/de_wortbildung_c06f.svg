<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" role="img" aria-labelledby="title desc">
  <title id="title">Stress predicts the forms of prefixed verbs</title>
  <desc id="desc">A table compares inseparable, separable and variable verb prefixes.</desc>
  <text class="s-ink" x="320" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">One accent controls three forms</text>

  <rect class="s-tile" x="20" y="58" width="600" height="270" rx="14"/>
  <line class="s-stroke-line" x1="20" y1="108" x2="620" y2="108" stroke-width="2"/>
  <line class="s-stroke-line" x1="20" y1="181" x2="620" y2="181" stroke-width="2"/>
  <line class="s-stroke-line" x1="20" y1="254" x2="620" y2="254" stroke-width="2"/>
  <line class="s-stroke-line" x1="150" y1="58" x2="150" y2="328" stroke-width="2"/>
  <line class="s-stroke-line" x1="260" y1="58" x2="260" y2="328" stroke-width="2"/>
  <line class="s-stroke-line" x1="430" y1="58" x2="430" y2="328" stroke-width="2"/>

  <text class="s-muted" x="85" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">class</text>
  <text class="s-muted" x="205" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">stress</text>
  <text class="s-muted" x="345" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">participle</text>
  <text class="s-muted" x="525" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">zu-infinitive</text>

  <text class="s-ink" x="85" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">inseparable</text>
  <text class="s-coral" x="205" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700">root</text>
  <text class="s-ink" x="345" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">beantwortet</text>
  <text class="s-ink" x="525" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">zu beantworten</text>

  <text class="s-ink" x="85" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">separable</text>
  <text class="s-teal" x="205" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700">prefix</text>
  <text class="s-ink" x="345" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">angefangen</text>
  <text class="s-ink" x="525" y="223" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">anzufangen</text>

  <text class="s-ink" x="85" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">variable</text>
  <text class="s-sun" x="205" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700">either</text>
  <text class="s-ink" x="345" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">übersetzt</text>
  <text class="s-ink" x="345" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">übergesetzt</text>
  <text class="s-ink" x="525" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">zu übersetzen</text>
  <text class="s-ink" x="525" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">überzusetzen</text>

  <text class="s-muted" x="320" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">stress · separation · insertion travel together</text>
</svg>

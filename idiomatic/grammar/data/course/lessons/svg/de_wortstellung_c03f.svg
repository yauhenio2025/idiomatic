<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Information flows from a familiar topic in the opening field toward the strongest new information later in the clause">
  <text x="420" y="52" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Information has a contour</text>
  <text x="175" y="104" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">STARTING POINT</text>
  <text x="665" y="104" text-anchor="middle" font-size="18" font-weight="700" class="s-coral">NEW INFORMATION</text>
  <rect x="55" y="132" width="240" height="105" rx="14" class="s-tile" stroke-width="3"/>
  <text x="175" y="176" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">Im Innenhof</text>
  <text x="175" y="207" text-anchor="middle" font-size="17" class="s-muted">familiar topic</text>
  <line x1="305" y1="184" x2="530" y2="184" class="s-stroke-line" stroke-width="6" stroke-linecap="round"/>
  <polygon points="550,184 528,171 528,197" class="s-coral"/>
  <text x="418" y="154" text-anchor="middle" font-size="17" font-weight="700" class="s-muted">stress grows</text>
  <rect x="560" y="132" width="225" height="105" rx="14" class="s-tile" stroke-width="3"/>
  <text x="672" y="176" text-anchor="middle" font-size="23" font-weight="800" class="s-coral">eine Skulptur</text>
  <text x="672" y="207" text-anchor="middle" font-size="17" class="s-muted">the news</text>
  <rect x="118" y="292" width="604" height="67" rx="12" class="s-tile" stroke-width="2"/>
  <text x="420" y="334" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">Im Innenhof steht seit heute eine ungewöhnliche Skulptur.</text>
  <text x="420" y="402" text-anchor="middle" font-size="18" class="s-muted">first does not mean strongest — the final focus carries the news</text>
</svg>

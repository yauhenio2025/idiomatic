<svg viewBox="0 0 840 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three grammatical forms of German one according to context">
  <text x="420" y="45" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">ONE NUMBER — THREE GRAMMATICAL JOBS</text>
  <rect x="35" y="96" width="240" height="290" rx="16" class="s-tile" stroke-width="3"/>
  <text x="155" y="137" text-anchor="middle" font-size="17" font-weight="700" class="s-muted">STANDS ALONE</text>
  <text x="155" y="202" text-anchor="middle" font-size="40" font-weight="800" class="s-teal">eins</text>
  <text x="155" y="259" text-anchor="middle" font-size="18" class="s-ink">Linie eins</text>
  <text x="155" y="322" text-anchor="middle" font-size="16" class="s-muted">counting · labels</text>
  <rect x="300" y="96" width="240" height="290" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="137" text-anchor="middle" font-size="17" font-weight="700" class="s-muted">BEFORE A NOUN</text>
  <text x="420" y="202" text-anchor="middle" font-size="40" font-weight="800" class="s-coral">ein-</text>
  <text x="420" y="259" text-anchor="middle" font-size="18" class="s-ink">mit einem Grund</text>
  <text x="420" y="322" text-anchor="middle" font-size="16" class="s-muted">gender + case ending</text>
  <rect x="565" y="96" width="240" height="290" rx="16" class="s-tile" stroke-width="3"/>
  <text x="685" y="137" text-anchor="middle" font-size="17" font-weight="700" class="s-muted">REPLACES A NOUN</text>
  <text x="685" y="202" text-anchor="middle" font-size="34" font-weight="800" class="s-sun">einer</text>
  <text x="685" y="247" text-anchor="middle" font-size="23" font-weight="700" class="s-sun">eine · eins</text>
  <text x="685" y="322" text-anchor="middle" font-size="16" class="s-muted">pronoun ending</text>
  <text x="420" y="426" text-anchor="middle" font-size="18" class="s-muted">the context selects the form before the number enters the sentence</text>
</svg>

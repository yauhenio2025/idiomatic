<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">Decision tree for ss and sharp s</title>
  <desc id="desc">A central vowel-length decision splits without crossing text into short vowel leading to ss and long vowel or diphthong leading to sharp s.</desc>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="32" class="s-ink" font-size="24" font-weight="700">FIRST, HEAR THE VOWEL</text>
    <rect x="220" y="62" width="200" height="70" rx="12" class="s-tile" stroke-width="2"/>
    <text x="320" y="90" class="s-muted" font-size="14">PRECEDING VOWEL</text>
    <text x="320" y="116" class="s-ink" font-size="21" font-weight="700">short or long?</text>

    <line x1="320" y1="142" x2="320" y2="163" class="s-stroke-line" stroke-width="4"/>
    <line x1="155" y1="163" x2="505" y2="163" class="s-stroke-line" stroke-width="4"/>
    <line x1="155" y1="163" x2="155" y2="190" class="s-stroke-coral" stroke-width="4"/>
    <polygon points="155,200 147,188 163,188" class="s-coral"/>
    <line x1="505" y1="163" x2="505" y2="190" class="s-stroke-teal" stroke-width="4"/>
    <polygon points="505,200 497,188 513,188" class="s-teal"/>

    <rect x="40" y="210" width="230" height="82" rx="12" class="s-tile" stroke-width="2"/>
    <text x="155" y="237" class="s-muted" font-size="14">SHORT VOWEL</text>
    <text x="155" y="272" class="s-coral" font-size="30" font-weight="700">ss</text>

    <rect x="390" y="210" width="230" height="82" rx="12" class="s-tile" stroke-width="2"/>
    <text x="505" y="237" class="s-muted" font-size="14">LONG OR DIPHTHONG</text>
    <text x="505" y="272" class="s-teal" font-size="30" font-weight="700">ß</text>

    <text x="320" y="323" class="s-muted" font-size="15">Swiss standard spelling uses ss in both branches.</text>
  </g>
</svg>

<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hierarchy of evidence for German noun gender: productive suffix, broader word shape, semantic class, and lexical memory">
  <rect x="140" y="25" width="560" height="74" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="56" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">1 · PRODUCTIVE SUFFIX</text>
  <text x="420" y="82" text-anchor="middle" font-size="16" class="s-muted">usually categorical</text>
  <line x1="420" y1="109" x2="420" y2="126" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <rect x="165" y="136" width="510" height="68" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="165" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">2 · BROADER WORD SHAPE</text>
  <text x="420" y="190" text-anchor="middle" font-size="16" class="s-muted">strong probability, exceptions expected</text>
  <line x1="420" y1="214" x2="420" y2="231" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <rect x="190" y="241" width="460" height="68" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="270" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">3 · SEMANTIC CLASS</text>
  <text x="420" y="295" text-anchor="middle" font-size="16" class="s-muted">use when form does not settle it</text>
  <line x1="420" y1="319" x2="420" y2="336" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <rect x="215" y="346" width="410" height="60" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="373" text-anchor="middle" font-size="19" font-weight="800" class="s-ink">4 · LEXICAL MEMORY</text>
  <text x="420" y="395" text-anchor="middle" font-size="15" class="s-muted">article + noun + plural</text>
</svg>

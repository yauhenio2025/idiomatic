<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="German decimal comma followed by separately spoken digits">
  <text x="420" y="47" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">AFTER THE COMMA, READ EACH DIGIT</text>
  <rect x="90" y="102" width="150" height="140" rx="16" class="s-tile" stroke-width="3"/>
  <text x="165" y="151" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">WHOLE</text>
  <text x="165" y="210" text-anchor="middle" font-size="48" font-weight="800" class="s-teal">4</text>
  <rect x="270" y="102" width="120" height="140" rx="16" class="s-tile" stroke-width="3"/>
  <text x="330" y="151" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">COMMA</text>
  <text x="330" y="205" text-anchor="middle" font-size="48" font-weight="800" class="s-coral">,</text>
  <rect x="420" y="102" width="150" height="140" rx="16" class="s-tile" stroke-width="3"/>
  <text x="495" y="151" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">DIGIT 1</text>
  <text x="495" y="210" text-anchor="middle" font-size="48" font-weight="800" class="s-sun">7</text>
  <rect x="600" y="102" width="150" height="140" rx="16" class="s-tile" stroke-width="3"/>
  <text x="675" y="151" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">DIGIT 2</text>
  <text x="675" y="210" text-anchor="middle" font-size="48" font-weight="800" class="s-sun">5</text>
  <text x="420" y="300" text-anchor="middle" font-size="26" font-weight="700" class="s-muted">spoken as</text>
  <rect x="105" y="328" width="630" height="78" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="379" text-anchor="middle" font-size="32" font-weight="800" class="s-ink">vier Komma sieben fünf</text>
</svg>

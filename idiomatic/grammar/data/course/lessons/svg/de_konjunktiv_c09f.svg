<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline for als ob clauses: simple subjunctive for simultaneous events, pluperfect for earlier events, and würde for later events">
  <text x="420" y="42" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">PLACE THE AS-IF EVENT IN TIME</text>
  <rect x="35" y="92" width="230" height="190" rx="16" class="s-tile" stroke-width="3"/>
  <text x="150" y="132" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">EARLIER</text>
  <text x="150" y="174" text-anchor="middle" font-size="23" font-weight="800" class="s-ink">hätte gearbeitet</text>
  <text x="150" y="211" text-anchor="middle" font-size="17" class="s-muted">pluperfect K II</text>
  <text x="150" y="250" text-anchor="middle" font-size="16" class="s-coral">already before</text>
  <rect x="305" y="92" width="230" height="190" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="132" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">SIMULTANEOUS</text>
  <text x="420" y="174" text-anchor="middle" font-size="26" font-weight="800" class="s-ink">wüsste</text>
  <text x="420" y="211" text-anchor="middle" font-size="17" class="s-muted">simple K II</text>
  <text x="420" y="250" text-anchor="middle" font-size="16" class="s-coral">at the same time</text>
  <rect x="575" y="92" width="230" height="190" rx="16" class="s-tile" stroke-width="3"/>
  <text x="690" y="132" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">LATER</text>
  <text x="690" y="174" text-anchor="middle" font-size="23" font-weight="800" class="s-ink">ausfallen würde</text>
  <text x="690" y="211" text-anchor="middle" font-size="17" class="s-muted">conditional form</text>
  <text x="690" y="250" text-anchor="middle" font-size="16" class="s-coral">still ahead</text>
  <text x="420" y="329" text-anchor="middle" font-size="17" class="s-muted">comparison event</text>
  <line x1="90" y1="355" x2="735" y2="355" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="760,355 732,340 732,370" class="s-teal"/>
  <text x="420" y="403" text-anchor="middle" font-size="19" class="s-ink">The main clause supplies the viewpoint; the comparison gets its own clock.</text>
</svg>

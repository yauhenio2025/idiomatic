<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" role="img" aria-label="German can generalize with a definite singular type, a bare plural population, or an indefinite representative">
  <text class="s-ink" x="320" y="29" text-anchor="middle" font-size="20" font-weight="700">Three lenses on a whole class</text>

  <rect class="s-tile" x="24" y="52" width="592" height="66" rx="14"/>
  <rect class="s-stroke-teal" x="42" y="68" width="150" height="34" rx="9" stroke-width="3"/>
  <text class="s-teal" x="117" y="91" text-anchor="middle" font-size="16" font-weight="700">definite singular</text>
  <text class="s-ink" x="216" y="82" font-size="16" font-weight="700">TYPE</text>
  <text class="s-muted" x="216" y="103" font-size="14">the species as one conceptual whole</text>

  <rect class="s-tile" x="24" y="132" width="592" height="66" rx="14"/>
  <rect class="s-stroke-line" x="42" y="148" width="150" height="34" rx="9" stroke-width="3"/>
  <text class="s-muted" x="117" y="171" text-anchor="middle" font-size="16" font-weight="700">bare plural</text>
  <text class="s-ink" x="216" y="162" font-size="16" font-weight="700">POPULATION</text>
  <text class="s-muted" x="216" y="183" font-size="14">members viewed collectively</text>

  <rect class="s-tile" x="24" y="212" width="592" height="66" rx="14"/>
  <rect class="s-stroke-coral" x="42" y="228" width="150" height="34" rx="9" stroke-width="3"/>
  <text class="s-coral" x="117" y="251" text-anchor="middle" font-size="16" font-weight="700">indefinite singular</text>
  <text class="s-ink" x="216" y="242" font-size="16" font-weight="700">REPRESENTATIVE</text>
  <text class="s-muted" x="216" y="263" font-size="14">any one member stands for the class</text>

  <text class="s-muted" x="320" y="302" text-anchor="middle" font-size="14">same truth · different conceptual packaging</text>
</svg>

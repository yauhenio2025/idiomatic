<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Weak, strong and irregular principal-part patterns</title>
  <desc id="desc">Three columns contrast dental suffixes, root-vowel alternation and mixed irregularity.</desc>
  <text x="320" y="34" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="23" font-weight="700">Three routes through the past</text>
  <rect x="20" y="66" width="190" height="250" rx="15" class="s-tile" stroke-width="2"/>
  <rect x="225" y="66" width="190" height="250" rx="15" class="s-tile" stroke-width="2"/>
  <rect x="430" y="66" width="190" height="250" rx="15" class="s-tile" stroke-width="2"/>
  <text x="115" y="104" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="19" font-weight="700">WEAK</text>
  <text x="320" y="104" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="19" font-weight="700">STRONG</text>
  <text x="525" y="104" text-anchor="middle" class="s-sun" font-family="system-ui, sans-serif" font-size="19" font-weight="700">IRREGULAR</text>
  <line x1="42" y1="121" x2="188" y2="121" class="s-stroke-line" stroke-width="2"/>
  <line x1="247" y1="121" x2="393" y2="121" class="s-stroke-line" stroke-width="2"/>
  <line x1="452" y1="121" x2="598" y2="121" class="s-stroke-line" stroke-width="2"/>
  <text x="115" y="158" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">planen</text>
  <text x="115" y="194" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">plante</text>
  <text x="115" y="230" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">geplant</text>
  <text x="115" y="282" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">dental suffix</text>
  <text x="320" y="158" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">werfen</text>
  <text x="320" y="194" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">warf</text>
  <text x="320" y="230" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">geworfen</text>
  <text x="320" y="282" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">vowel alternation</text>
  <text x="525" y="158" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">nennen</text>
  <text x="525" y="194" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">nannte</text>
  <text x="525" y="230" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18">genannt</text>
  <text x="525" y="282" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">weak ending + shift</text>
  <text x="320" y="344" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">Store principal parts as one lexical row.</text>
</svg>

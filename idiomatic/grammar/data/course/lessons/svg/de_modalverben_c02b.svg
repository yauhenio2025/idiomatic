<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Perfect modal construction with two infinitives compared with a modal used alone">
  <text x="320" y="31" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Perfect with a governed infinitive</text>
  <circle cx="91" cy="73" r="16" class="s-dead"/>
  <text x="91" y="79" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <circle cx="291" cy="73" r="16" class="s-dead"/>
  <text x="291" y="79" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <circle cx="501" cy="73" r="16" class="s-dead"/>
  <text x="501" y="79" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3</text>
  <rect x="25" y="101" width="132" height="64" rx="12" class="s-tile"/>
  <text x="91" y="139" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="22" font-weight="700">haben</text>
  <rect x="202" y="101" width="178" height="64" rx="12" class="s-tile"/>
  <text x="291" y="139" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">verlängern</text>
  <rect x="424" y="101" width="154" height="64" rx="12" class="s-tile"/>
  <text x="501" y="139" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="22" font-weight="700">müssen</text>
  <text x="91" y="188" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">finite auxiliary</text>
  <text x="291" y="188" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">lexical infinitive</text>
  <text x="501" y="188" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="13">modal infinitive</text>
  <rect x="142" y="224" width="356" height="50" rx="12" class="s-tile"/>
  <text x="320" y="255" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="17">modal alone: haben + gewollt</text>
</svg>

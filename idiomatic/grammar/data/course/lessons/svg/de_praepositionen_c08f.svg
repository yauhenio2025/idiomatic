<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aus presents a chosen motive leading to action, while vor presents an involuntary cause producing a reaction">
  <text x="420" y="48" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">CAUSE THROUGH THE LENS OF AGENCY</text>
  <rect x="55" y="95" width="300" height="210" rx="18" class="s-tile" stroke-width="2"/>
  <text x="205" y="137" text-anchor="middle" font-size="27" font-weight="800" class="s-teal">AUS + DATIVE</text>
  <text x="205" y="180" text-anchor="middle" font-size="19" class="s-ink">reason is adopted</text>
  <line x1="125" y1="220" x2="265" y2="220" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="285,220 263,208 263,232" class="s-teal"/>
  <text x="205" y="266" text-anchor="middle" font-size="18" class="s-muted">motive → deliberate action</text>
  <rect x="485" y="95" width="300" height="210" rx="18" class="s-tile" stroke-width="2"/>
  <text x="635" y="137" text-anchor="middle" font-size="27" font-weight="800" class="s-coral">VOR + DATIVE</text>
  <text x="635" y="180" text-anchor="middle" font-size="19" class="s-ink">cause overwhelms</text>
  <line x1="555" y1="220" x2="695" y2="220" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="715,220 693,208 693,232" class="s-coral"/>
  <text x="635" y="266" text-anchor="middle" font-size="18" class="s-muted">trigger → involuntary reaction</text>
  <text x="420" y="357" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">not two translations of “because of”</text>
  <text x="420" y="393" text-anchor="middle" font-size="17" class="s-muted">the experiencer's agency selects the construction</text>
</svg>

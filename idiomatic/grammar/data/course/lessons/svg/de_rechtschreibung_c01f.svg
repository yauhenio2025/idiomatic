<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">Final devoicing preserves the written word family</title>
  <desc id="desc">Two measured paths show written b d g heard as p t k at a word edge, but returning before a vowel in the same word family.</desc>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="34" class="s-ink" font-size="24" font-weight="700">ONE SPELLING, POSITION-SENSITIVE SOUND</text>

    <rect x="35" y="78" width="150" height="78" rx="12" class="s-tile" stroke-width="2"/>
    <text x="110" y="105" class="s-muted" font-size="14">WRITTEN FAMILY</text>
    <text x="110" y="137" class="s-teal" font-size="26" font-weight="700">b · d · g</text>

    <line x1="195" y1="117" x2="245" y2="117" class="s-stroke-coral" stroke-width="4"/>
    <polygon points="255,117 243,109 243,125" class="s-coral"/>

    <rect x="265" y="78" width="150" height="78" rx="12" class="s-tile" stroke-width="2"/>
    <text x="340" y="105" class="s-muted" font-size="14">AT THE EDGE</text>
    <text x="340" y="137" class="s-coral" font-size="26" font-weight="700">p · t · k</text>

    <rect x="35" y="218" width="150" height="78" rx="12" class="s-tile" stroke-width="2"/>
    <text x="110" y="245" class="s-muted" font-size="14">SAME FAMILY</text>
    <text x="110" y="277" class="s-teal" font-size="22" font-weight="700">add a vowel</text>

    <text x="325" y="228" class="s-muted" font-size="14">the underlying consonant returns</text>
    <line x1="195" y1="257" x2="445" y2="257" class="s-stroke-teal" stroke-width="4"/>
    <polygon points="455,257 443,249 443,265" class="s-teal"/>

    <rect x="465" y="218" width="140" height="78" rx="12" class="s-tile" stroke-width="2"/>
    <text x="535" y="245" class="s-muted" font-size="14">BEFORE VOWEL</text>
    <text x="535" y="277" class="s-teal" font-size="26" font-weight="700">b · d · g</text>
  </g>
</svg>

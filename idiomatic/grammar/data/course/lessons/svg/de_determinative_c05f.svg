<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Question and answer pointers combine with a preposition to form worauf and darauf">
  <text x="320" y="31" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">One preposition, two pointers</text>
  <text x="45" y="67" font-size="14" font-weight="700" class="s-muted">ASK FOR THE LINK</text>
  <rect x="45" y="80" width="125" height="58" rx="12" class="s-tile"/>
  <text x="107" y="116" text-anchor="middle" font-size="24" font-weight="700" class="s-teal">wo(r)-</text>
  <text x="190" y="117" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">+</text>
  <rect x="210" y="80" width="105" height="58" rx="12" class="s-tile"/>
  <text x="262" y="116" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">auf</text>
  <path d="M325 109 L389 109" stroke-width="3" class="s-stroke-teal"/>
  <polygon points="399,109 388,103 388,115" class="s-teal"/>
  <rect x="409" y="80" width="186" height="58" rx="12" class="s-tile"/>
  <text x="502" y="116" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">worauf?</text>
  <text x="45" y="186" font-size="14" font-weight="700" class="s-muted">RESUME THE LINK</text>
  <rect x="45" y="199" width="125" height="58" rx="12" class="s-tile"/>
  <text x="107" y="235" text-anchor="middle" font-size="24" font-weight="700" class="s-coral">da(r)-</text>
  <text x="190" y="236" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">+</text>
  <rect x="210" y="199" width="105" height="58" rx="12" class="s-tile"/>
  <text x="262" y="235" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">auf</text>
  <path d="M325 228 L389 228" stroke-width="3" class="s-stroke-coral"/>
  <polygon points="399,228 388,222 388,234" class="s-coral"/>
  <rect x="409" y="199" width="186" height="58" rx="12" class="s-tile"/>
  <text x="502" y="235" text-anchor="middle" font-size="25" font-weight="700" class="s-coral">darauf</text>
</svg>

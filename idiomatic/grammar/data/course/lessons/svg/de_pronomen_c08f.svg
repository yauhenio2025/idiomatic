<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three parallel paths show es resuming a neuter noun, a whole event, or a previous predicate">
  <text x="420" y="38" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">The same form can package three antecedents</text>
  <rect x="42" y="73" width="300" height="74" rx="13" class="s-tile" stroke-width="2"/>
  <text x="192" y="104" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">neuter noun</text>
  <text x="192" y="131" text-anchor="middle" font-size="18" class="s-muted">das Protokoll</text>
  <line x1="352" y1="110" x2="497" y2="110" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="506,110 495,103 495,117" class="s-teal"/>
  <rect x="514" y="73" width="284" height="74" rx="13" class="s-tile" stroke-width="3"/>
  <text x="656" y="104" text-anchor="middle" font-size="29" font-weight="800" class="s-teal">es</text>
  <text x="656" y="131" text-anchor="middle" font-size="17" class="s-muted">ordinary noun reference</text>
  <rect x="42" y="180" width="300" height="74" rx="13" class="s-tile" stroke-width="2"/>
  <text x="192" y="211" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">whole event</text>
  <text x="192" y="238" text-anchor="middle" font-size="18" class="s-muted">the postponed vote</text>
  <line x1="352" y1="217" x2="497" y2="217" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="506,217 495,210 495,224" class="s-coral"/>
  <rect x="514" y="180" width="284" height="74" rx="13" class="s-tile" stroke-width="3"/>
  <text x="656" y="211" text-anchor="middle" font-size="29" font-weight="800" class="s-coral">es</text>
  <text x="656" y="238" text-anchor="middle" font-size="17" class="s-muted">one object-sized package</text>
  <rect x="42" y="287" width="300" height="74" rx="13" class="s-tile" stroke-width="2"/>
  <text x="192" y="318" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">previous predicate</text>
  <text x="192" y="345" text-anchor="middle" font-size="18" class="s-muted">unbestechlich</text>
  <line x1="352" y1="324" x2="497" y2="324" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="506,324 495,317 495,331" class="s-teal"/>
  <rect x="514" y="287" width="284" height="74" rx="13" class="s-tile" stroke-width="3"/>
  <text x="656" y="318" text-anchor="middle" font-size="29" font-weight="800" class="s-teal">es</text>
  <text x="656" y="345" text-anchor="middle" font-size="17" class="s-muted">required after sein / werden</text>
  <text x="420" y="408" text-anchor="middle" font-size="18" class="s-muted">first identify the antecedent type</text>
</svg>

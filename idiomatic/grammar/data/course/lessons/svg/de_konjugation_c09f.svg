<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="title desc">
  <title id="title">Decision map for haben and sein in the perfect</title>
  <desc id="desc">A perfect auxiliary question branches to bounded intransitive transitions with sein and the broad default classes with haben.</desc>
  <text x="320" y="32" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="23" font-weight="700">Choose from the event shape</text>
  <rect x="200" y="56" width="240" height="70" rx="14" class="s-tile" stroke-width="2"/>
  <text x="320" y="87" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18" font-weight="700">WHAT KIND OF EVENT?</text>
  <text x="320" y="111" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">meaning before memorization</text>
  <line x1="320" y1="126" x2="320" y2="146" class="s-stroke-line" stroke-width="3"/>
  <line x1="160" y1="146" x2="480" y2="146" class="s-stroke-line" stroke-width="3"/>
  <line x1="160" y1="146" x2="160" y2="168" class="s-stroke-teal" stroke-width="3"/>
  <polygon points="160,178 152,164 168,164" class="s-teal"/>
  <line x1="480" y1="146" x2="480" y2="168" class="s-stroke-coral" stroke-width="3"/>
  <polygon points="480,178 472,164 488,164" class="s-coral"/>
  <rect x="30" y="188" width="260" height="154" rx="14" class="s-tile" stroke-width="2"/>
  <rect x="350" y="188" width="260" height="154" rx="14" class="s-tile" stroke-width="2"/>
  <text x="160" y="225" text-anchor="middle" class="s-teal" font-family="system-ui, sans-serif" font-size="21" font-weight="700">SEIN</text>
  <text x="160" y="258" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">intransitive path</text>
  <text x="160" y="286" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">change of state</text>
  <text x="160" y="314" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">happen · be · remain</text>
  <text x="480" y="225" text-anchor="middle" class="s-coral" font-family="system-ui, sans-serif" font-size="21" font-weight="700">HABEN</text>
  <text x="480" y="258" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">transitive · reflexive</text>
  <text x="480" y="286" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">stable activity or state</text>
  <text x="480" y="314" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="16">most impersonal verbs</text>
  <text x="320" y="376" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="16">Transitivity can switch the same verb to the other side.</text>
</svg>

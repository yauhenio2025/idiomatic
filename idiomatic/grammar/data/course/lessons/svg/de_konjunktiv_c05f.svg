<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conditional matrix contrasting live and remote conditions in present and past time">
  <text x="420" y="38" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">CONDITIONS: STANCE × TIME</text>
  <text x="300" y="78" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">LIVE POSSIBILITY</text>
  <text x="625" y="78" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">REMOTE WORLD</text>
  <text x="80" y="157" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">NOW / NEXT</text>
  <text x="80" y="300" text-anchor="middle" font-size="18" font-weight="700" class="s-muted">PAST</text>
  <rect x="155" y="98" width="290" height="118" rx="14" class="s-tile" stroke-width="3"/>
  <text x="300" y="139" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">indicative</text>
  <text x="300" y="176" text-anchor="middle" font-size="19" class="s-ink">wenn sie Zeit hat</text>
  <text x="300" y="201" text-anchor="middle" font-size="16" class="s-muted">still genuinely possible</text>
  <rect x="480" y="98" width="290" height="118" rx="14" class="s-tile" stroke-width="3"/>
  <text x="625" y="139" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">K II simple</text>
  <text x="625" y="176" text-anchor="middle" font-size="19" class="s-ink">wenn sie Zeit hätte</text>
  <text x="625" y="201" text-anchor="middle" font-size="16" class="s-muted">imagined or unlikely</text>
  <rect x="155" y="241" width="290" height="118" rx="14" class="s-tile" stroke-width="3"/>
  <text x="300" y="282" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">indicative past</text>
  <text x="300" y="319" text-anchor="middle" font-size="18" class="s-ink">what actually happened</text>
  <text x="300" y="344" text-anchor="middle" font-size="16" class="s-muted">if / whenever</text>
  <rect x="480" y="241" width="290" height="118" rx="14" class="s-tile" stroke-width="3"/>
  <text x="625" y="282" text-anchor="middle" font-size="22" font-weight="800" class="s-coral">K II pluperfect</text>
  <text x="625" y="319" text-anchor="middle" font-size="18" class="s-ink">wenn sie Zeit gehabt hätte</text>
  <text x="625" y="344" text-anchor="middle" font-size="16" class="s-muted">did not happen</text>
  <text x="430" y="401" text-anchor="middle" font-size="17" class="s-muted">speaker commits less</text>
  <line x1="250" y1="421" x2="590" y2="421" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="612,421 586,407 586,435" class="s-coral"/>
</svg>

<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Whole-clause negation sits at a boundary after noun objects and background adverbials but before manner, selected complements, and the closing verb">
  <text x="420" y="50" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Whole-clause negation is a boundary</text>
  <text x="220" y="100" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">BEFORE THE BOUNDARY</text>
  <text x="648" y="100" text-anchor="middle" font-size="18" font-weight="700" class="s-coral">AFTER THE BOUNDARY</text>
  <rect x="25" y="135" width="180" height="94" rx="13" class="s-tile" stroke-width="2"/>
  <text x="115" y="175" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">noun objects</text>
  <text x="115" y="203" text-anchor="middle" font-size="16" class="s-muted">the report</text>
  <rect x="225" y="135" width="175" height="94" rx="13" class="s-tile" stroke-width="2"/>
  <text x="312" y="175" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">background</text>
  <text x="312" y="203" text-anchor="middle" font-size="16" class="s-muted">yesterday</text>
  <rect x="425" y="123" width="110" height="118" rx="18" class="s-tile" stroke-width="4"/>
  <text x="480" y="176" text-anchor="middle" font-size="27" font-weight="800" class="s-coral">nicht</text>
  <text x="480" y="207" text-anchor="middle" font-size="15" class="s-muted">NEGATIVE</text>
  <rect x="560" y="135" width="120" height="94" rx="13" class="s-tile" stroke-width="2"/>
  <text x="620" y="175" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">manner</text>
  <text x="620" y="203" text-anchor="middle" font-size="16" class="s-muted">thoroughly</text>
  <rect x="700" y="135" width="115" height="94" rx="13" class="s-tile" stroke-width="2"/>
  <text x="757" y="168" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">complement</text>
  <text x="757" y="196" text-anchor="middle" font-size="15" class="s-muted">to Vienna</text>
  <line x1="480" y1="271" x2="480" y2="323" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="480,341 467,320 493,320" class="s-coral"/>
  <rect x="190" y="351" width="580" height="53" rx="12" class="s-tile" stroke-width="2"/>
  <text x="480" y="384" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">partial negation moves directly before the constituent it rejects</text>
</svg>

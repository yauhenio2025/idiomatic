<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apposition mirror: mit puts Maria Simon in the dative, and the renaming phrase der deutschen Filmschauspielerin mirrors that dative">
  <text x="420" y="70" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">mit <tspan class="s-coral" font-weight="800">Maria Simon</tspan>, <tspan class="s-coral" font-weight="800">der deutschen Filmschauspielerin</tspan></text>
  <line x1="250" y1="95" x2="250" y2="150" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <line x1="590" y1="95" x2="590" y2="150" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <rect x="140" y="155" width="220" height="80" rx="14" class="s-coral"/>
  <text x="250" y="190" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">DATIV</text>
  <text x="250" y="218" text-anchor="middle" font-size="16" fill="#ffffff">mit decided the case</text>
  <rect x="480" y="155" width="220" height="80" rx="14" class="s-coral"/>
  <text x="590" y="190" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">DATIV</text>
  <text x="590" y="218" text-anchor="middle" font-size="16" fill="#ffffff">the renaming mirrors it</text>
  <path d="M 370 195 L 470 195" class="s-stroke-line" stroke-width="5" stroke-linecap="round"/>
  <text x="420" y="180" text-anchor="middle" font-size="26" font-weight="800" class="s-muted">=</text>
  <text x="420" y="300" text-anchor="middle" font-size="20" class="s-muted">the apposition is not a new decision —</text>
  <text x="420" y="330" text-anchor="middle" font-size="20" class="s-muted">it copies the case its noun already has</text>
  <text x="420" y="400" text-anchor="middle" font-size="20" font-weight="700" class="s-teal">same noun, same case — always</text>
</svg>

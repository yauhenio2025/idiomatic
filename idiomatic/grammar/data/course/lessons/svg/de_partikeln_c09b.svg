<svg viewBox="0 0 840 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moving nur from beside Lena to beside the draft changes the focused alternative set">
  <text x="420" y="40" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">ADJACENCY SELECTS THE ALTERNATIVES</text>
  <rect x="60" y="82" width="720" height="104" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="124" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">NUR LENA hat den Entwurf gelesen.</text>
  <line x1="250" y1="144" x2="350" y2="144" class="s-stroke-teal" stroke-width="6" stroke-linecap="round"/>
  <text x="420" y="170" text-anchor="middle" font-size="16" class="s-muted">people contrasted: Lena, Amir, Jo …</text>
  <line x1="420" y1="196" x2="420" y2="224" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <polygon points="420,232 408,212 432,212" class="s-dead"/>
  <rect x="60" y="242" width="720" height="104" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="284" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Lena hat NUR DEN ENTWURF gelesen.</text>
  <line x1="363" y1="304" x2="595" y2="304" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <text x="420" y="330" text-anchor="middle" font-size="16" class="s-muted">objects contrasted: draft, appendix, minutes …</text>
  <text x="420" y="407" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">MOVE NUR</text>
  <text x="420" y="439" text-anchor="middle" font-size="19" class="s-ink">→ move the focus → change the truth conditions</text>
</svg>

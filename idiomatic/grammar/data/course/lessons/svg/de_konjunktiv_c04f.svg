<svg viewBox="0 0 840 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree for choosing compact Konjunktiv II, würde plus infinitive, or the pluperfect subjunctive">
  <rect x="255" y="25" width="330" height="64" rx="14" class="s-tile" stroke-width="3"/>
  <text x="420" y="65" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">WHAT KIND OF DISTANCE?</text>
  <line x1="420" y1="89" x2="420" y2="112" class="s-stroke-line" stroke-width="4"/>
  <line x1="140" y1="112" x2="700" y2="112" class="s-stroke-line" stroke-width="4"/>
  <line x1="140" y1="112" x2="140" y2="135" class="s-stroke-teal" stroke-width="4"/>
  <polygon points="140,147 131,131 149,131" class="s-teal"/>
  <line x1="420" y1="112" x2="420" y2="135" class="s-stroke-coral" stroke-width="4"/>
  <polygon points="420,147 411,131 429,131" class="s-coral"/>
  <line x1="700" y1="112" x2="700" y2="135" class="s-stroke-teal" stroke-width="4"/>
  <polygon points="700,147 691,131 709,131" class="s-teal"/>
  <rect x="25" y="157" width="230" height="190" rx="16" class="s-tile" stroke-width="3"/>
  <text x="140" y="196" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">COMMON CORE</text>
  <text x="140" y="232" text-anchor="middle" font-size="17" class="s-muted">be · have · modals</text>
  <text x="140" y="277" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">wäre · hätte</text>
  <text x="140" y="314" text-anchor="middle" font-size="21" class="s-ink">könnte · müsste</text>
  <rect x="305" y="157" width="230" height="190" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="196" text-anchor="middle" font-size="19" font-weight="800" class="s-coral">OTHER PRESENT</text>
  <text x="420" y="232" text-anchor="middle" font-size="17" class="s-muted">weak or awkward verb</text>
  <text x="420" y="277" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">würde</text>
  <text x="420" y="314" text-anchor="middle" font-size="21" class="s-ink">+ infinitive</text>
  <rect x="585" y="157" width="230" height="190" rx="16" class="s-tile" stroke-width="3"/>
  <text x="700" y="196" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">PAST UNREAL</text>
  <text x="700" y="232" text-anchor="middle" font-size="17" class="s-muted">completed non-event</text>
  <text x="700" y="277" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">hätte / wäre</text>
  <text x="700" y="314" text-anchor="middle" font-size="21" class="s-ink">+ participle</text>
  <text x="420" y="403" text-anchor="middle" font-size="21" class="s-muted">Modern usage prefers clarity over rare showcase forms.</text>
</svg>

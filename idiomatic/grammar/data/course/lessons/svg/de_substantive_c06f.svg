<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The spelling Band branching into three separate nouns distinguished by gender and meaning">
  <rect x="310" y="30" width="220" height="80" rx="18" class="s-tile" stroke-width="3"/>
  <text x="420" y="65" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">BAND</text>
  <text x="420" y="92" text-anchor="middle" font-size="16" class="s-muted">one spelling shell</text>
  <line x1="420" y1="120" x2="420" y2="142" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="150" x2="700" y2="150" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="150" x2="140" y2="170" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <line x1="420" y1="150" x2="420" y2="170" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <line x1="700" y1="150" x2="700" y2="170" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <rect x="35" y="180" width="210" height="156" rx="18" class="s-tile" stroke-width="2"/>
  <text x="140" y="220" text-anchor="middle" font-size="22" font-weight="800" class="s-teal">der Band</text>
  <text x="140" y="256" text-anchor="middle" font-size="20" class="s-ink">book volume</text>
  <text x="140" y="290" text-anchor="middle" font-size="17" class="s-muted">plural: Bände</text>
  <rect x="315" y="180" width="210" height="156" rx="18" class="s-tile" stroke-width="2"/>
  <text x="420" y="220" text-anchor="middle" font-size="22" font-weight="800" class="s-coral">das Band</text>
  <text x="420" y="256" text-anchor="middle" font-size="20" class="s-ink">ribbon · bond</text>
  <text x="420" y="290" text-anchor="middle" font-size="17" class="s-muted">plurals: Bänder · Bande</text>
  <rect x="595" y="180" width="210" height="156" rx="18" class="s-tile" stroke-width="2"/>
  <text x="700" y="220" text-anchor="middle" font-size="22" font-weight="800" class="s-ink">die Band</text>
  <text x="700" y="256" text-anchor="middle" font-size="20" class="s-ink">music group</text>
  <text x="700" y="290" text-anchor="middle" font-size="17" class="s-muted">plural: Bands</text>
  <text x="420" y="389" text-anchor="middle" font-size="19" font-weight="700" class="s-ink">gender selects the lexeme; the lexeme selects the plural</text>
</svg>

<svg viewBox="0 0 840 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Command particles place the same requested action on a scale from permission to warning">
  <text x="420" y="40" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">THE ACTION STAYS — THE PRESSURE MOVES</text>
  <line x1="110" y1="142" x2="730" y2="142" class="s-stroke-line" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="142" r="19" class="s-teal"/>
  <circle cx="330" cy="142" r="19" class="s-teal"/>
  <circle cx="510" cy="142" r="19" class="s-coral"/>
  <circle cx="690" cy="142" r="19" class="s-coral"/>
  <text x="150" y="96" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">RUHIG</text>
  <text x="330" y="96" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">MAL</text>
  <text x="510" y="96" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">DOCH</text>
  <text x="690" y="96" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">BLOẞ / JA</text>
  <text x="150" y="190" text-anchor="middle" font-size="16" class="s-muted">permission</text>
  <text x="330" y="190" text-anchor="middle" font-size="16" class="s-muted">soft request</text>
  <text x="510" y="190" text-anchor="middle" font-size="16" class="s-muted">persuasion</text>
  <text x="690" y="190" text-anchor="middle" font-size="16" class="s-muted">warning</text>
  <rect x="95" y="248" width="650" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="289" text-anchor="middle" font-size="23" font-weight="800" class="s-ink">STRESS + POLARITY + SITUATION</text>
  <text x="420" y="326" text-anchor="middle" font-size="18" class="s-muted">can move NUR toward reassurance or threat</text>
  <text x="420" y="424" text-anchor="middle" font-size="19" class="s-ink">A particle does not replace intonation; it works with it.</text>
</svg>

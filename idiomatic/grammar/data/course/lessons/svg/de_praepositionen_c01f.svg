<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four families of German prepositions arranged by the case they govern">
  <text x="420" y="44" text-anchor="middle" font-size="28" font-weight="700" class="s-ink">PREPOSITION = RELATION + GOVERNMENT</text>
  <rect x="35" y="92" width="175" height="172" rx="16" class="s-tile" stroke-width="2"/>
  <text x="122" y="130" text-anchor="middle" font-size="19" font-weight="800" class="s-coral">FIXED ACC.</text>
  <text x="122" y="168" text-anchor="middle" font-size="17" class="s-ink">bis · durch · für</text>
  <text x="122" y="197" text-anchor="middle" font-size="17" class="s-ink">gegen · ohne · um</text>
  <text x="122" y="237" text-anchor="middle" font-size="15" class="s-muted">lexical government</text>
  <rect x="233" y="92" width="175" height="172" rx="16" class="s-tile" stroke-width="2"/>
  <text x="320" y="130" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">FIXED DAT.</text>
  <text x="320" y="168" text-anchor="middle" font-size="16" class="s-ink">aus · bei · mit · nach</text>
  <text x="320" y="197" text-anchor="middle" font-size="16" class="s-ink">seit · von · zu …</text>
  <text x="320" y="237" text-anchor="middle" font-size="15" class="s-muted">lexical government</text>
  <rect x="431" y="92" width="175" height="172" rx="16" class="s-tile" stroke-width="2"/>
  <text x="518" y="130" text-anchor="middle" font-size="19" font-weight="800" class="s-sun">TWO-WAY</text>
  <text x="518" y="168" text-anchor="middle" font-size="16" class="s-ink">an · auf · in · über</text>
  <text x="518" y="197" text-anchor="middle" font-size="16" class="s-ink">unter · vor …</text>
  <text x="518" y="229" text-anchor="middle" font-size="15" class="s-muted">scene = dat.</text>
  <text x="518" y="250" text-anchor="middle" font-size="15" class="s-muted">endpoint = acc.</text>
  <rect x="629" y="92" width="175" height="172" rx="16" class="s-tile" stroke-width="2"/>
  <text x="716" y="130" text-anchor="middle" font-size="19" font-weight="800" class="s-coral">GENITIVE</text>
  <text x="716" y="168" text-anchor="middle" font-size="16" class="s-ink">statt · trotz</text>
  <text x="716" y="197" text-anchor="middle" font-size="16" class="s-ink">während · wegen …</text>
  <text x="716" y="229" text-anchor="middle" font-size="15" class="s-muted">government</text>
  <text x="716" y="250" text-anchor="middle" font-size="15" class="s-muted">+ register</text>
  <rect x="155" y="315" width="530" height="68" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="344" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">choose the relationship first</text>
  <text x="420" y="370" text-anchor="middle" font-size="17" class="s-muted">then the family tells you how case is decided</text>
</svg>

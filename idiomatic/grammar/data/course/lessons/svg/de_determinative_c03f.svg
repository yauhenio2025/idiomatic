<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="A possessive combines a possessor stem with an ending controlled by the possessed noun phrase">
  <text x="320" y="31" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">Two agreements, one word</text>
  <text x="135" y="65" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">WHO POSSESSES?</text>
  <rect x="45" y="78" width="180" height="64" rx="12" class="s-tile"/>
  <text x="135" y="107" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">unser-</text>
  <text x="135" y="130" text-anchor="middle" font-size="14" class="s-ink">first-person plural</text>
  <text x="505" y="65" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">WHAT CASE / GENDER?</text>
  <rect x="415" y="78" width="180" height="64" rx="12" class="s-tile"/>
  <text x="505" y="107" text-anchor="middle" font-size="25" font-weight="700" class="s-coral">-es</text>
  <text x="505" y="130" text-anchor="middle" font-size="14" class="s-ink">genitive masculine</text>
  <path d="M135 142 L274 188" stroke-width="3" class="s-stroke-teal"/>
  <polygon points="284,191 272,193 276,181" class="s-teal"/>
  <path d="M505 142 L366 188" stroke-width="3" class="s-stroke-coral"/>
  <polygon points="356,191 364,181 368,193" class="s-coral"/>
  <rect x="230" y="201" width="180" height="72" rx="12" class="s-tile"/>
  <text x="320" y="237" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">unseres</text>
  <text x="320" y="259" text-anchor="middle" font-size="14" class="s-muted">Antrags</text>
</svg>

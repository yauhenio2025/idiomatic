<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A noun phrase connected to its three grammatical coordinates: stored gender, selected number, and assigned case">
  <rect x="90" y="38" width="660" height="82" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="73" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">unsere seit Monaten verschobene Entscheidung</text>
  <text x="420" y="101" text-anchor="middle" font-size="17" class="s-muted">one noun phrase · three coordinates</text>
  <line x1="420" y1="130" x2="420" y2="154" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="160" x2="675" y2="160" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="160" x2="165" y2="174" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <line x1="420" y1="160" x2="420" y2="174" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <line x1="675" y1="160" x2="675" y2="174" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <rect x="60" y="184" width="210" height="122" rx="16" class="s-tile" stroke-width="2"/>
  <text x="165" y="220" text-anchor="middle" font-size="20" font-weight="800" class="s-teal">GENDER</text>
  <text x="165" y="250" text-anchor="middle" font-size="18" class="s-ink">feminine</text>
  <text x="165" y="280" text-anchor="middle" font-size="16" class="s-muted">stored in the lexicon</text>
  <rect x="315" y="184" width="210" height="122" rx="16" class="s-tile" stroke-width="2"/>
  <text x="420" y="220" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">NUMBER</text>
  <text x="420" y="250" text-anchor="middle" font-size="18" class="s-ink">singular</text>
  <text x="420" y="280" text-anchor="middle" font-size="16" class="s-muted">selected by the speaker</text>
  <rect x="570" y="184" width="210" height="122" rx="16" class="s-tile" stroke-width="2"/>
  <text x="675" y="220" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">CASE</text>
  <text x="675" y="250" text-anchor="middle" font-size="18" class="s-ink">nominative</text>
  <text x="675" y="280" text-anchor="middle" font-size="16" class="s-muted">assigned by the sentence</text>
  <text x="420" y="366" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">the coordinates control every ending in the phrase</text>
  <text x="420" y="397" text-anchor="middle" font-size="17" class="s-muted">identify the head noun first</text>
</svg>

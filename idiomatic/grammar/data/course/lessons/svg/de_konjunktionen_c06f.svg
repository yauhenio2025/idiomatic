<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Causal meaning can be packaged as background, an independent reason, or an afterthought inside a clause">
  <text x="320" y="34" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="22" font-weight="700">ONE CAUSE, THREE DISCOURSE PACKAGES</text>

  <rect x="28" y="60" width="584" height="72" rx="14" class="s-tile" stroke-width="2"/>
  <text x="52" y="87" class="s-coral" font-family="system-ui, sans-serif" font-size="16" font-weight="700">BACKGROUND</text>
  <text x="212" y="87" class="s-ink" font-family="system-ui, sans-serif" font-size="16">subordinate clause</text>
  <text x="212" y="113" class="s-teal" font-family="system-ui, sans-serif" font-size="16" font-weight="700">connector … finite verb</text>

  <rect x="28" y="146" width="584" height="72" rx="14" class="s-tile" stroke-width="2"/>
  <text x="52" y="173" class="s-coral" font-family="system-ui, sans-serif" font-size="16" font-weight="700">ASSERTION</text>
  <text x="212" y="173" class="s-ink" font-family="system-ui, sans-serif" font-size="16">coordinated main clause</text>
  <text x="212" y="199" class="s-teal" font-family="system-ui, sans-serif" font-size="16" font-weight="700">connector + field 1 + finite verb</text>

  <rect x="28" y="232" width="584" height="72" rx="14" class="s-tile" stroke-width="2"/>
  <text x="52" y="259" class="s-coral" font-family="system-ui, sans-serif" font-size="16" font-weight="700">AFTERTHOUGHT</text>
  <text x="212" y="259" class="s-ink" font-family="system-ui, sans-serif" font-size="16">adverb inside main clause</text>
  <text x="212" y="285" class="s-teal" font-family="system-ui, sans-serif" font-size="16" font-weight="700">field 1 + finite verb + reason adverb</text>
</svg>

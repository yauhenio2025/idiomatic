<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree for choosing strong or weak German adjective endings by inspecting the determiner">
  <text x="420" y="46" text-anchor="middle" font-size="28" font-weight="700" class="s-ink">Route from the determiner</text>

  <rect x="235" y="78" width="370" height="78" rx="15" class="s-tile" stroke-width="2"/>
  <text x="420" y="110" text-anchor="middle" font-size="19" class="s-muted">Does the determiner show the features</text>
  <text x="420" y="137" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">with a visible ending?</text>

  <line x1="420" y1="166" x2="420" y2="187" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="187" x2="620" y2="187" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="187" x2="220" y2="224" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <line x1="620" y1="187" x2="620" y2="224" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="220,240 210,221 230,221" class="s-teal"/>
  <polygon points="620,240 610,221 630,221" class="s-coral"/>
  <text x="173" y="211" text-anchor="end" font-size="18" font-weight="700" class="s-teal">NO</text>
  <text x="667" y="211" text-anchor="start" font-size="18" font-weight="700" class="s-coral">YES</text>

  <rect x="55" y="250" width="330" height="108" rx="15" class="s-tile" stroke-width="2"/>
  <text x="220" y="283" text-anchor="middle" font-size="18" class="s-muted">none · ein · mein · kein</text>
  <text x="220" y="318" text-anchor="middle" font-size="25" font-weight="700" class="s-teal">STRONG ending</text>
  <text x="220" y="344" text-anchor="middle" font-size="17" class="s-ink">adjective supplies the signal</text>

  <rect x="455" y="250" width="330" height="108" rx="15" class="s-tile" stroke-width="2"/>
  <text x="620" y="283" text-anchor="middle" font-size="18" class="s-muted">der · einem · dieser · jeder</text>
  <text x="620" y="318" text-anchor="middle" font-size="25" font-weight="700" class="s-coral">WEAK ending</text>
  <text x="620" y="344" text-anchor="middle" font-size="17" class="s-ink">determiner already signals</text>

  <text x="420" y="404" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">“Mixed” simply switches routes as the determiner changes form.</text>
</svg>

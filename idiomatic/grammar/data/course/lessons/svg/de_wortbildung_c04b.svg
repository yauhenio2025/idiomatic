<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">Adjective suffixes divide meaning</title>
  <desc id="desc">Two contrasts distinguish material from resemblance and duration from frequency.</desc>
  <text class="s-ink" x="320" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Same root, different relation</text>

  <rect class="s-tile" x="20" y="60" width="290" height="110" rx="14"/>
  <text class="s-muted" x="165" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">actual material</text>
  <text class="s-teal" x="165" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">hölzern</text>
  <text class="s-ink" x="165" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">ein hölzerner Rahmen</text>
  <rect class="s-tile" x="330" y="60" width="290" height="110" rx="14"/>
  <text class="s-muted" x="475" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">resemblance</text>
  <text class="s-coral" x="475" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">holzig</text>
  <text class="s-ink" x="475" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">ein holziger Geschmack</text>

  <rect class="s-tile" x="20" y="195" width="290" height="110" rx="14"/>
  <text class="s-muted" x="165" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">duration</text>
  <text class="s-teal" x="165" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">zweistündig</text>
  <text class="s-ink" x="165" y="283" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">eine zweistündige Sitzung</text>
  <rect class="s-tile" x="330" y="195" width="290" height="110" rx="14"/>
  <text class="s-muted" x="475" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">frequency</text>
  <text class="s-coral" x="475" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700">zweistündlich</text>
  <text class="s-ink" x="475" y="283" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16">eine zweistündliche Messung</text>
</svg>

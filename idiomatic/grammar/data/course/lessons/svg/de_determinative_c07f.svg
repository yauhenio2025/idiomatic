<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="A named noun takes preposition plus relative pronoun, while a broad indefinite or whole clause takes a wor compound">
  <text x="320" y="31" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">First classify the antecedent</text>
  <text x="170" y="65" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">NAMED NOUN</text>
  <rect x="45" y="78" width="250" height="60" rx="12" class="s-tile"/>
  <text x="170" y="115" text-anchor="middle" font-size="23" font-weight="700" class="s-teal">der Beschluss</text>
  <text x="170" y="172" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">+ über</text>
  <rect x="45" y="194" width="250" height="70" rx="12" class="s-tile"/>
  <text x="170" y="224" text-anchor="middle" font-size="26" font-weight="700" class="s-teal">über den</text>
  <text x="170" y="248" text-anchor="middle" font-size="14" class="s-muted">inflected relative</text>
  <text x="470" y="65" text-anchor="middle" font-size="14" font-weight="700" class="s-muted">BROAD IDEA / WHOLE CLAUSE</text>
  <rect x="345" y="78" width="250" height="60" rx="12" class="s-tile"/>
  <text x="470" y="115" text-anchor="middle" font-size="23" font-weight="700" class="s-coral">alles / Aussage</text>
  <text x="470" y="172" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">+ über</text>
  <rect x="345" y="194" width="250" height="70" rx="12" class="s-tile"/>
  <text x="470" y="224" text-anchor="middle" font-size="26" font-weight="700" class="s-coral">worüber</text>
  <text x="470" y="248" text-anchor="middle" font-size="14" class="s-muted">prepositional compound</text>
</svg>

<svg viewBox="0 0 840 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contrast among German frequency adverb, occasion noun, and mals adverb">
  <text x="420" y="45" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">SPELLING REVEALS THE GRAMMATICAL JOB</text>
  <rect x="35" y="96" width="240" height="286" rx="16" class="s-tile" stroke-width="3"/>
  <text x="155" y="139" text-anchor="middle" font-size="17" font-weight="800" class="s-teal">FREQUENCY</text>
  <text x="155" y="206" text-anchor="middle" font-size="35" font-weight="800" class="s-ink">dreimal</text>
  <text x="155" y="263" text-anchor="middle" font-size="18" class="s-muted">one lower-case word</text>
  <text x="155" y="326" text-anchor="middle" font-size="18" class="s-ink">How often?</text>
  <rect x="300" y="96" width="240" height="286" rx="16" class="s-tile" stroke-width="3"/>
  <text x="420" y="139" text-anchor="middle" font-size="17" font-weight="800" class="s-coral">OCCASION</text>
  <text x="420" y="206" text-anchor="middle" font-size="30" font-weight="800" class="s-ink">das dritte Mal</text>
  <text x="420" y="263" text-anchor="middle" font-size="18" class="s-muted">separate capitalized noun</text>
  <text x="420" y="326" text-anchor="middle" font-size="18" class="s-ink">Which occasion?</text>
  <rect x="565" y="96" width="240" height="286" rx="16" class="s-tile" stroke-width="3"/>
  <text x="685" y="139" text-anchor="middle" font-size="17" font-weight="800" class="s-sun">LEXICAL ADVERB</text>
  <text x="685" y="206" text-anchor="middle" font-size="35" font-weight="800" class="s-ink">erstmals</text>
  <text x="685" y="263" text-anchor="middle" font-size="18" class="s-muted">fixed suffix</text>
  <text x="685" y="326" text-anchor="middle" font-size="18" class="s-ink">first occurrence</text>
  <text x="420" y="428" text-anchor="middle" font-size="18" class="s-muted">suffix adverb · ordinary noun phrase · lexical adverb</text>
</svg>

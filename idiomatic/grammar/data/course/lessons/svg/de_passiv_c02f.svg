<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-step process for forming a German werden passive from an active accusative object">
  <text x="420" y="43" text-anchor="middle" font-size="28" font-weight="700" class="s-ink">Build the process passive</text>

  <rect x="25" y="103" width="220" height="142" rx="15" class="s-tile" stroke-width="2"/>
  <text x="135" y="137" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">1 · PROMOTE</text>
  <text x="135" y="178" text-anchor="middle" font-size="21" class="s-ink">accusative object</text>
  <text x="135" y="209" text-anchor="middle" font-size="20" font-weight="700" class="s-coral">→ nominative</text>

  <line x1="255" y1="174" x2="298" y2="174" class="s-stroke-line" stroke-width="5" stroke-linecap="round"/>
  <polygon points="310,174 292,163 292,185" class="s-dead"/>

  <rect x="320" y="103" width="200" height="142" rx="15" class="s-tile" stroke-width="2"/>
  <text x="420" y="137" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">2 · INFLECT</text>
  <text x="420" y="178" text-anchor="middle" font-size="22" class="s-ink">werden</text>
  <text x="420" y="209" text-anchor="middle" font-size="18" class="s-muted">tense + agreement</text>

  <line x1="530" y1="174" x2="588" y2="174" class="s-stroke-line" stroke-width="5" stroke-linecap="round"/>
  <polygon points="600,174 582,163 582,185" class="s-dead"/>

  <rect x="610" y="103" width="205" height="142" rx="15" class="s-tile" stroke-width="2"/>
  <text x="712" y="137" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">3 · ANCHOR</text>
  <text x="712" y="178" text-anchor="middle" font-size="21" class="s-ink">past participle</text>
  <text x="712" y="209" text-anchor="middle" font-size="18" class="s-muted">fixed at the right edge</text>

  <rect x="165" y="292" width="510" height="72" rx="14" class="s-tile" stroke-width="2"/>
  <text x="420" y="322" text-anchor="middle" font-size="18" class="s-muted">optional final addition</text>
  <text x="420" y="350" text-anchor="middle" font-size="21" font-weight="700" class="s-coral">agent phrase — only if relevant</text>
  <text x="420" y="402" text-anchor="middle" font-size="18" class="s-muted">The participle never agrees. The finite auxiliary does.</text>
</svg>

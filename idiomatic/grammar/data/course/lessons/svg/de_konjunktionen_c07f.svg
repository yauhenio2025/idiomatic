<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Purpose runs from a plan to an intended target, while result runs from an event to an actual outcome">
  <defs>
    <marker id="arrow-teal-c07" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" class="s-teal"/>
    </marker>
    <marker id="arrow-coral-c07" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" class="s-coral"/>
    </marker>
  </defs>
  <text x="320" y="34" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="20" font-weight="700">INTENTION AND OUTCOME RUN IN DIFFERENT DIRECTIONS</text>

  <text x="30" y="75" class="s-teal" font-family="system-ui, sans-serif" font-size="18" font-weight="700">PURPOSE: target exists in the plan</text>
  <rect x="30" y="92" width="180" height="66" rx="13" class="s-tile" stroke-width="2"/>
  <text x="120" y="132" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18" font-weight="700">INTENDED TARGET</text>
  <line x1="220" y1="125" x2="390" y2="125" class="s-stroke-teal" stroke-width="4" marker-end="url(#arrow-teal-c07)"/>
  <text x="305" y="107" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">motivates</text>
  <rect x="400" y="92" width="210" height="66" rx="13" class="s-tile" stroke-width="2"/>
  <text x="505" y="132" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18" font-weight="700">CHOSEN ACTION</text>

  <text x="30" y="211" class="s-coral" font-family="system-ui, sans-serif" font-size="18" font-weight="700">RESULT: outcome follows the event</text>
  <rect x="30" y="228" width="180" height="66" rx="13" class="s-tile" stroke-width="2"/>
  <text x="120" y="268" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18" font-weight="700">EVENT</text>
  <line x1="220" y1="261" x2="390" y2="261" class="s-stroke-coral" stroke-width="4" marker-end="url(#arrow-coral-c07)"/>
  <text x="305" y="243" text-anchor="middle" class="s-muted" font-family="system-ui, sans-serif" font-size="15">produces</text>
  <rect x="400" y="228" width="210" height="66" rx="13" class="s-tile" stroke-width="2"/>
  <text x="505" y="268" text-anchor="middle" class="s-ink" font-family="system-ui, sans-serif" font-size="18" font-weight="700">ACTUAL OUTCOME</text>
</svg>

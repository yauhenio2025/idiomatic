<svg viewBox="0 0 840 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four question particles reveal four different expectations about the answer">
  <text x="420" y="40" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">A QUESTION ALSO SIGNALS ITS EXPECTED ANSWER</text>
  <rect x="60" y="82" width="300" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="210" y="120" text-anchor="middle" font-size="25" font-weight="800" class="s-teal">DENN</text>
  <text x="210" y="151" text-anchor="middle" font-size="17" class="s-ink">connected to this context</text>
  <text x="210" y="177" text-anchor="middle" font-size="15" class="s-muted">tell me more</text>
  <rect x="480" y="82" width="300" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="630" y="120" text-anchor="middle" font-size="25" font-weight="800" class="s-teal">WOHL</text>
  <text x="630" y="151" text-anchor="middle" font-size="17" class="s-ink">answer genuinely uncertain</text>
  <text x="630" y="177" text-anchor="middle" font-size="15" class="s-muted">I wonder</text>
  <rect x="60" y="242" width="300" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="210" y="280" text-anchor="middle" font-size="25" font-weight="800" class="s-coral">ETWA</text>
  <text x="210" y="311" text-anchor="middle" font-size="17" class="s-ink">a feared yes</text>
  <text x="210" y="337" text-anchor="middle" font-size="15" class="s-muted">surely not?</text>
  <rect x="480" y="242" width="300" height="112" rx="16" class="s-tile" stroke-width="3"/>
  <text x="630" y="280" text-anchor="middle" font-size="25" font-weight="800" class="s-coral">ÜBERHAUPT</text>
  <text x="630" y="311" text-anchor="middle" font-size="17" class="s-ink">the premise is doubtful</text>
  <text x="630" y="337" text-anchor="middle" font-size="15" class="s-muted">is this even the case?</text>
  <text x="420" y="224" text-anchor="middle" font-size="18" font-weight="700" class="s-teal">OPEN INFORMATION</text>
  <text x="420" y="400" text-anchor="middle" font-size="18" font-weight="700" class="s-coral">TILTED OR CHALLENGED</text>
</svg>

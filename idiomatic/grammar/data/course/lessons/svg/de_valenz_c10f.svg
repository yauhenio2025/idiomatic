<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A prepositional noun object expands into a prepositional adverb pointing to a clause">
  <text x="320" y="38" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="22" font-weight="700">WHEN THE OBJECT EXPANDS</text>

  <text x="42" y="94" class="s-muted" font-family="sans-serif" font-size="15" font-weight="700">NOUN PHRASE</text>
  <rect x="84" y="116" width="198" height="72" rx="16" class="s-tile"/>
  <text x="183" y="146" text-anchor="middle" class="s-teal" font-family="sans-serif" font-size="18" font-weight="700">PREPOSITION</text>
  <text x="183" y="171" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="17">+ NOUN</text>

  <line x1="282" y1="152" x2="342" y2="152" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <polygon points="352,152 340,145 340,159" class="s-muted"/>

  <text x="388" y="94" class="s-muted" font-family="sans-serif" font-size="15" font-weight="700">CLAUSE</text>
  <rect x="362" y="116" width="214" height="72" rx="16" class="s-tile"/>
  <text x="469" y="146" text-anchor="middle" class="s-coral" font-family="sans-serif" font-size="18" font-weight="700">DA(R) + PREPOSITION</text>
  <text x="469" y="171" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="17">forward pointer</text>

  <line x1="469" y1="188" x2="469" y2="228" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="469,238 462,226 476,226" class="s-coral"/>
  <rect x="296" y="248" width="328" height="74" rx="16" class="s-tile"/>
  <text x="460" y="280" text-anchor="middle" class="s-ink" font-family="sans-serif" font-size="16" font-weight="700">SUBORDINATE OR INFINITIVE CLAUSE</text>
  <text x="460" y="305" text-anchor="middle" class="s-muted" font-family="sans-serif" font-size="15">the clause supplies the content</text>
</svg>

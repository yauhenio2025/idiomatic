<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="German informal clock phrases progress toward the next full hour">
  <text x="420" y="43" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">THE NAMED HOUR IS THE DESTINATION</text>
  <rect x="35" y="94" width="180" height="274" rx="16" class="s-tile" stroke-width="3"/>
  <text x="125" y="140" text-anchor="middle" font-size="31" font-weight="800" class="s-teal">7:00</text>
  <text x="125" y="207" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">sieben</text>
  <text x="125" y="286" text-anchor="middle" font-size="16" class="s-muted">full hour</text>
  <rect x="232" y="94" width="180" height="274" rx="16" class="s-tile" stroke-width="3"/>
  <text x="322" y="140" text-anchor="middle" font-size="31" font-weight="800" class="s-coral">7:15</text>
  <text x="322" y="198" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">Viertel nach</text>
  <text x="322" y="231" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">sieben</text>
  <text x="322" y="286" text-anchor="middle" font-size="16" class="s-muted">past seven</text>
  <rect x="429" y="94" width="180" height="274" rx="16" class="s-tile" stroke-width="3"/>
  <text x="519" y="140" text-anchor="middle" font-size="31" font-weight="800" class="s-sun">7:30</text>
  <text x="519" y="214" text-anchor="middle" font-size="25" font-weight="800" class="s-ink">halb acht</text>
  <text x="519" y="286" text-anchor="middle" font-size="16" class="s-muted">halfway to eight</text>
  <rect x="626" y="94" width="180" height="274" rx="16" class="s-tile" stroke-width="3"/>
  <text x="716" y="140" text-anchor="middle" font-size="31" font-weight="800" class="s-teal">8:00</text>
  <text x="716" y="207" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">acht</text>
  <text x="716" y="286" text-anchor="middle" font-size="16" class="s-muted">destination hour</text>
  <line x1="125" y1="400" x2="706" y2="400" class="s-stroke-line" stroke-width="5" stroke-linecap="round"/>
  <circle cx="125" cy="400" r="9" class="s-teal"/>
  <circle cx="322" cy="400" r="9" class="s-coral"/>
  <circle cx="519" cy="400" r="9" class="s-sun"/>
  <circle cx="716" cy="400" r="9" class="s-teal"/>
  <text x="420" y="445" text-anchor="middle" font-size="18" class="s-muted">informal clock time measures progress toward the next hour</text>
</svg>

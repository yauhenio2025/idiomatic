<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A semantic magnet pulls a verb-selected complement to the right edge immediately before the closing verb">
  <text x="420" y="52" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Selection creates rightward gravity</text>
  <rect x="50" y="130" width="190" height="94" rx="14" class="s-tile" stroke-width="2"/>
  <text x="145" y="170" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">free context</text>
  <text x="145" y="199" text-anchor="middle" font-size="16" class="s-muted">yesterday · in detail</text>
  <line x1="250" y1="177" x2="380" y2="177" class="s-stroke-line" stroke-width="6" stroke-linecap="round"/>
  <polygon points="400,177 378,164 378,190" class="s-teal"/>
  <text x="325" y="148" text-anchor="middle" font-size="16" font-weight="700" class="s-muted">closer to the verb</text>
  <rect x="410" y="118" width="230" height="118" rx="16" class="s-tile" stroke-width="4"/>
  <text x="525" y="163" text-anchor="middle" font-size="19" font-weight="800" class="s-teal">VERB COMPLEMENT</text>
  <text x="525" y="194" text-anchor="middle" font-size="18" class="s-ink">über den Vorschlag</text>
  <text x="525" y="219" text-anchor="middle" font-size="15" class="s-muted">required by the verb</text>
  <line x1="650" y1="177" x2="678" y2="177" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <polygon points="698,177 676,164 676,190" class="s-coral"/>
  <rect x="708" y="130" width="105" height="94" rx="14" class="s-tile" stroke-width="3"/>
  <text x="760" y="170" text-anchor="middle" font-size="18" font-weight="800" class="s-coral">CLOSING</text>
  <text x="760" y="198" text-anchor="middle" font-size="18" font-weight="800" class="s-coral">VERB</text>
  <rect x="155" y="300" width="530" height="63" rx="12" class="s-tile" stroke-width="2"/>
  <text x="420" y="339" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">gestern ausführlich · über den Vorschlag · beraten</text>
  <text x="420" y="405" text-anchor="middle" font-size="18" class="s-muted">prepositional, predicate, genitive and locative complements share this pull</text>
</svg>

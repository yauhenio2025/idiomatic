<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Give-and-tell verbs: recipient dative, thing accusative; den Programm corrected to dem Programm, jemanden corrected to jemandem">
  <text x="420" y="60" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">geben · zeigen · schicken · erklären · sagen</text>
  <rect x="150" y="95" width="240" height="66" rx="12" class="s-sun"/>
  <text x="270" y="130" text-anchor="middle" font-size="24" font-weight="800" class="s-ink">wem? — Dativ</text>
  <text x="270" y="192" text-anchor="middle" font-size="17" class="s-muted">the receiver or addressee</text>
  <rect x="450" y="95" width="240" height="66" rx="12" class="s-coral"/>
  <text x="570" y="130" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">was? — Akkusativ</text>
  <text x="570" y="192" text-anchor="middle" font-size="17" class="s-muted">the thing given or said</text>
  <line x1="100" y1="230" x2="740" y2="230" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="280" text-anchor="middle" font-size="25" class="s-ink"><tspan class="s-dead" text-decoration="line-through">den Programm</tspan>  →  <tspan font-weight="800" class="s-teal">dem Programm</tspan> sagen</text>
  <text x="420" y="336" text-anchor="middle" font-size="25" class="s-ink"><tspan class="s-dead" text-decoration="line-through">jemanden</tspan>  →  <tspan font-weight="800" class="s-teal">jemandem</tspan> einen Gefallen tun</text>
  <text x="420" y="405" text-anchor="middle" font-size="20" class="s-muted">store the rhythm, not the rule — wem, then was</text>
</svg>

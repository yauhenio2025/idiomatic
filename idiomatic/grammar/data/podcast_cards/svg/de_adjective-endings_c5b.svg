<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles: the route, the neuter hole ein neues Ziel, and the bare predicate Der Bericht ist neu">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="160" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">gender → case</text>
  <text x="170" y="192" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">→ determiner</text>
  <text x="430" y="184" text-anchor="middle" font-size="24" font-weight="800" class="s-coral">ein neues Ziel</text>
  <text x="692" y="164" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">Der Bericht</text>
  <text x="692" y="196" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">ist neu.</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">the route, every time</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">the neuter hole</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">predicate — no ending</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">mein ultimatives Ziel — ten times, and mean it</text>
</svg>

<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reactions take the subjunctive even about real facts; creo keeps the indicative, no creo flips, no dudo keeps the indicative">
  <text x="420" y="60" text-anchor="middle" font-size="19" class="s-muted">reacting is a stance — even about a real fact</text>
  <text x="420" y="105" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">me alegra · es importante · temo <tspan font-weight="800" class="s-coral">→ que + subjuntivo</tspan></text>
  <line x1="120" y1="145" x2="720" y2="145" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="185" text-anchor="middle" font-size="19" class="s-muted">commitment — read the stance, not the word «no»</text>
  <text x="330" y="240" text-anchor="end" font-size="27" font-weight="700" class="s-ink">Creo que</text>
  <text x="370" y="240" font-size="27" font-weight="700" class="s-ink">funciona</text>
  <text x="700" y="240" text-anchor="middle" font-size="19" font-weight="700" class="s-muted">asserted</text>
  <text x="330" y="300" text-anchor="end" font-size="27" font-weight="700" class="s-ink">No creo que</text>
  <text x="370" y="300" font-size="27" font-weight="800" class="s-teal">funcione</text>
  <text x="700" y="300" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">withheld</text>
  <text x="330" y="360" text-anchor="end" font-size="27" font-weight="700" class="s-ink">No dudo de que</text>
  <text x="370" y="360" font-size="27" font-weight="700" class="s-ink">funciona</text>
  <text x="700" y="360" text-anchor="middle" font-size="19" font-weight="700" class="s-muted">asserted</text>
  <text x="420" y="416" text-anchor="middle" font-size="20" class="s-muted">the machine reads the whole stance, not a nearby particle</text>
</svg>

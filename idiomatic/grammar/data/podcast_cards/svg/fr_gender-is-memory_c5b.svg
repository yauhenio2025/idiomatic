<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles to take away: the packet cette période, the ending patterns, and the head noun la mise à jour">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="182" text-anchor="middle" font-size="26" font-weight="800" class="s-coral">cette période</text>
  <text x="430" y="164" text-anchor="middle" font-size="23" font-weight="800" class="s-ink">-tion → <tspan class="s-coral">f</tspan></text>
  <text x="430" y="198" text-anchor="middle" font-size="23" font-weight="800" class="s-ink">-ment → <tspan class="s-teal">m</tspan></text>
  <text x="692" y="186" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">la mise à jour</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">the packet, not the naked noun</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">compress, don’t compute</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">the head noun decides</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">cette période — ten times, and mean it</text>
</svg>

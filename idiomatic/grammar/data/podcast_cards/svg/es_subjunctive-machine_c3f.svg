<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reminder: a stance verb opens que and the clause verb flips — answers in the audio">
  <rect x="60" y="130" width="240" height="70" rx="14" class="s-coral"/>
  <text x="180" y="175" text-anchor="middle" font-size="25" font-weight="800" fill="#ffffff">stance verb</text>
  <line x1="315" y1="165" x2="365" y2="165" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="388,165 362,152 362,178" class="s-teal"/>
  <circle cx="440" cy="165" r="42" class="s-sun"/>
  <text x="440" y="176" text-anchor="middle" font-size="27" font-weight="800" class="s-ink">que</text>
  <line x1="495" y1="165" x2="545" y2="165" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="568,165 542,152 542,178" class="s-teal"/>
  <rect x="580" y="130" width="200" height="70" rx="14" class="s-tile" stroke-width="3"/>
  <text x="680" y="177" text-anchor="middle" font-size="34" font-weight="800" class="s-teal">?</text>
  <text x="680" y="240" text-anchor="middle" font-size="17" class="s-muted">the vowel flips here</text>
  <text x="420" y="330" text-anchor="middle" font-size="20" class="s-muted">say the whole sentence out loud — the answers are in the audio</text>
</svg>

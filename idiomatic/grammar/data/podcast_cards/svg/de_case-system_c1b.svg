<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Masculine articles der den dem des all differ; feminine die die der der repeats cells">
  <text x="420" y="60" text-anchor="middle" font-size="19" class="s-muted">masculine — the audible landmark, all four differ</text>
  <rect x="90" y="90" width="150" height="70" rx="12" class="s-teal"/>
  <rect x="263" y="90" width="150" height="70" rx="12" class="s-teal"/>
  <rect x="436" y="90" width="150" height="70" rx="12" class="s-teal"/>
  <rect x="609" y="90" width="150" height="70" rx="12" class="s-teal"/>
  <text x="165" y="136" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">der</text>
  <text x="338" y="136" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">den</text>
  <text x="511" y="136" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">dem</text>
  <text x="684" y="136" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">des</text>
  <text x="165" y="192" text-anchor="middle" font-size="17" class="s-muted">Nominativ</text>
  <text x="338" y="192" text-anchor="middle" font-size="17" class="s-muted">Akkusativ</text>
  <text x="511" y="192" text-anchor="middle" font-size="17" class="s-muted">Dativ</text>
  <text x="684" y="192" text-anchor="middle" font-size="17" class="s-muted">Genitiv</text>
  <text x="420" y="248" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">der Bericht · den Bericht · dem Bericht · des Berichts</text>
  <line x1="120" y1="280" x2="720" y2="280" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="325" text-anchor="middle" font-size="26" font-weight="700" class="s-dead">die · die · der · der</text>
  <text x="420" y="358" text-anchor="middle" font-size="17" class="s-muted">feminine — cells repeat: a form is evidence, not an answer</text>
  <text x="420" y="398" text-anchor="middle" font-size="20" class="s-muted">the job tells you the ending — not the other way round</text>
</svg>

<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Known translator che sa versus sought translator che sappia; open condition se ho, hypothetical se avessi, never a conditional in the if-clause">
  <text x="230" y="60" text-anchor="middle" font-size="19" class="s-muted">identified?</text>
  <circle cx="150" cy="115" r="30" class="s-ink"/>
  <text x="150" y="185" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">che sa</text>
  <circle cx="320" cy="115" r="30" class="s-stroke-teal" stroke-width="4" stroke-dasharray="7 7"/>
  <text x="320" y="185" text-anchor="middle" font-size="23" font-weight="800" class="s-teal">che sappia</text>
  <text x="235" y="230" text-anchor="middle" font-size="17" class="s-muted">known — still sought</text>
  <line x1="470" y1="45" x2="470" y2="240" class="s-stroke-line" stroke-width="2"/>
  <text x="650" y="60" text-anchor="middle" font-size="19" class="s-muted">the teacher's target</text>
  <text x="650" y="115" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">una tecnologia</text>
  <text x="650" y="150" text-anchor="middle" font-size="23" class="s-ink">che <tspan font-weight="800" class="s-teal">riesca</tspan>…</text>
  <text x="650" y="205" text-anchor="middle" font-size="17" class="s-muted">needed, not yet identified</text>
  <line x1="90" y1="265" x2="750" y2="265" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="310" text-anchor="middle" font-size="19" class="s-muted">the guardrail — conditions after «se»</text>
  <text x="420" y="352" text-anchor="middle" font-size="24" class="s-ink">open: <tspan font-weight="700">se ho → vengo</tspan> · hypothetical: <tspan font-weight="700">se avessi → verrei</tspan></text>
  <text x="420" y="402" text-anchor="middle" font-size="25" font-weight="700" class="s-dead" text-decoration="line-through">se verrei</text>
  <text x="420" y="440" text-anchor="middle" font-size="19" class="s-muted">the conditional never enters the if-clause</text>
</svg>

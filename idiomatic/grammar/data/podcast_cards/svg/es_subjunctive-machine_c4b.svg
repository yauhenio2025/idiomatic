<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pending time and unidentified things take the subjunctive; si with present subjunctive never happens">
  <text x="230" y="60" text-anchor="middle" font-size="19" class="s-muted">pending time</text>
  <circle cx="120" cy="110" r="12" class="s-ink"/>
  <line x1="140" y1="110" x2="300" y2="110" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="110" r="20" class="s-stroke-teal" stroke-width="5"/>
  <text x="120" y="152" text-anchor="middle" font-size="16" class="s-muted">now</text>
  <text x="330" y="162" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">cuando termine</text>
  <text x="230" y="205" text-anchor="middle" font-size="18" class="s-ink">habit: <tspan font-weight="700">cuando termino</tspan></text>
  <text x="610" y="60" text-anchor="middle" font-size="19" class="s-muted">identified?</text>
  <circle cx="530" cy="105" r="26" class="s-ink"/>
  <text x="530" y="162" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">que habla</text>
  <circle cx="700" cy="105" r="26" class="s-stroke-teal" stroke-width="4" stroke-dasharray="6 6"/>
  <text x="700" y="162" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">que hable</text>
  <text x="610" y="205" text-anchor="middle" font-size="18" class="s-muted">known — still sought</text>
  <line x1="90" y1="245" x2="750" y2="245" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="290" text-anchor="middle" font-size="19" class="s-muted">the firewall — conditions after «si»</text>
  <text x="420" y="335" text-anchor="middle" font-size="24" class="s-ink">open: <tspan font-weight="700">si tengo</tspan> · remote: <tspan font-weight="700">si tuviera</tspan></text>
  <text x="420" y="390" text-anchor="middle" font-size="26" font-weight="700" class="s-dead" text-decoration="line-through">si + presente de subjuntivo</text>
  <text x="420" y="432" text-anchor="middle" font-size="20" class="s-muted">pending or unidentified → subjuntivo · open «si» stays indicative</text>
</svg>

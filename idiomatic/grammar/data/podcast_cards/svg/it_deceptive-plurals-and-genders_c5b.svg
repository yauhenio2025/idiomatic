<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles: the package il problema i problemi, the talking phrase le città italiane crescono, and meaning-chosen plurals le braccia i bracci">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="160" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">il problema</text>
  <text x="170" y="192" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">i problemi</text>
  <text x="430" y="160" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">le città italiane</text>
  <text x="430" y="192" text-anchor="middle" font-size="20" font-weight="800" class="s-ink">crescono</text>
  <text x="692" y="164" text-anchor="middle" font-size="21" font-weight="800" class="s-coral">le braccia</text>
  <text x="692" y="196" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">i bracci</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">the package</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">the phrase talks</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">meaning picks</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">sulle città intelligenti — ten times, and mean it</text>
</svg>

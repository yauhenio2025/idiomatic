<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The learned -ma family is masculine: il problema, il sistema, il programma; gender radiates to article and adjective">
  <circle cx="140" cy="130" r="62" class="s-teal"/>
  <text x="140" y="122" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">-ma</text>
  <text x="140" y="156" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">= M</text>
  <text x="500" y="95" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">il problema · il sistema · il programma</text>
  <text x="500" y="140" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">il tema · il clima</text>
  <text x="500" y="185" text-anchor="middle" font-size="17" class="s-muted">a learned family wearing a feminine-looking vowel</text>
  <line x1="90" y1="230" x2="750" y2="230" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="285" text-anchor="middle" font-size="30" class="s-ink"><tspan font-weight="800" class="s-teal">un</tspan> problema <tspan font-weight="800" class="s-teal">serio</tspan></text>
  <text x="420" y="330" text-anchor="middle" font-size="18" class="s-muted">gender radiates — repairing only the article leaves the phrase disagreeing</text>
  <text x="420" y="390" text-anchor="middle" font-size="20" class="s-muted">store the core members with their articles</text>
</svg>

<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="l apostrophe hides gender; agreement reveals it — latine feminine, public masculine, cet important masculine">
  <circle cx="150" cy="150" r="60" class="s-dead"/>
  <text x="150" y="172" text-anchor="middle" font-size="52" font-weight="700" class="s-ink">l’</text>
  <text x="150" y="250" text-anchor="middle" font-size="18" class="s-muted">the article hides gender</text>
  <line x1="240" y1="150" x2="300" y2="150" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="322,150 296,137 296,163" class="s-teal"/>
  <text x="540" y="110" text-anchor="middle" font-size="27" class="s-ink">l’Amérique <tspan font-weight="800" class="s-coral">latine</tspan></text>
  <text x="790" y="110" text-anchor="middle" font-size="22" font-weight="700" class="s-coral">f</text>
  <text x="540" y="180" text-anchor="middle" font-size="27" class="s-ink">l’argent <tspan font-weight="800" class="s-teal">public</tspan></text>
  <text x="790" y="180" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">m</text>
  <text x="540" y="250" text-anchor="middle" font-size="27" class="s-ink"><tspan font-weight="800" class="s-teal">cet</tspan> article <tspan font-weight="800" class="s-teal">important</tspan></text>
  <text x="790" y="250" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">m</text>
  <text x="420" y="330" text-anchor="middle" font-size="21" class="s-ink"><tspan font-weight="700">mon</tspan> activité — a sound adjustment: <tspan font-weight="800" class="s-coral">cette activité importante</tspan></text>
  <text x="420" y="392" text-anchor="middle" font-size="19" class="s-muted">agreement makes the hidden gender audible</text>
</svg>

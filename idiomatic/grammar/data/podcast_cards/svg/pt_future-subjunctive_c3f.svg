<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reminder: the gate quando, assim que, logo que takes the future subjunctive; the main clause keeps the ordinary future">
  <rect x="60" y="130" width="250" height="70" rx="14" class="s-teal"/>
  <text x="185" y="163" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">quando · assim que</text>
  <text x="185" y="190" text-anchor="middle" font-size="19" fill="#ffffff">the gate</text>
  <line x1="325" y1="165" x2="375" y2="165" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="398,165 372,152 372,178" class="s-teal"/>
  <rect x="410" y="130" width="150" height="70" rx="14" class="s-tile" stroke-width="3"/>
  <text x="485" y="177" text-anchor="middle" font-size="34" font-weight="800" class="s-teal">?</text>
  <text x="485" y="240" text-anchor="middle" font-size="16" class="s-muted">pending — stripped down</text>
  <line x1="575" y1="165" x2="615" y2="165" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="637,165 611,152 611,178" class="s-teal"/>
  <rect x="650" y="130" width="150" height="70" rx="14" class="s-tile" stroke-width="3"/>
  <text x="725" y="163" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">vou…</text>
  <text x="725" y="190" text-anchor="middle" font-size="16" class="s-muted">main clause</text>
  <text x="420" y="330" text-anchor="middle" font-size="20" class="s-muted">say the whole sentence out loud — the answers are in the audio</text>
</svg>

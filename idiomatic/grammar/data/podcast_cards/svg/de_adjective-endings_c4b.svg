<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strong branch copies the article's sound: guter Rat, klare Sprache, kaltes Wasser; predicate adjectives take no ending">
  <text x="420" y="60" text-anchor="middle" font-size="19" class="s-muted">no determiner — the adjective borrows the missing article's sound</text>
  <text x="180" y="115" text-anchor="middle" font-size="18" class="s-dead">(der)</text>
  <text x="420" y="115" text-anchor="middle" font-size="18" class="s-dead">(die)</text>
  <text x="660" y="115" text-anchor="middle" font-size="18" class="s-dead">(das)</text>
  <text x="180" y="155" text-anchor="middle" font-size="27" class="s-ink">gut<tspan font-weight="800" class="s-coral">er</tspan> Rat</text>
  <text x="420" y="155" text-anchor="middle" font-size="27" class="s-ink">klar<tspan font-weight="800" class="s-coral">e</tspan> Sprache</text>
  <text x="660" y="155" text-anchor="middle" font-size="27" class="s-ink">kalt<tspan font-weight="800" class="s-coral">es</tspan> Wasser</text>
  <text x="180" y="215" text-anchor="middle" font-size="24" class="s-ink">mit gut<tspan font-weight="800" class="s-coral">em</tspan> Grund</text>
  <text x="420" y="215" text-anchor="middle" font-size="24" class="s-ink">mit kalt<tspan font-weight="800" class="s-coral">em</tspan> Wasser</text>
  <text x="660" y="215" text-anchor="middle" font-size="24" class="s-ink">mit neu<tspan font-weight="800" class="s-coral">en</tspan> Ideen</text>
  <text x="420" y="272" text-anchor="middle" font-size="24" class="s-ink">tiefgründig<tspan font-weight="800" class="s-coral">e</tspan> Schlüsse · zwölf weiter<tspan font-weight="800" class="s-coral">e</tspan> Kapitel</text>
  <line x1="120" y1="305" x2="720" y2="305" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="352" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">Der Bericht ist <tspan font-weight="800" class="s-teal">neu</tspan>.</text>
  <text x="420" y="385" text-anchor="middle" font-size="17" class="s-muted">predicate — no ending at all</text>
  <text x="420" y="420" text-anchor="middle" font-size="20" class="s-muted">copy the article's sound — but only inside a noun phrase</text>
</svg>

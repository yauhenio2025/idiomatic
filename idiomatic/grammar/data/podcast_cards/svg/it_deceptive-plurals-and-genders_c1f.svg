<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sulle città intellegente corrected to sulle città intelligenti — the noun never changes, the neighbors carry the number">
  <text x="420" y="90" text-anchor="middle" font-size="30" font-weight="700" class="s-dead" text-decoration="line-through">sulle città intellegente</text>
  <line x1="420" y1="115" x2="420" y2="150" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="420,172 406,147 434,147" class="s-teal"/>
  <text x="420" y="220" text-anchor="middle" font-size="34" class="s-ink"><tspan font-weight="800" class="s-teal">sulle</tspan> città <tspan font-weight="800" class="s-teal">intelligenti</tspan></text>
  <text x="420" y="262" text-anchor="middle" font-size="18" class="s-muted">the noun stands still — contraction and adjective announce feminine plural</text>
  <text x="420" y="360" text-anchor="middle" font-size="21" class="s-muted">when a noun refuses to mark number, the neighbors carry it</text>
</svg>

  <line x1="484" y1="150" x2="556" y2="150" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="580,150 552,136 552,164" class="s-teal"/>
  <rect x="592" y="112" width="220" height="76" rx="14" class="s-teal"/>
  <text x="702" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">congiuntivo</text>
  <line x1="90" y1="280" x2="750" y2="280" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="330" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">è chiaro che · so che <tspan class="s-muted">→ indicativo</tspan></text>
  <text x="420" y="366" text-anchor="middle" font-size="17" class="s-muted">a fact frame asserts — che alone triggers nothing</text>
  <text x="420" y="414" text-anchor="middle" font-size="20" class="s-muted">ask what the frame does to the clause, not which word you said</text>

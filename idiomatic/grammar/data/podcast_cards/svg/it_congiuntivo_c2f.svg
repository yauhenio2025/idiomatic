  <text x="175" y="94" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">voglio</text>
  <text x="175" y="158" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">chiede</text>
  <text x="175" y="222" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">bisogna</text>
  <line x1="300" y1="86" x2="380" y2="140" class="s-stroke-teal" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="300" y1="150" x2="380" y2="150" class="s-stroke-teal" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="300" y1="214" x2="380" y2="160" class="s-stroke-teal" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="430" cy="150" r="42" class="s-sun"/>

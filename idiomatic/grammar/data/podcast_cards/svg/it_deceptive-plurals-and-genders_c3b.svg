<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reverse traps la mano la foto l'auto are feminine; città film crisi never change; the article and verb carry the number">
  <text x="230" y="60" text-anchor="middle" font-size="19" class="s-muted">feminine, despite the vowel</text>
  <text x="230" y="115" text-anchor="middle" font-size="27" font-weight="700" class="s-coral">la mano · le mani</text>
  <text x="230" y="165" text-anchor="middle" font-size="27" font-weight="700" class="s-coral">la foto · l'auto</text>
  <line x1="450" y1="45" x2="450" y2="190" class="s-stroke-line" stroke-width="2"/>
  <text x="640" y="60" text-anchor="middle" font-size="19" class="s-muted">refusers — one form only</text>
  <text x="640" y="115" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">città · film · crisi</text>
  <text x="640" y="165" text-anchor="middle" font-size="20" class="s-muted">stress, loans, look-alike vowels</text>
  <line x1="90" y1="215" x2="750" y2="215" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="270" text-anchor="middle" font-size="28" class="s-ink"><tspan font-weight="800" class="s-teal">La</tspan> città italian<tspan font-weight="800" class="s-teal">a</tspan> cresc<tspan font-weight="800" class="s-teal">e</tspan>.</text>
  <text x="420" y="325" text-anchor="middle" font-size="28" class="s-ink"><tspan font-weight="800" class="s-coral">Le</tspan> città italian<tspan font-weight="800" class="s-coral">e</tspan> cresc<tspan font-weight="800" class="s-coral">ono</tspan>.</text>
  <text x="420" y="375" text-anchor="middle" font-size="18" class="s-muted">the noun stands still — article, adjective and verb move</text>
  <text x="420" y="430" text-anchor="middle" font-size="21" class="s-muted">when the noun won't change, the phrase does the talking</text>
</svg>

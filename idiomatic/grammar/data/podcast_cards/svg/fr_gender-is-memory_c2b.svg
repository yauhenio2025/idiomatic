<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A final E proves nothing: ce mode and la mode, le parti and la partie, le livre and la livre">
  <circle cx="110" cy="110" r="52" class="s-tile" stroke-width="3"/>
  <text x="110" y="124" text-anchor="middle" font-size="40" font-weight="800" class="s-ink">-e</text>
  <line x1="72" y1="148" x2="148" y2="72" class="s-stroke-coral" stroke-width="6" stroke-linecap="round"/>
  <text x="110" y="192" text-anchor="middle" font-size="17" class="s-muted">proves nothing</text>
  <text x="400" y="70" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">masculine</text>
  <text x="660" y="70" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">feminine</text>
  <line x1="530" y1="90" x2="530" y2="330" class="s-stroke-line" stroke-width="2"/>
  <text x="400" y="128" text-anchor="middle" font-size="27" font-weight="700" class="s-teal">ce mode</text>
  <text x="400" y="156" text-anchor="middle" font-size="16" class="s-muted">method</text>
  <text x="660" y="128" text-anchor="middle" font-size="27" font-weight="700" class="s-coral">la mode</text>
  <text x="660" y="156" text-anchor="middle" font-size="16" class="s-muted">fashion</text>
  <text x="400" y="218" text-anchor="middle" font-size="27" font-weight="700" class="s-teal">le parti</text>
  <text x="400" y="246" text-anchor="middle" font-size="16" class="s-muted">party</text>
  <text x="660" y="218" text-anchor="middle" font-size="27" font-weight="700" class="s-coral">la partie</text>
  <text x="660" y="246" text-anchor="middle" font-size="16" class="s-muted">part</text>
  <text x="400" y="308" text-anchor="middle" font-size="27" font-weight="700" class="s-teal">le livre</text>
  <text x="400" y="336" text-anchor="middle" font-size="16" class="s-muted">book</text>
  <text x="660" y="308" text-anchor="middle" font-size="27" font-weight="700" class="s-coral">la livre</text>
  <text x="660" y="336" text-anchor="middle" font-size="16" class="s-muted">pound</text>
  <text x="420" y="412" text-anchor="middle" font-size="20" class="s-muted">same sound, same final -e — different words, different packets</text>
</svg>

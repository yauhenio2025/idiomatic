<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ce période, filed about 300 times as wrong gender, corrected to cette période">
  <circle cx="100" cy="92" r="52" class="s-coral"/>
  <text x="100" y="103" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">≈300</text>
  <text x="100" y="172" text-anchor="middle" font-size="17" class="s-muted">wrong-gender rows</text>
  <text x="100" y="194" text-anchor="middle" font-size="17" class="s-muted">in your record</text>
  <polygon points="380,60 550,340 210,340" class="s-stroke-coral" stroke-width="6" stroke-linejoin="round"/>
  <text x="380" y="312" text-anchor="middle" font-size="30" font-weight="700" class="s-dead" text-decoration="line-through">ce période</text>
  <line x1="480" y1="200" x2="565" y2="200" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="590,200 562,186 562,214" class="s-teal"/>
  <rect x="600" y="162" width="225" height="74" rx="14" class="s-teal"/>
  <text x="712" y="210" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">cette période</text>
  <text x="420" y="412" text-anchor="middle" font-size="21" class="s-muted">gender is memory, not logic — one habit, not 300 failures</text>
</svg>

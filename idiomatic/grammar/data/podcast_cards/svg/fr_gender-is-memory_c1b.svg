  <text x="250" y="248" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">un</text>
  <text x="250" y="312" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">mon</text>
  <rect x="490" y="84" width="200" height="54" rx="12" class="s-coral"/>
  <rect x="490" y="148" width="200" height="54" rx="12" class="s-coral"/>

<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Endings tion, sion, té usually feminine and ment usually masculine; in la mise à jour and la maison d'édition the head noun decides">
  <text x="215" y="70" text-anchor="middle" font-size="19" class="s-muted">endings — usually</text>
  <text x="215" y="130" text-anchor="middle" font-size="27" font-weight="800" class="s-coral">-tion · -sion · -té</text>
  <text x="215" y="160" text-anchor="middle" font-size="17" class="s-muted">feminine</text>
  <text x="215" y="218" text-anchor="middle" font-size="27" font-weight="800" class="s-teal">-ment</text>
  <text x="215" y="248" text-anchor="middle" font-size="17" class="s-muted">masculine</text>
  <text x="215" y="306" text-anchor="middle" font-size="27" font-weight="700" class="s-dead" text-decoration="line-through">final -e</text>
  <text x="215" y="336" text-anchor="middle" font-size="17" class="s-muted">proves nothing</text>
  <line x1="430" y1="55" x2="430" y2="345" class="s-stroke-line" stroke-width="2"/>
  <text x="635" y="70" text-anchor="middle" font-size="19" class="s-muted">multiword — follow the head noun</text>
  <text x="635" y="145" text-anchor="middle" font-size="27" class="s-ink"><tspan font-weight="800" class="s-coral">la mise</tspan> à jour</text>
  <text x="635" y="220" text-anchor="middle" font-size="27" class="s-ink"><tspan font-weight="800" class="s-coral">la maison</tspan> d’édition</text>
  <text x="635" y="285" text-anchor="middle" font-size="17" class="s-muted">the noun after «de» gets no vote</text>
  <text x="420" y="392" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">pattern proposes — the packet decides</text>
</svg>

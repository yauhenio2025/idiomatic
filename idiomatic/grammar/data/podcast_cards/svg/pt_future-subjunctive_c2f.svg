<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pending, not unlikely: quando o sol nascer is certain and still takes the gate; a plain prediction and a question take none">
  <circle cx="150" cy="120" r="48" class="s-sun"/>
  <line x1="150" y1="45" x2="150" y2="60" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="75" x2="102" y2="87" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="75" x2="198" y2="87" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <text x="480" y="105" text-anchor="middle" font-size="27" class="s-ink">Quando o sol <tspan font-weight="800" class="s-teal">nascer</tspan>…</text>
  <text x="480" y="150" text-anchor="middle" font-size="18" class="s-muted">completely certain — and still pending</text>
  <line x1="90" y1="215" x2="750" y2="215" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="258" text-anchor="middle" font-size="19" class="s-muted">future meaning alone opens no gate</text>
  <text x="250" y="310" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">Amanhã vou voltar.</text>
  <text x="250" y="345" text-anchor="middle" font-size="17" class="s-muted">plain prediction</text>
  <text x="590" y="310" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">Quando você vai voltar?</text>
  <text x="590" y="345" text-anchor="middle" font-size="17" class="s-muted">direct question</text>
  <text x="420" y="410" text-anchor="middle" font-size="21" class="s-muted">the gate marks pending status — not probability</text>
</svg>

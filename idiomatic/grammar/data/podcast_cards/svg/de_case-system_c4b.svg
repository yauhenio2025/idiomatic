<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prepositions: mit nach aus zu von bei take dative; durch für gegen ohne um accusative; während trotz wegen genitive; in der Türkei location versus in die Türkei goal">
  <text x="165" y="60" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">+ Dativ</text>
  <text x="165" y="102" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">mit · nach · aus</text>
  <text x="165" y="136" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">zu · von · bei</text>
  <line x1="300" y1="45" x2="300" y2="160" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="60" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">+ Akkusativ</text>
  <text x="420" y="102" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">durch · für · gegen</text>
  <text x="420" y="136" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">ohne · um</text>
  <line x1="540" y1="45" x2="540" y2="160" class="s-stroke-line" stroke-width="2"/>
  <text x="675" y="60" text-anchor="middle" font-size="19" font-weight="700" class="s-muted">+ Genitiv (formal)</text>
  <text x="675" y="102" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">während · trotz</text>
  <text x="675" y="136" text-anchor="middle" font-size="23" font-weight="700" class="s-ink">wegen</text>
  <line x1="90" y1="195" x2="750" y2="195" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="235" text-anchor="middle" font-size="19" class="s-muted">two-way prepositions — where you are vs where it's heading</text>
  <circle cx="230" cy="300" r="46" class="s-stroke-teal" stroke-width="5"/>
  <circle cx="230" cy="300" r="10" class="s-teal"/>
  <text x="230" y="382" text-anchor="middle" font-size="23" font-weight="800" class="s-teal">in der Türkei</text>
  <line x1="500" y1="300" x2="580" y2="300" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="602,300 576,287 576,313" class="s-coral"/>
  <circle cx="640" cy="300" r="46" class="s-stroke-coral" stroke-width="5"/>
  <text x="570" y="382" text-anchor="middle" font-size="23" font-weight="800" class="s-coral">in die Türkei</text>
  <text x="420" y="438" text-anchor="middle" font-size="20" class="s-muted">location → Dativ · goal → Akkusativ — the preposition settles it first</text>
</svg>

<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One actor compresses to the infinitive publicar; a new actor opens que publiques">
  <line x1="420" y1="50" x2="420" y2="330" class="s-stroke-line" stroke-width="2"/>
  <text x="210" y="48" text-anchor="middle" font-size="19" class="s-muted">one actor</text>
  <circle cx="180" cy="90" r="26" class="s-muted"/>
  <rect x="152" y="122" width="56" height="44" rx="14" class="s-muted"/>
  <text x="210" y="230" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">Quiero <tspan font-weight="800" class="s-teal">publicar</tspan></text>
  <text x="210" y="290" text-anchor="middle" font-size="18" class="s-muted">compressed — infinitive, no machine</text>
  <text x="610" y="48" text-anchor="middle" font-size="19" class="s-muted">new actor</text>
  <circle cx="560" cy="90" r="26" class="s-muted"/>
  <rect x="532" y="122" width="56" height="44" rx="14" class="s-muted"/>
  <circle cx="660" cy="90" r="26" class="s-coral"/>
  <rect x="632" y="122" width="56" height="44" rx="14" class="s-coral"/>
  <text x="630" y="230" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">Quiero <tspan font-weight="800" class="s-coral">que publiques</tspan></text>
  <text x="630" y="290" text-anchor="middle" font-size="18" class="s-muted">the full machine appears</text>
  <text x="420" y="382" text-anchor="middle" font-size="21" class="s-muted">second clause + its own subject + a stance → subjunctive</text>
</svg>

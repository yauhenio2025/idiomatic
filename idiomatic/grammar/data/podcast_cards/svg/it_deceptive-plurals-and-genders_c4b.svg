<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gender changers: l'uovo fresco becomes le uova fresche; human arms le braccia versus mechanical arms i bracci; le dita, le ginocchia, le ossa">
  <text x="230" y="80" text-anchor="middle" font-size="29" font-weight="700" class="s-teal">l'uovo fresco</text>
  <text x="230" y="115" text-anchor="middle" font-size="17" class="s-muted">masculine singular</text>
  <line x1="380" y1="72" x2="440" y2="72" class="s-stroke-coral" stroke-width="5" stroke-linecap="round"/>
  <polygon points="464,72 436,58 436,86" class="s-coral"/>
  <text x="620" y="80" text-anchor="middle" font-size="29" font-weight="800" class="s-coral">le uova fresche</text>
  <text x="620" y="115" text-anchor="middle" font-size="17" class="s-muted">feminine plural — everything changes</text>
  <text x="420" y="165" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">il paio → le paia</text>
  <line x1="90" y1="200" x2="750" y2="200" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="240" text-anchor="middle" font-size="19" class="s-muted">body parts — meaning selects the plural</text>
  <text x="230" y="295" text-anchor="middle" font-size="27" font-weight="800" class="s-coral">le braccia</text>
  <text x="230" y="330" text-anchor="middle" font-size="17" class="s-muted">a person's arms — a natural set</text>
  <text x="620" y="295" text-anchor="middle" font-size="27" font-weight="800" class="s-teal">i bracci</text>
  <text x="620" y="330" text-anchor="middle" font-size="17" class="s-muted">a crane's arms — separate items</text>
  <text x="420" y="390" text-anchor="middle" font-size="23" font-weight="700" class="s-coral">le dita · le ginocchia · le ossa</text>
  <text x="420" y="435" text-anchor="middle" font-size="20" class="s-muted">a closed, high-value set — learn each pair as a contrast</text>
</svg>

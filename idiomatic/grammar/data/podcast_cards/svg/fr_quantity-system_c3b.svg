<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Negation takes bare de; a plural adjective before the noun softens des to de">
  <line x1="430" y1="45" x2="430" y2="330" class="s-stroke-line" stroke-width="2"/>
  <text x="220" y="70" text-anchor="middle" font-size="19" class="s-muted">negative sentence</text>
  <rect x="115" y="105" width="130" height="62" rx="12" class="s-tile" stroke-width="2"/>
  <text x="180" y="147" text-anchor="middle" font-size="32" font-weight="700" class="s-ink">pas</text>
  <line x1="258" y1="136" x2="300" y2="136" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="322,136 296,123 296,149" class="s-teal"/>
  <rect x="330" y="104" width="96" height="64" rx="12" class="s-teal"/>
  <text x="378" y="147" text-anchor="middle" font-size="32" font-weight="800" fill="#ffffff">de</text>
  <text x="220" y="240" text-anchor="middle" font-size="27" font-weight="700" class="s-dead" text-decoration="line-through">des · du</text>
  <text x="220" y="310" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">pas de questions</text>
  <text x="635" y="70" text-anchor="middle" font-size="19" class="s-muted">plural adjective first — careful register</text>
  <text x="635" y="140" text-anchor="middle" font-size="26" font-weight="700" class="s-dead" text-decoration="line-through">des grandes villes</text>
  <line x1="635" y1="165" x2="635" y2="200" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="635,222 622,197 648,197" class="s-teal"/>
  <text x="635" y="262" text-anchor="middle" font-size="29" font-weight="700" class="s-ink"><tspan font-weight="800" class="s-teal">de</tspan> grandes villes</text>
  <text x="635" y="310" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">de bonnes idées</text>
  <text x="420" y="374" text-anchor="middle" font-size="20" class="s-muted">the same reflex, two more places</text>
</svg>

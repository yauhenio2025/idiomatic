<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Open condition se eu viajar takes the future subjunctive; remote se eu viajasse takes imperfect plus conditional; se can also mean whether">
  <text x="230" y="60" text-anchor="middle" font-size="19" class="s-muted">open future condition</text>
  <text x="230" y="115" text-anchor="middle" font-size="26" class="s-ink">Se eu <tspan font-weight="800" class="s-teal">viajar</tspan>…</text>
  <text x="230" y="160" text-anchor="middle" font-size="22" class="s-ink">…vou comprar a passagem</text>
  <line x1="440" y1="45" x2="440" y2="185" class="s-stroke-line" stroke-width="2"/>
  <text x="640" y="60" text-anchor="middle" font-size="19" class="s-muted">remote hypothesis</text>
  <text x="640" y="115" text-anchor="middle" font-size="26" class="s-ink">Se eu <tspan font-weight="800" class="s-coral">viajasse</tspan>…</text>
  <text x="640" y="160" text-anchor="middle" font-size="22" class="s-ink">…<tspan font-weight="700" class="s-coral">ficaria</tspan> mais tempo</text>
  <line x1="90" y1="210" x2="750" y2="210" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="255" text-anchor="middle" font-size="19" class="s-muted">the same little word can mean “whether” — no gate</text>
  <text x="420" y="308" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">Não sei <tspan class="s-dead">se ele vem</tspan> amanhã.</text>
  <text x="420" y="362" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">Se ele <tspan font-weight="800" class="s-teal">vier</tspan> amanhã, vamos conversar.</text>
  <text x="420" y="425" text-anchor="middle" font-size="21" class="s-muted">same spelling, different job — read the sentence, not the word</text>
</svg>

<svg viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reminder: ein plus neuter takes -es, a speaking possessive lets the adjective go quiet, no determiner makes it lead">
  <text x="490" y="88" text-anchor="end" font-size="25" class="s-ink">ein + neuter — the hole</text>
  <line x1="510" y1="80" x2="552" y2="80" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="574,80 548,67 548,93" class="s-teal"/>
  <text x="590" y="90" font-size="28" font-weight="800" class="s-coral">-es</text>
  <text x="490" y="163" text-anchor="end" font-size="25" class="s-ink">the determiner speaks</text>
  <line x1="510" y1="155" x2="552" y2="155" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="574,155 548,142 548,168" class="s-teal"/>
  <text x="590" y="165" font-size="28" font-weight="800" class="s-teal">quiet -en</text>
  <text x="490" y="238" text-anchor="end" font-size="25" class="s-ink">no determiner</text>
  <line x1="510" y1="230" x2="552" y2="230" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="574,230 548,217 548,243" class="s-teal"/>
  <text x="590" y="240" font-size="28" font-weight="800" class="s-coral">adjective leads</text>
  <text x="420" y="305" text-anchor="middle" font-size="20" class="s-muted">mixed and strong — say it, then check with the audio</text>
</svg>

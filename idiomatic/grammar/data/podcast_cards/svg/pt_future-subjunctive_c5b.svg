<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles: no going-to inside the gate, the stem machine tiveram to tiver, and the three strong gates">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="164" text-anchor="middle" font-size="22" font-weight="800" class="s-teal">quando eu</text>
  <text x="170" y="196" text-anchor="middle" font-size="22" font-weight="800" class="s-teal">voltar</text>
  <text x="430" y="164" text-anchor="middle" font-size="21" font-weight="800" class="s-ink">tiveram → <tspan class="s-teal">tiver</tspan></text>
  <text x="430" y="196" text-anchor="middle" font-size="21" font-weight="800" class="s-ink">foram → <tspan class="s-teal">for</tspan></text>
  <text x="692" y="164" text-anchor="middle" font-size="20" font-weight="800" class="s-coral">time · se · quem</text>
  <text x="692" y="196" text-anchor="middle" font-size="17" class="s-muted">antes que → presente</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">nothing extra in the gate</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">the stem machine</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">the three strong gates</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">Quando eu voltar, vou ajustar os cartões — ten times, and mean it</text>
</svg>

<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles: stance packaging, launch pads Non credo che and Voglio che, and the anchors sia abbia possa venga">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="162" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">So che <tspan class="s-muted">funziona</tspan></text>
  <text x="170" y="196" text-anchor="middle" font-size="20" font-weight="700" class="s-ink">Penso che <tspan font-weight="800" class="s-teal">funzioni</tspan></text>
  <text x="430" y="162" text-anchor="middle" font-size="21" font-weight="800" class="s-coral">Non credo che…</text>
  <text x="430" y="196" text-anchor="middle" font-size="21" font-weight="800" class="s-coral">Voglio che…</text>
  <text x="692" y="164" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">sia · abbia</text>
  <text x="692" y="196" text-anchor="middle" font-size="21" font-weight="800" class="s-teal">possa · venga</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">stance, not difficulty</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">the launch pads</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">the sound anchors</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">Penso che sia una buona idea — ten times, and mean it</text>
</svg>

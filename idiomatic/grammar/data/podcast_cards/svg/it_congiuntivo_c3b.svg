<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Penso che takes sia; Secondo me asserts with è; Sono contento che tu sia venuto — presentation, not reality">
  <text x="330" y="90" text-anchor="end" font-size="27" font-weight="700" class="s-ink">Penso che</text>
  <text x="370" y="90" font-size="27" font-weight="800" class="s-teal">sia</text>
  <text x="700" y="90" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">opinion frame</text>
  <text x="330" y="160" text-anchor="end" font-size="27" font-weight="700" class="s-ink">Secondo me,</text>
  <text x="370" y="160" font-size="27" font-weight="700" class="s-ink">è</text>
  <text x="700" y="160" text-anchor="middle" font-size="19" font-weight="700" class="s-muted">direct assertion</text>
  <text x="330" y="230" text-anchor="end" font-size="27" font-weight="700" class="s-ink">Dubito che</text>
  <text x="370" y="230" font-size="27" font-weight="800" class="s-teal">basti</text>
  <text x="700" y="230" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">doubt</text>
  <line x1="100" y1="270" x2="740" y2="270" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="322" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">Sono contento che tu <tspan font-weight="800" class="s-teal">sia venuto</tspan></text>
  <text x="420" y="358" text-anchor="middle" font-size="18" class="s-muted">the person is right there — the mood marks your reaction</text>
  <text x="420" y="410" text-anchor="middle" font-size="21" class="s-muted">reality is not the dividing line — presentation is</text>
</svg>

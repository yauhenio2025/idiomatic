<svg viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reminder: the contraction still contains the article — del masculine singular, dei masculine plural, delle feminine plural">
  <text x="420" y="80" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">sulle = su + <tspan font-weight="800" class="s-coral">le</tspan></text>
  <text x="420" y="118" text-anchor="middle" font-size="18" class="s-muted">the article is still in there — and still talking</text>
  <text x="230" y="190" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">del <tspan class="s-muted" font-size="18">M sing</tspan></text>
  <text x="430" y="190" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">dei <tspan class="s-muted" font-size="18">M pl</tspan></text>
  <text x="630" y="190" text-anchor="middle" font-size="26" font-weight="700" class="s-ink">delle <tspan class="s-muted" font-size="18">F pl</tspan></text>
  <text x="420" y="250" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">hear the signal early — keep agreeing with it</text>
  <text x="420" y="305" text-anchor="middle" font-size="20" class="s-muted">invariant nouns — say it, then check with the audio</text>
</svg>

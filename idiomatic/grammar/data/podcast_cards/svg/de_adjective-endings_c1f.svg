<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Der härtester Konkurrent corrected to der härteste Konkurrent; the ending is the last step of a decision route">
  <text x="420" y="90" text-anchor="middle" font-size="32" font-weight="700" class="s-dead" text-decoration="line-through">der härtester Konkurrent</text>
  <line x1="420" y1="115" x2="420" y2="150" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="420,172 406,147 434,147" class="s-teal"/>
  <text x="420" y="215" text-anchor="middle" font-size="34" font-weight="800" class="s-teal">der härteste Konkurrent</text>
  <text x="420" y="255" text-anchor="middle" font-size="18" class="s-muted">the article already did the loud work — the adjective stays quiet</text>
  <rect x="55" y="300" width="130" height="52" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="215" y="300" width="110" height="52" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="355" y="300" width="160" height="52" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="545" y="300" width="130" height="52" rx="12" class="s-teal"/>
  <rect x="705" y="300" width="90" height="52" rx="12" class="s-tile" stroke-width="2"/>
  <text x="120" y="333" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">gender·number</text>
  <text x="270" y="333" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">case</text>
  <text x="435" y="333" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">determiner</text>
  <text x="610" y="333" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">adjective</text>
  <text x="750" y="333" text-anchor="middle" font-size="18" font-weight="700" class="s-ink">noun</text>
  <text x="420" y="405" text-anchor="middle" font-size="20" class="s-muted">six fossils, one route — the ending is the last decision, not the first</text>
</svg>

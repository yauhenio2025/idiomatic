<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The mood switch is a vowel: publicas to publiques, funciona to funcione, viene to venga; irregular core sea esté vaya haya sepa dé">
  <text x="230" y="70" text-anchor="middle" font-size="19" class="s-muted">A-family → e</text>
  <text x="620" y="70" text-anchor="middle" font-size="19" class="s-muted">E-family → a</text>
  <text x="180" y="130" text-anchor="end" font-size="28" font-weight="700" class="s-ink">publicas</text>
  <line x1="200" y1="122" x2="240" y2="122" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="262,122 236,109 236,135" class="s-teal"/>
  <text x="278" y="130" font-size="28" font-weight="800" class="s-teal">publiques</text>
  <text x="180" y="200" text-anchor="end" font-size="28" font-weight="700" class="s-ink">funciona</text>
  <line x1="200" y1="192" x2="240" y2="192" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="262,192 236,179 236,205" class="s-teal"/>
  <text x="278" y="200" font-size="28" font-weight="800" class="s-teal">funcione</text>
  <text x="600" y="130" text-anchor="end" font-size="28" font-weight="700" class="s-ink">viene</text>
  <line x1="620" y1="122" x2="660" y2="122" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="682,122 656,109 656,135" class="s-coral"/>
  <text x="698" y="130" font-size="28" font-weight="800" class="s-coral">venga</text>
  <text x="600" y="200" text-anchor="end" font-size="28" font-weight="700" class="s-ink">tiene</text>
  <line x1="620" y1="192" x2="660" y2="192" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="682,192 656,179 656,205" class="s-coral"/>
  <text x="698" y="200" font-size="28" font-weight="800" class="s-coral">tenga</text>
  <line x1="120" y1="250" x2="720" y2="250" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="292" text-anchor="middle" font-size="19" class="s-muted">the irregular core — six small words, pure sound</text>
  <text x="420" y="340" text-anchor="middle" font-size="30" font-weight="800" class="s-teal">sea · esté · vaya · haya · sepa · dé</text>
  <text x="420" y="398" text-anchor="middle" font-size="20" class="s-muted">the switch is a vowel — hear it flip</text>
</svg>

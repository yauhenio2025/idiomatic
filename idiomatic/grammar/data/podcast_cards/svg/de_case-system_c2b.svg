<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dative verbs helfen danken gehören gefallen widersprechen; but versorgen takes jemanden accusative">
  <text x="250" y="60" text-anchor="middle" font-size="19" class="s-muted">these verbs hand their object the Dativ</text>
  <text x="250" y="110" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">helfen · danken · folgen</text>
  <text x="250" y="148" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">gehören · gefallen</text>
  <text x="250" y="186" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">entsprechen · widersprechen</text>
  <line x1="475" y1="140" x2="540" y2="140" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="564,140 536,126 536,154" class="s-teal"/>
  <rect x="580" y="104" width="180" height="72" rx="14" class="s-teal"/>
  <text x="670" y="150" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">+ Dativ</text>
  <line x1="90" y1="235" x2="750" y2="235" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="278" text-anchor="middle" font-size="19" class="s-muted">but the verb can override the feeling — the supply frame</text>
  <text x="420" y="325" text-anchor="middle" font-size="29" font-weight="700" class="s-ink"><tspan font-weight="800" class="s-coral">jemanden</tspan> mit etwas versorgen</text>
  <text x="420" y="362" text-anchor="middle" font-size="18" class="s-muted">the supplied person is <tspan font-weight="700" class="s-coral">Akkusativ</tspan> — not a dative recipient</text>
  <text x="420" y="412" text-anchor="middle" font-size="20" class="s-muted">roles propose — the verb confirms or overrides</text>
</svg>

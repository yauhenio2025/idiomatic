<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The stem machine: tiveram minus am gives tiver; fizeram fizer; disseram disser; foram for">
  <text x="420" y="60" text-anchor="middle" font-size="19" class="s-muted">completed-past plural, minus the last two letters</text>
  <text x="330" y="125" text-anchor="end" font-size="29" class="s-ink">tiver<tspan class="s-dead" text-decoration="line-through">am</tspan></text>
  <line x1="360" y1="117" x2="410" y2="117" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="432,117 406,104 406,130" class="s-teal"/>
  <text x="455" y="125" font-size="29" font-weight="800" class="s-teal">tiver</text>
  <text x="330" y="185" text-anchor="end" font-size="29" class="s-ink">fizer<tspan class="s-dead" text-decoration="line-through">am</tspan></text>
  <line x1="360" y1="177" x2="410" y2="177" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="432,177 406,164 406,190" class="s-teal"/>
  <text x="455" y="185" font-size="29" font-weight="800" class="s-teal">fizer</text>
  <text x="330" y="245" text-anchor="end" font-size="29" class="s-ink">disser<tspan class="s-dead" text-decoration="line-through">am</tspan></text>
  <line x1="360" y1="237" x2="410" y2="237" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="432,237 406,224 406,250" class="s-teal"/>
  <text x="455" y="245" font-size="29" font-weight="800" class="s-teal">disser</text>
  <text x="330" y="305" text-anchor="end" font-size="29" class="s-ink">for<tspan class="s-dead" text-decoration="line-through">am</tspan></text>
  <line x1="360" y1="297" x2="410" y2="297" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="432,297 406,284 406,310" class="s-teal"/>
  <text x="455" y="305" font-size="29" font-weight="800" class="s-teal">for</text>
  <text x="420" y="365" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">fizer · fizeres · fizer · fizermos · fizerem</text>
  <text x="420" y="405" text-anchor="middle" font-size="20" class="s-muted">the irregulars are the diagnostics — own them as sound</text>
</svg>

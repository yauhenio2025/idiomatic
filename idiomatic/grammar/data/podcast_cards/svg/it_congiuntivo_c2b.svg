<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One subject compresses to voglio partire; a new subject opens voglio che tu parta">
  <line x1="420" y1="50" x2="420" y2="330" class="s-stroke-line" stroke-width="2"/>
  <text x="210" y="48" text-anchor="middle" font-size="19" class="s-muted">one subject</text>
  <circle cx="180" cy="90" r="26" class="s-muted"/>
  <rect x="152" y="122" width="56" height="44" rx="14" class="s-muted"/>
  <text x="210" y="230" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">Voglio <tspan font-weight="800" class="s-teal">partire</tspan></text>
  <text x="210" y="290" text-anchor="middle" font-size="18" class="s-muted">infinitive — no mood decision at all</text>
  <text x="610" y="48" text-anchor="middle" font-size="19" class="s-muted">new subject</text>
  <circle cx="560" cy="90" r="26" class="s-muted"/>
  <rect x="532" y="122" width="56" height="44" rx="14" class="s-muted"/>
  <circle cx="660" cy="90" r="26" class="s-coral"/>
  <rect x="632" y="122" width="56" height="44" rx="14" class="s-coral"/>
  <text x="630" y="230" text-anchor="middle" font-size="29" font-weight="700" class="s-ink">Voglio <tspan font-weight="800" class="s-coral">che tu parta</tspan></text>
  <text x="630" y="290" text-anchor="middle" font-size="18" class="s-muted">the full clause appears</text>
  <text x="420" y="382" text-anchor="middle" font-size="21" class="s-muted">don't erase the other person just to escape the mood</text>
</svg>

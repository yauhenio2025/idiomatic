<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles to take away: de, pas de, la plupart des">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="182" text-anchor="middle" font-size="36" font-weight="800" class="s-teal">de</text>
  <text x="430" y="184" text-anchor="middle" font-size="31" font-weight="800" class="s-teal">pas de</text>
  <text x="692" y="186" text-anchor="middle" font-size="25" font-weight="800" class="s-coral">la plupart des</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">the sound: “duh”</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">negation, same reflex</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">the impostor — a noun</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">beaucoup de choses — ten times, and mean it</text>
</svg>

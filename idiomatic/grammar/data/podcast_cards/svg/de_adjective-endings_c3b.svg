<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weak branch: quiet -e in five cells, longer -en everywhere else">
  <rect x="80" y="70" width="300" height="90" rx="16" class="s-teal"/>
  <text x="230" y="112" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">-e</text>
  <text x="230" y="145" text-anchor="middle" font-size="17" fill="#ffffff">five quiet cells</text>
  <text x="230" y="205" text-anchor="middle" font-size="21" class="s-ink">der neu<tspan font-weight="800" class="s-teal">e</tspan> Bericht · die neu<tspan font-weight="800" class="s-teal">e</tspan> Studie</text>
  <text x="230" y="240" text-anchor="middle" font-size="21" class="s-ink">das neu<tspan font-weight="800" class="s-teal">e</tspan> Programm</text>
  <text x="230" y="278" text-anchor="middle" font-size="16" class="s-muted">nom. singular ×3 + fem./neut. accusative</text>
  <rect x="460" y="70" width="300" height="90" rx="16" class="s-coral"/>
  <text x="610" y="112" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff">-en</text>
  <text x="610" y="145" text-anchor="middle" font-size="17" fill="#ffffff">everywhere else</text>
  <text x="610" y="205" text-anchor="middle" font-size="21" class="s-ink">den neu<tspan font-weight="800" class="s-coral">en</tspan> Bericht</text>
  <text x="610" y="240" text-anchor="middle" font-size="21" class="s-ink">mit der neu<tspan font-weight="800" class="s-coral">en</tspan> Studie</text>
  <text x="610" y="275" text-anchor="middle" font-size="21" class="s-ink">die neu<tspan font-weight="800" class="s-coral">en</tspan> Berichte</text>
  <text x="610" y="310" text-anchor="middle" font-size="16" class="s-muted">masc. acc. · all datives/genitives · all plurals</text>
  <text x="420" y="400" text-anchor="middle" font-size="21" class="s-muted">after a definite determiner the adjective has exactly two choices</text>
</svg>

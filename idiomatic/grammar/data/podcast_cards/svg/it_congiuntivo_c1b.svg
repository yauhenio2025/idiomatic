<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The mood switch is a vowel: funziona to funzioni, crede to creda, viene to venga; anchors sia abbia vada faccia possa voglia debba sappia venga dia">
  <text x="230" y="70" text-anchor="middle" font-size="19" class="s-muted">-are family → i</text>
  <text x="620" y="70" text-anchor="middle" font-size="19" class="s-muted">-ere / -ire → a</text>
  <text x="185" y="135" text-anchor="end" font-size="28" font-weight="700" class="s-ink">funziona</text>
  <line x1="205" y1="127" x2="245" y2="127" class="s-stroke-teal" stroke-width="4" stroke-linecap="round"/>
  <polygon points="267,127 241,114 241,140" class="s-teal"/>
  <text x="283" y="135" font-size="28" font-weight="800" class="s-teal">funzioni</text>
  <text x="600" y="135" text-anchor="end" font-size="28" font-weight="700" class="s-ink">crede</text>
  <line x1="620" y1="127" x2="660" y2="127" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="682,127 656,114 656,140" class="s-coral"/>
  <text x="698" y="135" font-size="28" font-weight="800" class="s-coral">creda</text>
  <text x="600" y="205" text-anchor="end" font-size="28" font-weight="700" class="s-ink">viene</text>
  <line x1="620" y1="197" x2="660" y2="197" class="s-stroke-coral" stroke-width="4" stroke-linecap="round"/>
  <polygon points="682,197 656,184 656,210" class="s-coral"/>
  <text x="698" y="205" font-size="28" font-weight="800" class="s-coral">venga</text>
  <line x1="120" y1="250" x2="720" y2="250" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="292" text-anchor="middle" font-size="19" class="s-muted">the anchors — retrieve them whole, never derive under pressure</text>
  <text x="420" y="340" text-anchor="middle" font-size="27" font-weight="800" class="s-teal">sia · abbia · vada · faccia · possa</text>
  <text x="420" y="378" text-anchor="middle" font-size="27" font-weight="800" class="s-teal">voglia · debba · sappia · venga · dia</text>
  <text x="420" y="415" text-anchor="middle" font-size="20" class="s-muted">the switch is a vowel — hear it flip</text>
</svg>

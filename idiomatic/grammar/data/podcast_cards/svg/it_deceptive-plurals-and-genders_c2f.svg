<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Store each noun as a package: singular, plural, agreeing neighbor — il problema, i problemi, problemi complessi">
  <text x="180" y="70" text-anchor="middle" font-size="18" class="s-muted">singular</text>
  <text x="430" y="70" text-anchor="middle" font-size="18" class="s-muted">plural</text>
  <text x="680" y="70" text-anchor="middle" font-size="18" class="s-muted">agreeing neighbor</text>
  <rect x="80" y="90" width="200" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="330" y="90" width="200" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="580" y="90" width="220" height="58" rx="12" class="s-teal"/>
  <text x="180" y="128" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">il problema</text>
  <text x="430" y="128" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">i problemi</text>
  <text x="690" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">problemi complessi</text>
  <rect x="80" y="170" width="200" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="330" y="170" width="200" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="580" y="170" width="220" height="58" rx="12" class="s-teal"/>
  <text x="180" y="208" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">la città</text>
  <text x="430" y="208" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">le città</text>
  <text x="690" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">città intelligenti</text>
  <rect x="80" y="250" width="200" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="330" y="250" width="200" height="58" rx="12" class="s-tile" stroke-width="2"/>
  <rect x="580" y="250" width="220" height="58" rx="12" class="s-teal"/>
  <text x="180" y="288" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">l'uovo</text>
  <text x="430" y="288" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">le uova</text>
  <text x="690" y="288" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">uova fresche</text>
  <text x="420" y="360" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">three parts, one memory</text>
  <text x="420" y="410" text-anchor="middle" font-size="20" class="s-muted">never store a naked citation form</text>
</svg>

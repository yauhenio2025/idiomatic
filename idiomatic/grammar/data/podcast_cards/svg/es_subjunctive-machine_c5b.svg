<svg viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three pebbles: assertion versus stance, same subject compresses, and the si firewall">
  <ellipse cx="170" cy="252" rx="112" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="430" cy="256" rx="122" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="692" cy="260" rx="132" ry="16" class="s-dead" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="110" ry="78" class="s-tile" stroke-width="3"/>
  <ellipse cx="430" cy="172" rx="120" ry="82" class="s-tile" stroke-width="3"/>
  <ellipse cx="692" cy="174" rx="132" ry="86" class="s-tile" stroke-width="3"/>
  <text x="170" y="162" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">Sé que <tspan class="s-muted">viene</tspan></text>
  <text x="170" y="196" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">Quiero que <tspan font-weight="800" class="s-teal">venga</tspan></text>
  <text x="430" y="184" text-anchor="middle" font-size="24" font-weight="800" class="s-teal">publicar</text>
  <text x="692" y="170" text-anchor="middle" font-size="23" font-weight="800" class="s-teal">si tengo · si tuviera</text>
  <text x="692" y="204" text-anchor="middle" font-size="17" font-weight="700" class="s-coral">never the present subjunctive</text>
  <text x="170" y="300" text-anchor="middle" font-size="18" class="s-muted">assertion vs stance</text>
  <text x="430" y="300" text-anchor="middle" font-size="18" class="s-muted">same subject compresses</text>
  <text x="692" y="300" text-anchor="middle" font-size="18" class="s-muted">the open-condition firewall</text>
  <text x="420" y="352" text-anchor="middle" font-size="22" font-weight="700" class="s-teal">sea · esté · vaya · haya · sepa · dé — the tiny core</text>
</svg>

<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="quando eu vou voltar corrected to quando eu voltar — no going-to inside the gate">
  <text x="420" y="90" text-anchor="middle" font-size="30" font-weight="700" class="s-dead" text-decoration="line-through">quando eu vou voltar…</text>
  <line x1="420" y1="115" x2="420" y2="150" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="420,172 406,147 434,147" class="s-teal"/>
  <rect x="200" y="190" width="18" height="110" rx="6" class="s-teal"/>
  <rect x="622" y="190" width="18" height="110" rx="6" class="s-teal"/>
  <rect x="200" y="182" width="440" height="16" rx="6" class="s-teal"/>
  <text x="420" y="262" text-anchor="middle" font-size="33" font-weight="800" class="s-teal">quando eu voltar</text>
  <text x="420" y="335" text-anchor="middle" font-size="24" font-weight="700" class="s-ink">…eu <tspan font-weight="800">vou</tspan> ajustar os cartões</text>
  <text x="420" y="366" text-anchor="middle" font-size="17" class="s-muted">the spoken future stays out here, in the main clause</text>
  <text x="420" y="404" text-anchor="middle" font-size="20" class="s-muted">no “going to” inside the gate</text>
</svg>

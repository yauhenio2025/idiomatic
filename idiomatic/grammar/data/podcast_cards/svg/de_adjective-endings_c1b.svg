<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rotate the case: der neue, den neuen, mit dem neuen Bericht. Rotate the determiner: ein neuer, unser neuer, neuer Bericht">
  <text x="230" y="65" text-anchor="middle" font-size="19" class="s-muted">rotate the case</text>
  <text x="230" y="125" text-anchor="middle" font-size="27" class="s-ink">der neu<tspan font-weight="800" class="s-teal">e</tspan> Bericht</text>
  <text x="230" y="185" text-anchor="middle" font-size="27" class="s-ink">den neu<tspan font-weight="800" class="s-teal">en</tspan> Bericht</text>
  <text x="230" y="245" text-anchor="middle" font-size="27" class="s-ink">mit dem neu<tspan font-weight="800" class="s-teal">en</tspan> Bericht</text>
  <line x1="430" y1="50" x2="430" y2="270" class="s-stroke-line" stroke-width="2"/>
  <text x="630" y="65" text-anchor="middle" font-size="19" class="s-muted">rotate the determiner</text>
  <text x="630" y="125" text-anchor="middle" font-size="27" class="s-ink">ein neu<tspan font-weight="800" class="s-coral">er</tspan> Bericht</text>
  <text x="630" y="185" text-anchor="middle" font-size="27" class="s-ink">unser neu<tspan font-weight="800" class="s-coral">er</tspan> Bericht</text>
  <text x="630" y="245" text-anchor="middle" font-size="27" class="s-ink">neu<tspan font-weight="800" class="s-coral">er</tspan> Bericht</text>
  <text x="420" y="330" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">same noun, same meaning — the endings follow the decisions</text>
  <text x="420" y="390" text-anchor="middle" font-size="20" class="s-muted">hear the ending as an output, never a guess</text>
</svg>

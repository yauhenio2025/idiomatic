<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three strong gates take the future subjunctive; antes que and caso run on the present subjunctive; sempre que with a habit stays indicative">
  <text x="420" y="60" text-anchor="middle" font-size="19" class="s-muted">learn gates as constructions — not trigger words</text>
  <rect x="70" y="90" width="340" height="180" rx="16" class="s-teal"/>
  <text x="240" y="130" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">the three strong gates</text>
  <text x="240" y="175" text-anchor="middle" font-size="18" fill="#ffffff">pending time — quando · assim que</text>
  <text x="240" y="210" text-anchor="middle" font-size="18" fill="#ffffff">open condition — se</text>
  <text x="240" y="245" text-anchor="middle" font-size="18" fill="#ffffff">open slot — quem · onde · o que</text>
  <rect x="440" y="90" width="330" height="110" rx="16" class="s-coral"/>
  <text x="605" y="130" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">a different machine</text>
  <text x="605" y="172" text-anchor="middle" font-size="20" fill="#ffffff">antes que · para que · caso</text>
  <text x="605" y="245" text-anchor="middle" font-size="18" class="s-muted">→ present subjunctive, even for future acts</text>
  <line x1="90" y1="300" x2="750" y2="300" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="350" text-anchor="middle" font-size="25" font-weight="700" class="s-ink">Sempre que <tspan class="s-muted">tenho</tspan> uma dúvida, escrevo…</text>
  <text x="420" y="385" text-anchor="middle" font-size="17" class="s-muted">a habit stays indicative — even under a familiar trigger word</text>
  <text x="420" y="422" text-anchor="middle" font-size="20" class="s-muted">future meaning alone chooses nothing</text>
</svg>

<svg viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mixed-family holes: ein neuer Bericht, ein neues Ziel, kein kohärentes Weltbild, mein ultimatives Ziel">
  <text x="230" y="60" text-anchor="middle" font-size="19" class="s-muted">the determiner is silent — the hole</text>
  <text x="230" y="120" text-anchor="middle" font-size="26" class="s-ink">ein neu<tspan font-weight="800" class="s-coral">er</tspan> Bericht</text>
  <text x="230" y="180" text-anchor="middle" font-size="26" class="s-ink">ein neu<tspan font-weight="800" class="s-coral">es</tspan> Ziel</text>
  <text x="230" y="240" text-anchor="middle" font-size="26" class="s-ink">kein kohärent<tspan font-weight="800" class="s-coral">es</tspan> Weltbild</text>
  <text x="230" y="300" text-anchor="middle" font-size="26" class="s-ink">mein ultimativ<tspan font-weight="800" class="s-coral">es</tspan> Ziel</text>
  <line x1="470" y1="45" x2="470" y2="320" class="s-stroke-line" stroke-width="2"/>
  <text x="655" y="60" text-anchor="middle" font-size="19" class="s-muted">the determiner speaks — quiet</text>
  <text x="655" y="120" text-anchor="middle" font-size="26" class="s-ink">ein<tspan font-weight="800" class="s-teal">e</tspan> neu<tspan font-weight="700" class="s-muted">e</tspan> Studie</text>
  <text x="655" y="180" text-anchor="middle" font-size="26" class="s-ink">mit ein<tspan font-weight="800" class="s-teal">em</tspan> neu<tspan font-weight="700" class="s-muted">en</tspan> Bericht</text>
  <text x="655" y="240" text-anchor="middle" font-size="26" class="s-ink">mein<tspan font-weight="800" class="s-teal">e</tspan> neu<tspan font-weight="700" class="s-muted">en</tspan> Bücher</text>
  <text x="420" y="360" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">is the decisive cell exposed? then the adjective fills it</text>
  <text x="420" y="410" text-anchor="middle" font-size="20" class="s-muted">masculine nominative · neuter nominative · neuter accusative — the three holes</text>
</svg>

<svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A naked noun hides its gender; the packet cette période says it out loud">
  <rect x="60" y="110" width="220" height="74" rx="14" class="s-tile" stroke-width="2"/>
  <text x="170" y="158" text-anchor="middle" font-size="30" font-weight="700" class="s-dead">période</text>
  <text x="170" y="225" text-anchor="middle" font-size="18" class="s-muted">naked — silent about gender</text>
  <line x1="320" y1="147" x2="405" y2="147" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="430,147 402,133 402,161" class="s-teal"/>
  <rect x="470" y="110" width="120" height="74" rx="12" class="s-coral"/>
  <text x="530" y="158" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">cette</text>
  <rect x="598" y="110" width="180" height="74" rx="12" class="s-tile" stroke-width="2"/>
  <text x="688" y="158" text-anchor="middle" font-size="28" font-weight="700" class="s-ink">période</text>
  <text x="624" y="225" text-anchor="middle" font-size="18" class="s-muted">the packet says feminine out loud</text>
  <text x="420" y="320" text-anchor="middle" font-size="21" class="s-muted">never store a naked noun — store the packet</text>
</svg>

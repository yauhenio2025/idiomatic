<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sé que keeps publicas in the indicative; Quiero que flips it to publiques">
  <rect x="90" y="70" width="200" height="66" rx="12" class="s-tile" stroke-width="2"/>
  <text x="190" y="113" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">Sé que</text>
  <line x1="310" y1="103" x2="380" y2="103" class="s-stroke-line" stroke-width="4" stroke-linecap="round"/>
  <polygon points="402,103 376,90 376,116" class="s-dead"/>
  <rect x="420" y="70" width="230" height="66" rx="12" class="s-tile" stroke-width="2"/>
  <text x="535" y="113" text-anchor="middle" font-size="27" font-weight="700" class="s-ink">publicas</text>
  <text x="740" y="113" text-anchor="middle" font-size="19" class="s-muted">asserted</text>
  <rect x="90" y="210" width="200" height="66" rx="12" class="s-coral"/>
  <text x="190" y="253" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">Quiero que</text>
  <line x1="310" y1="243" x2="380" y2="243" class="s-stroke-teal" stroke-width="5" stroke-linecap="round"/>
  <polygon points="402,243 376,230 376,256" class="s-teal"/>
  <rect x="420" y="210" width="230" height="66" rx="12" class="s-teal"/>
  <text x="535" y="253" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">publiques</text>
  <text x="740" y="253" text-anchor="middle" font-size="19" class="s-muted">stance</text>
  <text x="420" y="360" text-anchor="middle" font-size="21" class="s-muted">assertion keeps the indicative — a stance flips the machine</text>
</svg>

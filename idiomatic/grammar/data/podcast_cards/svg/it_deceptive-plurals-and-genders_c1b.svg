<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Regular defaults: il libro i libri masculine, la ricerca le ricerche feminine, il paese and la legge share plural -i">
  <text x="230" y="70" text-anchor="middle" font-size="19" font-weight="700" class="s-teal">masculine</text>
  <text x="230" y="130" text-anchor="middle" font-size="28" class="s-ink">il libr<tspan font-weight="800" class="s-teal">o</tspan> → i libr<tspan font-weight="800" class="s-teal">i</tspan></text>
  <text x="620" y="70" text-anchor="middle" font-size="19" font-weight="700" class="s-coral">feminine</text>
  <text x="620" y="130" text-anchor="middle" font-size="28" class="s-ink">la ricerc<tspan font-weight="800" class="s-coral">a</tspan> → le ricerch<tspan font-weight="800" class="s-coral">e</tspan></text>
  <line x1="120" y1="175" x2="720" y2="175" class="s-stroke-line" stroke-width="2"/>
  <text x="420" y="218" text-anchor="middle" font-size="19" class="s-muted">the early warning — one singular ending, both genders</text>
  <text x="230" y="272" text-anchor="middle" font-size="28" class="s-ink"><tspan font-weight="800" class="s-teal">il</tspan> paese → i paesi</text>
  <text x="620" y="272" text-anchor="middle" font-size="28" class="s-ink"><tspan font-weight="800" class="s-coral">la</tspan> legge → le leggi</text>
  <text x="420" y="330" text-anchor="middle" font-size="22" font-weight="700" class="s-ink">the final vowel doesn't determine gender — the article does</text>
  <text x="420" y="390" text-anchor="middle" font-size="20" class="s-muted">defaults first — the liars only make sense against them</text>
</svg>

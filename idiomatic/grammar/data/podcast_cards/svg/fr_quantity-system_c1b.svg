<svg viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The three sounds: de, des, du">
  <circle cx="170" cy="165" r="98" class="s-dead"/>
  <circle cx="420" cy="165" r="98" class="s-sun"/>
  <circle cx="670" cy="165" r="98" class="s-teal"/>
  <text x="170" y="185" text-anchor="middle" font-size="58" font-weight="700" class="s-ink">de</text>
  <text x="420" y="185" text-anchor="middle" font-size="58" font-weight="700" class="s-ink">des</text>
  <text x="670" y="185" text-anchor="middle" font-size="58" font-weight="700" fill="#ffffff">du</text>
  <text x="170" y="316" text-anchor="middle" font-size="30" font-weight="700" class="s-ink">“duh”</text>
  <text x="420" y="316" text-anchor="middle" font-size="30" font-weight="700" class="s-ink">“day”</text>
  <text x="670" y="316" text-anchor="middle" font-size="30" font-weight="700" class="s-ink">tight «u»</text>
  <text x="170" y="348" text-anchor="middle" font-size="19" class="s-muted">lazy, colorless vowel</text>
  <text x="420" y="348" text-anchor="middle" font-size="19" class="s-muted">brighter, clearer vowel</text>
  <text x="670" y="348" text-anchor="middle" font-size="19" class="s-muted">lips rounded</text>
  <text x="170" y="398" text-anchor="middle" font-size="21" font-weight="700" class="s-teal">un verre de vin</text>
  <text x="420" y="398" text-anchor="middle" font-size="21" font-weight="700" class="s-teal">des amis</text>
  <text x="670" y="398" text-anchor="middle" font-size="21" font-weight="700" class="s-teal">du pain</text>
</svg>

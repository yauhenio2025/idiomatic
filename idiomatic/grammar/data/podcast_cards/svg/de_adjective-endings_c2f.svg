<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Weak after definite article, mixed after ein kein mein, strong with no determiner">
  <rect x="70" y="70" width="150" height="62" rx="12" class="s-teal"/>
  <text x="145" y="110" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">der</text>
  <text x="310" y="110" text-anchor="middle" font-size="26" class="s-ink">neu<tspan font-weight="700" class="s-muted">e</tspan></text>
  <text x="620" y="110" text-anchor="middle" font-size="21" font-weight="700" class="s-teal">weak — adjective quiet</text>
  <rect x="70" y="180" width="150" height="62" rx="12" class="s-sun"/>
  <text x="145" y="220" text-anchor="middle" font-size="26" font-weight="800" class="s-ink">ein</text>
  <text x="310" y="220" text-anchor="middle" font-size="26" class="s-ink">neu<tspan font-weight="800" class="s-coral">er</tspan></text>
  <text x="620" y="220" text-anchor="middle" font-size="21" font-weight="700" class="s-ink">mixed — fills the holes</text>
  <rect x="70" y="290" width="150" height="62" rx="12" class="s-stroke-line" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="145" y="330" text-anchor="middle" font-size="26" font-weight="700" class="s-dead">∅</text>
  <text x="310" y="330" text-anchor="middle" font-size="26" class="s-ink">neu<tspan font-weight="800" class="s-coral">er</tspan></text>
  <text x="620" y="330" text-anchor="middle" font-size="21" font-weight="700" class="s-coral">strong — adjective leads</text>
  <text x="420" y="425" text-anchor="middle" font-size="20" class="s-muted">one signaling job, three ways to share it — look left of the adjective</text>
</svg>

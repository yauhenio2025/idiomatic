schema_version: 1
language: Brazilian Portuguese
language_code: pt
target_variety: "Brazilian Portuguese; você/vocês baseline"
scope: "Distilled grammar inventory, approximately A2-C1"
as_of: "2026-08-01"
level_semantics: >-
  Every level is approximate. FUNAG explicitly calls its CEFR crosswalk
  approximate and spiral; Camões describes European Portuguese. Concrete C1
  structures are hypotheses constrained by Brazilian proficiency outcomes.
sources:
  - id: camoes
    url: "https://www.instituto-camoes.pt/images/REFERENCIAL_ebook.pdf"
    role: "Open CEFR-sequenced A1-C2 inventory."
    limitation: "European Portuguese and illustrative rather than exhaustive."
  - id: funag
    url: "https://funag.gov.br/biblioteca-nova/pdf/mostraPdf/21/1124/proposta_curricular_para_ensino_de_portugues_nas_unidades_da_rede_de_ensino_do_itamaraty_em_paises_de_lingua_oficial_espanhola"
    role: "Brazilian curriculum for Spanish-speaking learners; approximate A2-C1 crosswalk."
    limitation: "Spiral syllabus and approximate levels; C1 is mainly functional."
  - id: celpe_faq
    url: "https://www.gov.br/inep/pt-br/acesso-a-informacao/perguntas-frequentes/celpe-bras"
    role: "Authoritative Brazilian proficiency construct."
    limitation: "Not a grammar checklist."
  - id: celpe_base
    url: "https://download.inep.gov.br/publicacoes/institucionais/avaliacoes_e_exames_da_educacao_basica/documento_base_do_exame_celpe_bras.pdf"
    role: "Performance, genre, and register constraints."
    limitation: "Does not assign structures to CEFR levels."
conflicts:
  - "Camões is European Portuguese; clitic placement, address/person paradigms, progressive forms, and future usage require Brazilian adaptation."
  - "The product's Brazilian target follows FUNAG/Celpe-Bras where Camões conflicts."

topics:
